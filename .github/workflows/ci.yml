name: Continuous Integration

on:
  push:
    branches:
    - main
    tags:
    - 'v*'
  pull_request:
  workflow_dispatch:

# A PR that gets pushed to twice in a minute used to run every job three times
# over. Superseded runs on the same ref are cancelled; runs on main and on tags
# publish artifacts, so those are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which areas of the repo the diff touches. Every other job reads these
  # outputs to decide what is worth running: a change under
  # components/otto-rdp does not need the compositor's headless suite, and a
  # change under src/ does not need otto-rdp's GStreamer bin rebuilt.
  #
  # Anything shared (the workspace manifest, the toolchain, the UI toolkit
  # every component links, this file) sets *every* flag. A lockfile change
  # sets the flags whose crates' dependency closures it touched — the safe
  # default is to run more, never less.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      compositor: ${{ steps.filter.outputs.compositor }}
      ui: ${{ steps.filter.outputs.ui }}
      rdp: ${{ steps.filter.outputs.rdp }}
      portal: ${{ steps.filter.outputs.portal }}
      packaging: ${{ steps.filter.outputs.packaging }}
      rust: ${{ steps.filter.outputs.rust }}
      files: ${{ steps.filter.outputs.files }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          all=false

          # workflow_dispatch, a tag build, or a first push to a new branch has
          # no usable base to diff against: treat everything as changed.
          if [ -z "${BASE_SHA:-}" ] \
             || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
              echo "no diff base ($BASE_SHA); running everything"
              FILES='__all__'
              all=true
          else
              FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
              echo "changed files:"
              echo "$FILES" | sed 's/^/  /'
          fi

          # Matches any path, so a missing base turns every filter on.
          if [ "$FILES" = '__all__' ]; then FILES=$(git ls-files); fi

          # A here-string, not `echo | grep -q`: grep -q exits on the first
          # match, and under pipefail the SIGPIPE echo gets reads as no match.
          matches() { grep -qE "$1" <<< "$FILES"; }

          # Nothing in the tree is unaffected by these.
          SHARED='^(Cargo\.toml|rust-toolchain\.toml)$|^\.github/workflows/ci\.yml$'
          # The lockfile is scoped per area by the dependency closures it
          # records (scripts/ci-lock-scope.py), not treated as shared: adding
          # a crate to the launcher should not rebuild the RDP bridge.
          LOCK='^Cargo\.lock$'
          # The UI toolkit: linked by otto and by every component except the
          # RDP bridge and the portal backend, which are leaf crates (verified
          # with `cargo tree -p <crate> | grep otto-kit`).
          KIT='^components/otto-kit/'
          # resources/bin and resources/plugins are installed files that no
          # crate reads; they only reach the packaging jobs. resources/locales
          # counts as UI below: the catalogues are strings, which the locales
          # job and the workspace unit tests cover, not the headless suites.
          COMPOSITOR='^(src|tests|protocols)/|^resources/(?!bin/|plugins/|locales/)|^otto_config.*\.toml$'
          RDP='^components/otto-rdp/'
          PORTAL='^components/xdg-desktop-portal-otto/'
          # Every component except the two with their own filters above.
          UI='^components/(?!otto-rdp/|xdg-desktop-portal-otto/)|^sample-clients/|^resources/locales/'
          # The file browser and the two crates only it links (verified with
          # `cargo tree -p otto-files --depth 1`). Its unit tests are the
          # largest suite in the workspace, so they run only when it changed.
          BROWSER='^components/(otto-files|otto-peek|otto-media-kit)/'
          PACKAGING='^PKGBUILD|^(Cargo\.toml)$|^(resources|scripts)/|^\.github/workflows/ci\.yml$'

          matchesP() { grep -qP "$1" <<< "$FILES"; }

          shared=false; matches "$SHARED" && shared=true
          kit=false; matches "$KIT" && kit=true

          lock_compositor=false; lock_rdp=false; lock_portal=false
          lock_files=false; lock_ui=false
          if matches "$LOCK" && ! $all && ! $shared \
             && scope=$(python3 scripts/ci-lock-scope.py "$BASE_SHA" "$HEAD_SHA"); then
              eval "$(echo "$scope" | sed 's/^/lock_/')"
              echo "lockfile reaches: compositor=$lock_compositor rdp=$lock_rdp portal=$lock_portal files=$lock_files ui=$lock_ui"
          elif matches "$LOCK"; then
              # No base to diff, or the scope script failed: run everything.
              shared=true
          fi

          for name in compositor rdp portal; do
              case $name in
                  # otto-kit reaches the compositor and the UI components, but
                  # not the two leaf crates below.
                  compositor) pat=$COMPOSITOR; extra=$kit ;;
                  rdp)        pat=$RDP;        extra=false ;;
                  portal)     pat=$PORTAL;     extra=false ;;
              esac
              lock=lock_$name
              if $shared || $extra || ${!lock} || matchesP "$pat"; then v=true; else v=false; fi
              echo "$name=$v" >> "$GITHUB_OUTPUT"
              eval "$name=$v"
          done

          # -P for the negative lookahead; plain -E cannot express it.
          if $shared || $kit || $lock_ui || matchesP "$UI"; then ui=true; else ui=false; fi
          echo "ui=$ui" >> "$GITHUB_OUTPUT"

          if $shared || $kit || $lock_files || matches "$BROWSER"; then files=true; else files=false; fi
          echo "files=$files" >> "$GITHUB_OUTPUT"

          if matches "$PACKAGING"; then packaging=true; else packaging=false; fi
          echo "packaging=$packaging" >> "$GITHUB_OUTPUT"

          if $compositor || $ui || $rdp || $portal; then rust=true; else rust=false; fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"

          echo "--- compositor=$compositor ui=$ui files=$files rdp=$rdp portal=$portal packaging=$packaging rust=$rust"

  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-rust_stable-${{ hashFiles('**/Cargo.toml') }}
      - name: Format
        run: cargo fmt --all -- --check

  # Cheap and early: a locale missing keys otherwise only surfaces in the
  # otto-kit unit tests, after the compositor has been built and linted.
  locales:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Catalogues carry every en-GB key
        run: python3 scripts/check-locales.py
      - name: The otto-help skill ships the current user guides
        run: scripts/sync-skill-docs.sh --check

  # A check of its own, never gated: Otto claims to implement the Agent Host
  # Protocol, and this is the evidence for that claim. It runs the corpora
  # upstream ships for the purpose — every reducer case and every wire
  # round-trip in spec/upstream/types/test-cases — against the types and
  # reducers the service is built on. otto-agents is pure Rust with no system
  # libraries, so it needs none of the compositor's build dependencies and
  # does not wait behind them.
  ahp-conformance:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
      - name: Cargo cache (registry + target)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ahp-conformance
          cache-on-failure: true
      - name: The vendored spec and the AHP crates agree
        run: cargo test --locked -p otto-agents --test spec_pin
      - name: The AHP conformance corpora pass
        run: cargo test --locked -p otto-agents --test conformance
  
  # One job rather than several: every step shares a single target directory,
  # so splitting them apart would pay for the compositor's dependency graph
  # once per job. Individual steps are gated instead.
  check:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - name: Cargo cache (registry + target)
        uses: Swatinem/rust-cache@v2
        with:
          # Shared with build-deb/rpm/arch — cache accumulates debug + release
          # artifacts so successive jobs can incrementally compile.
          shared-key: workspace-build
          cache-on-failure: true
      - name: System dependencies
        run: sudo apt-get update; sudo apt-get install -y libdrm-dev libudev-dev libgbm-dev libxkbcommon-dev libegl1-mesa-dev libwayland-dev libinput-dev libdbus-1-dev libsystemd-dev libseat-dev libpipewire-0.3-dev libfreetype-dev libfontconfig-dev libdisplay-info-dev libpixman-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libpam0g-dev hicolor-icon-theme fonts-dejavu-core
      # Clippy mirrors the test steps below: every crate CI compiles is
      # linted, and each area is linted only when that area changed.
      # `--all-targets` reaches tests, examples and benches, and the headless
      # feature is what makes tests/*.rs more than an empty file.
      - name: Clippy (compositor)
        if: needs.changes.outputs.compositor == 'true'
        run: cargo clippy --locked -p otto --all-targets --features "default,headless" -- -D warnings
      - name: Clippy (compositor without XWayland)
        # `xwayland` is a default feature that packagers can drop; nothing else
        # compiles that configuration, so it breaks silently without this.
        if: needs.changes.outputs.compositor == 'true'
        run: cargo clippy --locked -p otto --no-default-features --features "egl,winit,udev,renderer_sync" -- -D warnings
      - name: Clippy (components)
        # Everything with no filter of its own, sample clients included.
        # submenu-gtk is the one exception: it needs GTK development libraries
        # that no job here installs, and nothing in CI compiles it — the
        # release build names its packages explicitly, and `--lib --workspace`
        # skips it because it has no lib target.
        if: needs.changes.outputs.ui == 'true'
        run: cargo clippy --locked --workspace --exclude otto --exclude otto-rdp --exclude xdg-desktop-portal-otto --exclude submenu-gtk --all-targets -- -D warnings
      - name: Clippy (RDP bridge)
        if: needs.changes.outputs.rdp == 'true'
        run: cargo clippy --locked -p otto-rdp --all-targets -- -D warnings
      - name: Clippy (portal backend)
        if: needs.changes.outputs.portal == 'true'
        run: cargo clippy --locked -p xdg-desktop-portal-otto --all-targets -- -D warnings
      - name: Run tests
        timeout-minutes: 20
        # otto-rdp is bin-only, so this never covers it — see the RDP step.
        # otto-files has its own step below, gated on its own paths.
        if: needs.changes.outputs.compositor == 'true' || needs.changes.outputs.ui == 'true'
        run: cargo test --locked --lib --workspace --exclude otto-files
      - name: Run file browser tests
        timeout-minutes: 15
        if: needs.changes.outputs.files == 'true'
        run: cargo test --locked --lib -p otto-files
      - name: Run agent service tests
        timeout-minutes: 15
        # The workspace step above is --lib, so the agent service's integration
        # tests — the protocol handshake, the spec pin, permissions and
        # escalation — need a target-wide run of their own.
        if: needs.changes.outputs.ui == 'true'
        run: cargo test --locked -p otto-agents
      - name: Run headless integration tests
        timeout-minutes: 15
        if: needs.changes.outputs.compositor == 'true'
        run: cargo test --locked --features headless --test headless_basic
      - name: Run shell interaction tests
        timeout-minutes: 15
        if: needs.changes.outputs.compositor == 'true'
        run: cargo test --locked --features headless --test workspace_selector --test app_switcher --test tiling --test dnd_icons
      - name: Run screencast integration tests
        timeout-minutes: 15
        if: needs.changes.outputs.compositor == 'true' || needs.changes.outputs.portal == 'true'
        run: cargo test --locked --features headless --test screenshare
      - name: Run RDP bridge integration tests
        timeout-minutes: 15
        # The compositor half of the bridge: the protocols otto-rdp drives.
        if: needs.changes.outputs.compositor == 'true' || needs.changes.outputs.rdp == 'true'
        run: cargo test --locked --features headless --test rdp_bridge
      - name: Run RDP bridge unit tests
        timeout-minutes: 20
        # The bridge half. Expensive (GStreamer), and nothing outside
        # components/otto-rdp can affect it, so it is gated tightly.
        if: needs.changes.outputs.rdp == 'true'
        run: cargo test --locked -p otto-rdp
      - name: Run portal backend tests
        timeout-minutes: 15
        if: needs.changes.outputs.portal == 'true'
        run: cargo test --locked -p xdg-desktop-portal-otto
      - name: Run font matching tests
        timeout-minutes: 10
        if: needs.changes.outputs.compositor == 'true'
        run: cargo test --locked --lib -p otto -- workspaces::utils::tests --ignored
  
  # Every packaged binary is compiled exactly once here. build-deb, build-rpm
  # and build-arch consume this artifact; each used to run an identical
  # `cargo build --release`, so the same binaries were built three times per
  # run and the cost grew with every component added.
  build-binaries:
    # Package builds only run on merge to main and tags, not on every PR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
      - name: Cargo cache (registry + target)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-build
          cache-on-failure: true
      - name: System dependencies
        run: sudo apt-get update; sudo apt-get install -y libdrm-dev libudev-dev libgbm-dev libxkbcommon-dev libegl1-mesa-dev libwayland-dev libinput-dev libdbus-1-dev libsystemd-dev libseat-dev libpipewire-0.3-dev libfreetype-dev libfontconfig-dev libdisplay-info-dev libpixman-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libpam0g-dev hicolor-icon-theme fonts-dejavu-core
      - name: Build workspace binaries
        run: cargo build --locked --release -p otto -p otto-bar -p otto-islands -p otto-lock -p otto-greeter -p otto-rdp -p xdg-desktop-portal-otto -p otto-settings -p otto-files -p otto-launcher -p otto-emoji -p otto-peek -p otto-media-kit -p otto-msg -p otto-agents
      - name: Upload workspace binaries
        uses: actions/upload-artifact@v4
        with:
          name: otto-binaries
          path: |
            target/release/otto
            target/release/otto-bar
            target/release/otto-islands
            target/release/otto-lock
            target/release/otto-greeter
            target/release/otto-rdp
            target/release/xdg-desktop-portal-otto
            target/release/otto-settings
            target/release/otto-files
            target/release/otto-launcher
            target/release/otto-emoji
            target/release/otto-peek
            target/release/otto-media-worker
            target/release/otto-msg
            target/release/otto-agents
          retention-days: 1

  build-deb:
    if: github.event_name != 'pull_request'
    needs: build-binaries
    runs-on: ubuntu-24.04
    env:
      # A tag build is a release and carries the workspace version as it is;
      # anything else is a nightly, versioned as the release it was built
      # from plus the commits since (scripts/packaging/version.sh).
      OTTO_NIGHTLY: ${{ startsWith(github.ref, 'refs/tags/v') && '0' || '1' }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          # The nightly version counts the commits on main, so the whole
          # history is needed; a shallow clone would number every build r1.
          fetch-depth: 0
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
      - name: System dependencies
        # Nothing is compiled here, but dpkg-shlibdeps reads the binaries to
        # resolve runtime dependencies, so the shared libraries must be present.
        run: sudo apt-get update; sudo apt-get install -y libdrm-dev libudev-dev libgbm-dev libxkbcommon-dev libegl1-mesa-dev libwayland-dev libinput-dev libdbus-1-dev libsystemd-dev libseat-dev libpipewire-0.3-dev libfreetype-dev libfontconfig-dev libdisplay-info-dev libpixman-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libpam0g-dev hicolor-icon-theme fonts-dejavu-core
      - name: Cargo cache (packaging tools)
        uses: Swatinem/rust-cache@v2
        with:
          # Separate from workspace-build: this job downloads target/release
          # rather than building it, so caching ./target would serve stale
          # binaries. Only ~/.cargo is wanted, for the installed tool.
          shared-key: packaging-tools
          cache-targets: "false"
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked
      - name: Download workspace binaries
        uses: actions/download-artifact@v4
        with:
          name: otto-binaries
          path: target/release
      - name: Restore executable bits
        # upload-artifact does not preserve the executable bit.
        run: chmod +x target/release/*
      - name: Build Debian package
        run: scripts/packaging/build-deb.sh
      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: otto-deb
          path: target/debian/*.deb
          retention-days: 30

  build-rpm:
    if: github.event_name != 'pull_request'
    needs: build-binaries
    runs-on: ubuntu-24.04
    env:
      # A tag build is a release and carries the workspace version as it is;
      # anything else is a nightly, versioned as the release it was built
      # from plus the commits since (scripts/packaging/version.sh).
      OTTO_NIGHTLY: ${{ startsWith(github.ref, 'refs/tags/v') && '0' || '1' }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          # The nightly version counts the commits on main, so the whole
          # history is needed; a shallow clone would number every build r1.
          fetch-depth: 0
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
      - name: System dependencies
        run: sudo apt-get update; sudo apt-get install -y libdrm-dev libudev-dev libgbm-dev libxkbcommon-dev libegl1-mesa-dev libwayland-dev libinput-dev libdbus-1-dev libsystemd-dev libseat-dev libpipewire-0.3-dev libfreetype-dev libfontconfig-dev libdisplay-info-dev libpixman-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libpam0g-dev hicolor-icon-theme fonts-dejavu-core
      - name: Cargo cache (packaging tools)
        uses: Swatinem/rust-cache@v2
        with:
          # Separate from workspace-build: this job downloads target/release
          # rather than building it, so caching ./target would serve stale
          # binaries. Only ~/.cargo is wanted, for the installed tool.
          shared-key: packaging-tools
          cache-targets: "false"
      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm --locked
      - name: Download workspace binaries
        uses: actions/download-artifact@v4
        with:
          name: otto-binaries
          path: target/release
      - name: Restore executable bits
        run: chmod +x target/release/*
      - name: Build RPM package
        run: scripts/packaging/build-rpm.sh
      - name: Upload RPM package
        uses: actions/upload-artifact@v4
        with:
          name: otto-rpm
          path: target/generate-rpm/*.rpm
          retention-days: 30

  build-arch:
    if: github.event_name != 'pull_request'
    needs: build-binaries
    runs-on: ubuntu-24.04
    # No Rust toolchain or system libraries: this job only assembles a tarball.
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          # The nightly version counts the commits on main, so the whole
          # history is needed; a shallow clone would number every build r1.
          fetch-depth: 0
      - name: Download workspace binaries
        uses: actions/download-artifact@v4
        with:
          name: otto-binaries
          path: target/release
      - name: Restore executable bits
        run: chmod +x target/release/*
      - name: Build Arch tarball
        # The file list lives in the script, not here, so the packaging
        # test can assemble the same tarball and check it against the
        # PKGBUILDs that install out of it. Alongside the tarball it writes
        # the fixed-name copy the nightly publishes and the
        # PKGBUILD-nightly-bin pinned to it.
        run: scripts/packaging/make-arch-tarball.sh dist
      - name: Upload Arch tarball
        uses: actions/upload-artifact@v4
        with:
          name: otto-arch
          path: |
            dist/otto-*.tar.gz
            dist/PKGBUILD-nightly-bin
          retention-days: 30

  publish-nightly:
    # Only main that passed its tests is worth a nightly: a commit that
    # fails `check` is not published, rather than handed to everyone on the
    # nightly channel. `check` is skipped when nothing Rust changed, which
    # counts as passing — but only when `changes` itself succeeded, since a
    # failed classifier skips `check` too. The other two never skip.
    needs: [changes, check, locales, ahp-conformance, build-arch, build-deb, build-rpm]
    if: >-
      ${{ !cancelled()
          && github.event_name == 'push' && github.ref == 'refs/heads/main'
          && needs.changes.result == 'success'
          && (needs.check.result == 'success' || needs.check.result == 'skipped')
          && needs.locales.result == 'success'
          && needs.ahp-conformance.result == 'success'
          && needs.build-arch.result == 'success'
          && needs.build-deb.result == 'success'
          && needs.build-rpm.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout sources
        # For the tag push below, and the commit subject in the notes.
        uses: actions/checkout@v4
      - name: Download Arch tarball
        uses: actions/download-artifact@v4
        with:
          name: otto-arch
          path: artifacts/arch
      - name: Download .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: otto-deb
          path: artifacts/deb
      - name: Download .rpm artifact
        uses: actions/download-artifact@v4
        with:
          name: otto-rpm
          path: artifacts/rpm
      # The nightly release is reused by every build, so its assets carry no
      # version in their names: the download URLs in the instructions below
      # have to keep working from one night to the next. The version is
      # inside the packages instead (1.4.1+nightly.r123.gabc1234), which is
      # what lets a nightly install over the release and the next nightly
      # over it.
      - name: Names that do not change from night to night
        run: |
          mkdir -p nightly
          cp artifacts/deb/*.deb nightly/otto-nightly-amd64.deb
          cp artifacts/rpm/*.rpm nightly/otto-nightly-x86_64.rpm
          cp artifacts/arch/otto-nightly-x86_64.tar.gz artifacts/arch/PKGBUILD-nightly-bin nightly/
          ls -l nightly
      - name: Release notes
        run: |
          subject=$(git log -1 --format=%s "$GITHUB_SHA")
          cat > notes.md <<EOF
          Automated nightly build from the latest commit on \`main\`. Expect
          rough edges; the [latest release](https://github.com/nongio/otto/releases/latest)
          is the one to run if you want a working desktop.

          Built from [\`${GITHUB_SHA::7}\`](https://github.com/nongio/otto/commit/$GITHUB_SHA)
          — $subject — on $(date -u +'%Y-%m-%d %H:%M UTC').

          ### Debian/Ubuntu
          \`\`\`bash
          curl -fLO https://github.com/nongio/otto/releases/download/nightly/otto-nightly-amd64.deb
          sudo apt install ./otto-nightly-amd64.deb
          \`\`\`

          ### Fedora/RHEL
          \`\`\`bash
          sudo dnf install https://github.com/nongio/otto/releases/download/nightly/otto-nightly-x86_64.rpm
          \`\`\`

          ### Arch Linux
          \`\`\`bash
          curl -fLO https://github.com/nongio/otto/releases/download/nightly/PKGBUILD-nightly-bin
          makepkg -p PKGBUILD-nightly-bin -si
          \`\`\`

          To update, run the same commands again: the URLs always point at
          the most recent build, and each build is versioned above the last
          (\`$(dpkg-deb -f nightly/otto-nightly-amd64.deb Version)\` tonight).
          Going back to a release is a downgrade: \`apt install --allow-downgrades\`,
          \`dnf downgrade\`, or \`makepkg -si\` from the release PKGBUILD on Arch.
          EOF
          cat notes.md
      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view nightly >/dev/null 2>&1; then
            gh release create nightly --prerelease --title Nightly \
              --notes-file notes.md --target "$GITHUB_SHA"
          fi
          # The packages before the PKGBUILD that names the tarball's
          # checksum, so the checksum never points at a tarball that is
          # not there yet.
          gh release upload nightly --clobber \
            nightly/otto-nightly-x86_64.tar.gz \
            nightly/otto-nightly-amd64.deb \
            nightly/otto-nightly-x86_64.rpm
          gh release upload nightly --clobber nightly/PKGBUILD-nightly-bin
          gh release edit nightly --prerelease --title Nightly --notes-file notes.md
      # The tag follows the build, so the release page's "Source code"
      # links and its commit are the ones the packages were built from. It
      # moves last: a job that fails mid-upload leaves it on the build whose
      # assets are up. Nothing triggers on it: only v* tags run this workflow.
      - name: Move the nightly tag to this commit
        run: git push --force origin "$GITHUB_SHA:refs/tags/nightly"

  validate-pkgbuild:
    needs: changes
    # `release` depends on this job, so it must not be skipped on a tag build
    # even if the diff classifier saw no packaging paths.
    if: needs.changes.outputs.packaging == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
    steps:
      # Before the checkout: without git on the PATH, actions/checkout
      # downloads a tarball of the tree instead of cloning, and the nightly
      # version below has no history to count.
      - name: Install dependencies
        run: pacman -Syu --noconfirm base-devel git
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup build user
        run: |
          useradd -m builder
          chown -R builder:builder .
      - name: Validate PKGBUILD (bin)
        run: |
          DIR=$PWD
          su builder -c "cd $DIR && makepkg --printsrcinfo"
      - name: Validate PKGBUILD-git
        run: |
          DIR=$PWD
          su builder -c "cd $DIR && makepkg --printsrcinfo -p PKGBUILD-git"
      - name: Validate PKGBUILD-nightly-bin
        run: |
          DIR=$PWD
          su builder -c "cd $DIR && makepkg --printsrcinfo -p PKGBUILD-nightly-bin"
      # The whole nightly chain, with stand-in binaries: the tarball, the
      # PKGBUILD pinned to it, and a package built out of the two. This is
      # where a file the PKGBUILD installs but the tarball leaves out fails,
      # rather than on the machine of the first person to run makepkg.
      - name: Build the nightly package from a stand-in tarball
        # The tarball is assembled as root, which is who checked the
        # repository out and whom actions/checkout marked it safe for;
        # only makepkg needs the unprivileged user.
        run: |
          DIR=$PWD
          scripts/packaging/make-arch-tarball.sh --stand-in dist
          pkgver=$(sed -n 's/^pkgver=//p' dist/PKGBUILD-nightly-bin)
          cp dist/otto-nightly-x86_64.tar.gz "dist/otto-nightly-$pkgver-x86_64.tar.gz"
          chown -R builder:builder dist
          su builder -c "cd $DIR/dist && makepkg --nodeps --noconfirm -p PKGBUILD-nightly-bin"
          ls dist/*.pkg.tar.zst
  
  release:
    # The same gate as the nightly: a tag whose tests fail gets no draft.
    needs: [changes, check, locales, ahp-conformance, build-deb, build-rpm, build-arch, validate-pkgbuild]
    if: >-
      ${{ !cancelled()
          && startsWith(github.ref, 'refs/tags/v')
          && needs.changes.result == 'success'
          && (needs.check.result == 'success' || needs.check.result == 'skipped')
          && needs.locales.result == 'success'
          && needs.ahp-conformance.result == 'success'
          && needs.build-deb.result == 'success'
          && needs.build-rpm.result == 'success'
          && needs.build-arch.result == 'success'
          && needs.validate-pkgbuild.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: otto-deb
          path: artifacts/deb
      - name: Download .rpm artifact
        uses: actions/download-artifact@v4
        with:
          name: otto-rpm
          path: artifacts/rpm
      - name: Download Arch tarball
        uses: actions/download-artifact@v4
        with:
          name: otto-arch
          path: artifacts/arch
      # A copy of each package under a name that never changes, so
      # releases/latest/download/<name> is a working URL and the install
      # instructions need no version in them. The versioned files stay.
      - name: Copies under a stable name
        run: |
          cp artifacts/deb/*.deb artifacts/deb/otto-amd64.deb
          cp artifacts/rpm/*.rpm artifacts/rpm/otto-x86_64.rpm
      - name: Create release body
        run: |
          cat > release_notes.md << 'EOF'
          ## Installation

          ### Debian/Ubuntu
          ```bash
          curl -fLO https://github.com/nongio/otto/releases/latest/download/otto-amd64.deb
          sudo apt install ./otto-amd64.deb
          ```

          ### Fedora/RHEL
          ```bash
          sudo dnf install https://github.com/nongio/otto/releases/latest/download/otto-x86_64.rpm
          ```

          ### Arch Linux
          ```bash
          curl -fsSLO https://raw.githubusercontent.com/nongio/otto/main/PKGBUILD
          makepkg -si
          ```
          If you already downloaded the tarball, place the PKGBUILD in the same directory and run `makepkg -si`: it will use the local file without downloading again.

          ---
          EOF
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/deb/*.deb
            artifacts/rpm/*.rpm
            artifacts/arch/otto-[0-9]*.tar.gz
          body_path: release_notes.md
          generate_release_notes: true
          draft: true
          # v1.0.0-rc1 and friends are pre-releases; plain v1.0.0 is not.
          prerelease: ${{ contains(github.ref_name, '-rc') }}