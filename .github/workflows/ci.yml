name: Continuous Integration

on:
  push:
    branches:
    - main
    tags:
    - 'v*'
  pull_request:
  workflow_dispatch:

# Every job gets a read-only token; publish-nightly and release raise it to
# `contents: write` themselves, which is all they need to push a tag and a
# release.
permissions:
  contents: read

# A PR that gets pushed to twice in a minute used to run every job three times
# over. Superseded runs on the same ref are cancelled; runs on main and on tags
# publish artifacts, so those are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which workspace crates the diff reaches. Every other job reads these
  # outputs to decide what is worth running: a change under
  # components/otto-launcher lints and tests the launcher, not all 35 crates,
  # and a change under src/ does not rebuild otto-rdp's GStreamer bin.
  #
  # `otto-arch affected` decides with determinator (guppy), which compares
  # the package graphs `cargo metadata` resolves at the base and the head: a
  # changed file belongs to the crate whose directory holds it, files outside
  # every crate are placed by the [[affects]] rules in architecture.toml, a
  # Cargo.lock edit reaches the crates whose simulated build it changes, and
  # every crate whose build includes an affected one is affected too. A file
  # no rule covers, a missing diff base or any error selects everything: the
  # safe default is to run more, never less. Its log (--explain) says why
  # each crate was picked. See docs/developer/architecture.md.
  #
  # Outputs: `packages` (the affected crates), ready-made `-p` lists for the
  # steps that take one (empty: skip the step), the area flags the gates
  # below read, derived from the crates (compositor = otto or otto-render,
  # rdp = otto-rdp, portal = xdg-desktop-portal-otto, files = otto-files,
  # packaging from the rules), and
  # `all`, which the gates on one crate in `packages` also accept, so a
  # selection of everything that could not list the crates still runs them.
  #
  # Nothing here may skip a check by failing: the toolchain, the cache, the
  # build and the tool itself are allowed to fail, and the last step then
  # writes the outputs of a selection of everything (the argument lists the
  # steps ran before the selection existed; otto-arch's tests keep them equal
  # to what the tool prints for everything).
  changes:
    runs-on: ubuntu-24.04
    outputs:
      all: ${{ steps.affected.outputs.all }}
      packages: ${{ steps.affected.outputs.packages }}
      compositor: ${{ steps.affected.outputs.compositor }}
      rdp: ${{ steps.affected.outputs.rdp }}
      portal: ${{ steps.affected.outputs.portal }}
      packaging: ${{ steps.affected.outputs.packaging }}
      files: ${{ steps.affected.outputs.files }}
      clippy_args: ${{ steps.affected.outputs.clippy_args }}
      test_lib_args: ${{ steps.affected.outputs.test_lib_args }}
      test_bins_args: ${{ steps.affected.outputs.test_bins_args }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # otto-arch is pure Rust with no system libraries. The cache is the
      # architecture job's, which builds the same crate and resolves the
      # same full metadata (its registry download included); this job only
      # reads it, so the two never race to save it.
      - name: Rust toolchain
        continue-on-error: true
        uses: dtolnay/rust-toolchain@1.97.0
      - name: Cargo cache (registry + target)
        continue-on-error: true
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: architecture
          save-if: false
      - name: Build otto-arch
        id: build
        continue-on-error: true
        run: cargo build --locked -q -p otto-arch
      - name: Affected crates
        id: affected
        env:
          # workflow_dispatch, a tag build or a first push to a new branch
          # has no usable base (empty, or all zeros): the tool then selects
          # everything. On a pull request the checkout is the merge commit,
          # so diffing the base against the working tree is exactly the
          # change under test. The tool checks the base out in a temporary
          # worktree for its own cargo metadata.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          BUILT: ${{ steps.build.outcome }}
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/affected.txt"
          # A time limit inside the condition, not timeout-minutes: a hung
          # fetch (the base's cargo metadata can clone git dependencies)
          # falls through to checking everything instead of failing the job.
          if [ "$BUILT" = success ] \
             && timeout 600 target/debug/otto-arch affected --base "${BASE_SHA:-}" --explain > "$out" \
             && grep -q '^packages=' "$out"; then
              cat "$out" | tee -a "$GITHUB_OUTPUT"
          else
              echo "otto-arch affected failed or did not run (build: $BUILT): checking everything"
              tee -a "$GITHUB_OUTPUT" <<'EVERYTHING'
          all=true
          packages=
          compositor=true
          rdp=true
          portal=true
          files=true
          packaging=true
          clippy_args=--workspace --exclude otto --exclude otto-render --exclude otto-rdp --exclude xdg-desktop-portal-otto --exclude submenu-gtk
          test_lib_args=--workspace --exclude otto-files --exclude otto --exclude otto-render
          test_bins_args=-p otto-bar -p otto-greeter -p otto-islands -p otto-lock -p otto-msg -p otto-setup -p otto-preview -p otto-settings -p otto-stash -p otto-launcher -p otto-search
          EVERYTHING
          fi

  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-rust_stable-${{ hashFiles('**/Cargo.toml') }}
      - name: Format
        run: cargo fmt --all -- --check

  # Cheap and early: a dependency no crate imports any more. cargo-machete
  # reads the source rather than compiling it, so it needs no system libraries.
  # A false positive (a crate imported under another name) goes in the
  # `cargo-machete` metadata in Cargo.toml.
  unused-deps:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - name: Unused dependencies
        run: cargo machete

  # Cheap and early: the layering rules in architecture.toml (otto-arch) and
  # the third-party policy in deny.toml (cargo-deny). Both read manifests and
  # source only, so this needs no system libraries.
  # See docs/developer/architecture.md.
  architecture:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
      - name: Cargo cache (registry + target)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: architecture
          cache-on-failure: true
      # Pinned: a new cargo-deny can change the deny.toml schema.
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      # The checker's own tests, then the workspace against the rules; a
      # violation prints the same report `cargo run -p otto-arch` does.
      - name: Layers and module boundaries
        run: cargo test --locked -p otto-arch
      # otto-arch is linted here, on every change, rather than in the
      # components job: it needs no system libraries.
      - name: Clippy (otto-arch)
        run: cargo clippy --locked -p otto-arch --all-targets -- -D warnings
      # --workspace: the root manifest is also the compositor's package, and
      # without it cargo-deny would only judge the compositor's graph.
      - name: Third-party dependency policy
        run: cargo deny --workspace check bans licenses sources -D unused-wrapper
      # Its own step: the advisory database changes on its own, so a red
      # here on an unrelated change means a new advisory, not that change.
      - name: Security advisories
        run: cargo deny --workspace check advisories

  # Cheap and early: a locale missing keys otherwise only surfaces in the
  # otto-kit unit tests, after the compositor has been built and linted.
  locales:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Catalogues carry every en-GB key
        run: python3 scripts/check-locales.py
      - name: The otto-help skill ships the current user guides
        run: scripts/sync-skill-docs.sh --check
      - name: The Solar icon set matches its list
        run: scripts/update-solar-icons.sh --check

  # A check of its own: Otto claims to implement the Agent Host Protocol, and
  # this is the evidence for that claim. It runs the corpora upstream ships
  # for the purpose — every reducer case and every wire round-trip in
  # spec/upstream/types/test-cases — against the types and reducers the
  # service is built on. otto-agents is pure Rust with no system libraries,
  # so it needs none of the compositor's build dependencies and does not wait
  # behind them. It runs only when otto-agents is affected, which is safe:
  # the corpora live in components/otto-agents/spec, so a change to them
  # marks otto-agents as affected too.
  ahp-conformance:
    needs: changes
    if: needs.changes.outputs.all == 'true' || contains(format(' {0} ', needs.changes.outputs.packages), ' otto-agents ')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
      - name: Cargo cache (registry + target)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ahp-conformance
          cache-on-failure: true
      - name: The vendored spec and the AHP crates agree
        run: cargo test --locked -p otto-agents --test spec_pin
      - name: The AHP conformance corpora pass
        run: cargo test --locked -p otto-agents --test conformance
  
  # One job per area, each run only when its area is affected, so a PR shows
  # the areas it skipped and the affected ones run side by side. Each job
  # installs only the system libraries its crates link (the portal links
  # none) and keeps its own cache, so an app change does not restore the
  # compositor's build. The price is a toolchain setup and dependency build
  # per job when several areas are affected at once.

  # The compositor and its render stack: their lints in every feature set CI
  # keeps compiling, their unit tests, and the headless suites. The
  # screencast and RDP-bridge suites are the compositor's side of the portal
  # and the bridge, so a change to either runs this job for them alone.
  compositor:
    needs: changes
    if: >-
      needs.changes.outputs.compositor == 'true'
      || needs.changes.outputs.portal == 'true'
      || needs.changes.outputs.rdp == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - name: Cargo cache (registry + target)
        uses: Swatinem/rust-cache@v2
        with:
          # Shared with build-deb/rpm/arch — cache accumulates debug + release
          # artifacts so successive jobs can incrementally compile.
          shared-key: workspace-build
          cache-on-failure: true
      - name: System dependencies
        run: sudo apt-get update; sudo apt-get install -y libdrm-dev libudev-dev libgbm-dev libxkbcommon-dev libegl1-mesa-dev libwayland-dev libinput-dev libdbus-1-dev libsystemd-dev libseat-dev libpipewire-0.3-dev libfreetype-dev libfontconfig-dev libdisplay-info-dev libpixman-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libpam0g-dev libpolkit-agent-1-dev hicolor-icon-theme fonts-dejavu-core
      # `--all-targets` reaches tests, examples and benches, and the headless
      # feature is what makes tests/*.rs more than an empty file.
      - name: Clippy (compositor)
        if: needs.changes.outputs.compositor == 'true'
        run: cargo clippy --locked -p otto --all-targets --features "default,headless" -- -D warnings
      - name: Clippy (compositor without XWayland)
        # `xwayland` is a default feature that packagers can drop; nothing else
        # compiles that configuration, so it breaks silently without this.
        if: needs.changes.outputs.compositor == 'true'
        run: cargo clippy --locked -p otto --no-default-features --features "egl,winit,udev,renderer_sync" -- -D warnings
      - name: Clippy (compositor x11 backend)
        # `x11` is opt-in and no other step enables it, so the backend
        # bit-rotted unnoticed once already.
        if: needs.changes.outputs.compositor == 'true'
        run: cargo clippy --locked -p otto --features "default,x11" -- -D warnings
      - name: Clippy (compositor fps ticker)
        # `ticker` is opt-in like `x11`, and stopped compiling the same way.
        if: needs.changes.outputs.compositor == 'true'
        run: cargo clippy --locked -p otto --features "default,x11,ticker" -- -D warnings
      - name: Clippy (render stack)
        # otto-render's own tests and default features (udev and Vulkan): the
        # compositor steps above lint only the library, built with their
        # feature sets. Only when otto-render itself is affected: a change to
        # the compositor alone cannot change how it lints.
        if: needs.changes.outputs.all == 'true' || contains(format(' {0} ', needs.changes.outputs.packages), ' otto-render ')
        run: cargo clippy --locked -p otto-render --all-targets -- -D warnings
      - name: Run compositor unit tests
        timeout-minutes: 20
        if: needs.changes.outputs.compositor == 'true'
        run: cargo test --locked --lib -p otto
      - name: Run render stack unit tests
        timeout-minutes: 15
        if: needs.changes.outputs.all == 'true' || contains(format(' {0} ', needs.changes.outputs.packages), ' otto-render ')
        run: cargo test --locked --lib -p otto-render
      - name: Run headless integration tests
        timeout-minutes: 15
        if: needs.changes.outputs.compositor == 'true'
        run: cargo test --locked --features headless --test headless_basic
      - name: Run shell interaction tests
        timeout-minutes: 15
        if: needs.changes.outputs.compositor == 'true'
        run: cargo test --locked --features headless --test workspace_selector --test app_switcher --test tiling --test dnd_icons
      - name: Run wallpaper tests
        timeout-minutes: 15
        if: needs.changes.outputs.compositor == 'true'
        # What reaches the screen, in the layout set, and the same pixels
        # however a frame is repainted (nongio/otto#361).
        run: cargo test --locked --features headless --test wallpaper --test expose_wallpaper
      - name: Run screencast integration tests
        timeout-minutes: 15
        if: needs.changes.outputs.compositor == 'true' || needs.changes.outputs.portal == 'true'
        run: cargo test --locked --features headless --test screenshare
      - name: Run RDP bridge integration tests
        timeout-minutes: 15
        # The compositor half of the bridge: the protocols otto-rdp drives.
        if: needs.changes.outputs.compositor == 'true' || needs.changes.outputs.rdp == 'true'
        run: cargo test --locked --features headless --test rdp_bridge
      - name: Run font matching tests
        timeout-minutes: 10
        if: needs.changes.outputs.compositor == 'true'
        run: cargo test --locked --lib -p otto -- workspaces::utils::tests --ignored

  # Every other affected crate: the toolkit, the kits and the apps.
  components:
    needs: changes
    if: >-
      needs.changes.outputs.clippy_args != ''
      || needs.changes.outputs.test_lib_args != ''
      || needs.changes.outputs.test_bins_args != ''
      || needs.changes.outputs.files == 'true'
      || needs.changes.outputs.all == 'true'
      || contains(format(' {0} ', needs.changes.outputs.packages), ' otto-kit ')
      || contains(format(' {0} ', needs.changes.outputs.packages), ' otto-agents ')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - name: Cargo cache (registry + target)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: components
          cache-on-failure: true
      - name: System dependencies
        run: sudo apt-get update; sudo apt-get install -y libdrm-dev libgbm-dev libxkbcommon-dev libegl1-mesa-dev libwayland-dev libpipewire-0.3-dev libfreetype-dev libfontconfig-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libpam0g-dev libpolkit-agent-1-dev hicolor-icon-theme fonts-dejavu-core
      - name: Clippy (components)
        # Every affected crate with no clippy step of its own, sample clients
        # included. submenu-gtk is never linted: it needs GTK development
        # libraries that no job here installs, and nothing in CI compiles it.
        # otto-arch is linted in the architecture job.
        if: needs.changes.outputs.clippy_args != ''
        env:
          ARGS: ${{ needs.changes.outputs.clippy_args }}
        run: cargo clippy --locked $ARGS --all-targets -- -D warnings
      - name: Run tests
        timeout-minutes: 20
        # The library tests of every affected component with a lib target. The
        # compositor and the render stack run theirs in their own job,
        # otto-rdp is bin-only, and otto-files, otto-agents and the portal
        # have target-wide steps of their own.
        if: needs.changes.outputs.test_lib_args != ''
        env:
          ARGS: ${{ needs.changes.outputs.test_lib_args }}
        run: cargo test --locked --lib $ARGS
      - name: Run toolkit doctests
        timeout-minutes: 15
        # `--lib` skips doctests, and otto-kit's examples are its API docs:
        # without this run they stop compiling unseen.
        if: needs.changes.outputs.all == 'true' || contains(format(' {0} ', needs.changes.outputs.packages), ' otto-kit ')
        run: cargo test --locked -p otto-kit --doc
      - name: Run app unit tests
        timeout-minutes: 20
        # `--lib` above skips binary targets, so the apps with no lib target —
        # lock screen and greeter auth included — and the main.rs tests of
        # the launcher and search need a --bins run of their own. The
        # candidates are otto-arch's BIN_TESTS; the affected ones run.
        if: needs.changes.outputs.test_bins_args != ''
        env:
          ARGS: ${{ needs.changes.outputs.test_bins_args }}
        run: cargo test --locked --bins $ARGS
      - name: Run file browser tests
        timeout-minutes: 15
        if: needs.changes.outputs.files == 'true'
        run: cargo test --locked --lib --bins -p otto-files
      - name: Run agent service tests
        timeout-minutes: 15
        # The workspace step above is --lib, so the agent service's integration
        # tests — the protocol handshake, the spec pin, permissions and
        # escalation — need a target-wide run of their own.
        if: needs.changes.outputs.all == 'true' || contains(format(' {0} ', needs.changes.outputs.packages), ' otto-agents ')
        run: cargo test --locked -p otto-agents

  # The RDP bridge: expensive (GStreamer), and only otto-rdp and the two
  # foundation crates it links can affect it.
  rdp:
    needs: changes
    if: needs.changes.outputs.rdp == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - name: Cargo cache (registry + target)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rdp
          cache-on-failure: true
      - name: System dependencies
        run: sudo apt-get update; sudo apt-get install -y libwayland-dev libxkbcommon-dev libgbm-dev libpipewire-0.3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Clippy (RDP bridge)
        run: cargo clippy --locked -p otto-rdp --all-targets -- -D warnings
      - name: Run RDP bridge unit tests
        timeout-minutes: 20
        run: cargo test --locked -p otto-rdp

  # The portal backend: pure Rust, so no system libraries to install.
  portal:
    needs: changes
    if: needs.changes.outputs.portal == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - name: Cargo cache (registry + target)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: portal
          cache-on-failure: true
      - name: Clippy (portal backend)
        run: cargo clippy --locked -p xdg-desktop-portal-otto --all-targets -- -D warnings
      - name: Run portal backend tests
        timeout-minutes: 15
        run: cargo test --locked -p xdg-desktop-portal-otto
  
  # Every packaged binary is compiled exactly once here. build-deb, build-rpm
  # and build-arch consume this artifact; each used to run an identical
  # `cargo build --release`, so the same binaries were built three times per
  # run and the cost grew with every component added.
  build-binaries:
    # Package builds only run on merge to main and tags, not on every PR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
      - name: Cargo cache (registry + target)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-build
          cache-on-failure: true
      - name: System dependencies
        run: sudo apt-get update; sudo apt-get install -y libdrm-dev libudev-dev libgbm-dev libxkbcommon-dev libegl1-mesa-dev libwayland-dev libinput-dev libdbus-1-dev libsystemd-dev libseat-dev libpipewire-0.3-dev libfreetype-dev libfontconfig-dev libdisplay-info-dev libpixman-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libpam0g-dev libpolkit-agent-1-dev hicolor-icon-theme fonts-dejavu-core
      - name: Build workspace binaries
        run: cargo build --locked --release -p otto -p otto-bar -p otto-islands -p otto-lock -p otto-authorize -p otto-greeter -p otto-rdp -p xdg-desktop-portal-otto -p otto-settings -p otto-files -p otto-launcher -p otto-emoji -p otto-stash -p otto-canvas -p otto-peek -p otto-preview -p otto-media-kit -p otto-msg -p otto-setup -p otto-search -p otto-agents
      - name: Binary sizes
        # Every packaged binary embeds its own copy of the Rust crates it
        # uses (Skia and otto-kit among them), so the sizes are the cost of
        # that: the summary makes a change in them visible run to run.
        run: |
          {
            echo '| Binary | Size (MiB) |'
            echo '| --- | ---: |'
            total=0
            for f in otto otto-bar otto-islands otto-lock otto-authorize otto-greeter \
                     otto-rdp xdg-desktop-portal-otto otto-settings otto-files otto-launcher \
                     otto-emoji otto-stash otto-canvas otto-peek otto-preview otto-media-worker \
                     otto-msg otto-setup otto-search otto-agents; do
              bytes=$(stat -c %s "target/release/$f")
              total=$((total + bytes))
              awk -v f="$f" -v b="$bytes" 'BEGIN { printf "| %s | %.1f |\n", f, b / 1048576 }'
            done
            awk -v b="$total" 'BEGIN { printf "| **total** | **%.1f** |\n", b / 1048576 }'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload workspace binaries
        uses: actions/upload-artifact@v4
        with:
          name: otto-binaries
          path: |
            target/release/otto
            target/release/otto-bar
            target/release/otto-islands
            target/release/otto-lock
            target/release/otto-authorize
            target/release/otto-greeter
            target/release/otto-rdp
            target/release/xdg-desktop-portal-otto
            target/release/otto-settings
            target/release/otto-files
            target/release/otto-launcher
            target/release/otto-emoji
            target/release/otto-stash
            target/release/otto-canvas
            target/release/otto-peek
            target/release/otto-preview
            target/release/otto-media-worker
            target/release/otto-msg
            target/release/otto-setup
            target/release/otto-search
            target/release/otto-agents
          retention-days: 1

  build-deb:
    if: github.event_name != 'pull_request'
    needs: build-binaries
    runs-on: ubuntu-24.04
    env:
      # A tag build is a release and carries the workspace version as it is;
      # anything else is a nightly, versioned as the release it was built
      # from plus the commits since (scripts/packaging/version.sh).
      OTTO_NIGHTLY: ${{ startsWith(github.ref, 'refs/tags/v') && '0' || '1' }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          # The nightly version counts the commits on main, so the whole
          # history is needed; a shallow clone would number every build r1.
          fetch-depth: 0
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
      - name: System dependencies
        # Nothing is compiled here, but dpkg-shlibdeps reads the binaries to
        # resolve runtime dependencies, so the shared libraries must be present.
        run: sudo apt-get update; sudo apt-get install -y libdrm-dev libudev-dev libgbm-dev libxkbcommon-dev libegl1-mesa-dev libwayland-dev libinput-dev libdbus-1-dev libsystemd-dev libseat-dev libpipewire-0.3-dev libfreetype-dev libfontconfig-dev libdisplay-info-dev libpixman-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libpam0g-dev libpolkit-agent-1-dev hicolor-icon-theme fonts-dejavu-core
      - name: Cargo cache (packaging tools)
        uses: Swatinem/rust-cache@v2
        with:
          # Separate from workspace-build: this job downloads target/release
          # rather than building it, so caching ./target would serve stale
          # binaries. Only ~/.cargo is wanted, for the installed tool.
          shared-key: packaging-tools
          cache-targets: "false"
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked
      - name: Download workspace binaries
        uses: actions/download-artifact@v4
        with:
          name: otto-binaries
          path: target/release
      - name: Restore executable bits
        # upload-artifact does not preserve the executable bit.
        run: chmod +x target/release/*
      - name: Build Debian package
        run: scripts/packaging/build-deb.sh
      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: otto-deb
          path: target/debian/*.deb
          retention-days: 30

  build-rpm:
    if: github.event_name != 'pull_request'
    needs: build-binaries
    runs-on: ubuntu-24.04
    env:
      # A tag build is a release and carries the workspace version as it is;
      # anything else is a nightly, versioned as the release it was built
      # from plus the commits since (scripts/packaging/version.sh).
      OTTO_NIGHTLY: ${{ startsWith(github.ref, 'refs/tags/v') && '0' || '1' }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          # The nightly version counts the commits on main, so the whole
          # history is needed; a shallow clone would number every build r1.
          fetch-depth: 0
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
      - name: System dependencies
        run: sudo apt-get update; sudo apt-get install -y libdrm-dev libudev-dev libgbm-dev libxkbcommon-dev libegl1-mesa-dev libwayland-dev libinput-dev libdbus-1-dev libsystemd-dev libseat-dev libpipewire-0.3-dev libfreetype-dev libfontconfig-dev libdisplay-info-dev libpixman-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libpam0g-dev libpolkit-agent-1-dev hicolor-icon-theme fonts-dejavu-core
      - name: Cargo cache (packaging tools)
        uses: Swatinem/rust-cache@v2
        with:
          # Separate from workspace-build: this job downloads target/release
          # rather than building it, so caching ./target would serve stale
          # binaries. Only ~/.cargo is wanted, for the installed tool.
          shared-key: packaging-tools
          cache-targets: "false"
      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm --locked
      - name: Download workspace binaries
        uses: actions/download-artifact@v4
        with:
          name: otto-binaries
          path: target/release
      - name: Restore executable bits
        run: chmod +x target/release/*
      - name: Build RPM package
        run: scripts/packaging/build-rpm.sh
      - name: Upload RPM package
        uses: actions/upload-artifact@v4
        with:
          name: otto-rpm
          path: target/generate-rpm/*.rpm
          retention-days: 30

  build-arch:
    if: github.event_name != 'pull_request'
    needs: build-binaries
    runs-on: ubuntu-24.04
    # No Rust toolchain or system libraries: this job only assembles a tarball.
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          # The nightly version counts the commits on main, so the whole
          # history is needed; a shallow clone would number every build r1.
          fetch-depth: 0
      - name: Download workspace binaries
        uses: actions/download-artifact@v4
        with:
          name: otto-binaries
          path: target/release
      - name: Restore executable bits
        run: chmod +x target/release/*
      - name: Build Arch tarball
        # The file list lives in the script, not here, so the packaging
        # test can assemble the same tarball and check it against the
        # PKGBUILDs that install out of it. Alongside the tarball it writes
        # the PKGBUILD pinned to it, the fixed-name copy the nightly
        # publishes and the PKGBUILD-nightly-bin pinned to that.
        run: scripts/packaging/make-arch-tarball.sh dist
      - name: Upload Arch tarball
        uses: actions/upload-artifact@v4
        with:
          name: otto-arch
          path: |
            dist/otto-*.tar.gz
            dist/PKGBUILD
            dist/PKGBUILD-nightly-bin
          retention-days: 30

  publish-nightly:
    # Only main that passed its tests is worth a nightly: a commit that
    # fails its checks is not published, rather than handed to everyone on the
    # nightly channel. The area jobs (compositor, components, rdp, portal)
    # and `ahp-conformance` are skipped when their area is not affected,
    # which counts as passing — but only when `changes` itself succeeded,
    # since a failed classifier skips them too. The others never skip.
    needs: [changes, compositor, components, rdp, portal, locales, architecture, ahp-conformance, build-arch, build-deb, build-rpm]
    if: >-
      ${{ !cancelled()
          && github.event_name == 'push' && github.ref == 'refs/heads/main'
          && needs.changes.result == 'success'
          && (needs.compositor.result == 'success' || needs.compositor.result == 'skipped')
          && (needs.components.result == 'success' || needs.components.result == 'skipped')
          && (needs.rdp.result == 'success' || needs.rdp.result == 'skipped')
          && (needs.portal.result == 'success' || needs.portal.result == 'skipped')
          && needs.locales.result == 'success'
          && needs.architecture.result == 'success'
          && (needs.ahp-conformance.result == 'success' || needs.ahp-conformance.result == 'skipped')
          && needs.build-arch.result == 'success'
          && needs.build-deb.result == 'success'
          && needs.build-rpm.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout sources
        # For the tag push below, and the commit subject in the notes.
        uses: actions/checkout@v4
      - name: Download Arch tarball
        uses: actions/download-artifact@v4
        with:
          name: otto-arch
          path: artifacts/arch
      - name: Download .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: otto-deb
          path: artifacts/deb
      - name: Download .rpm artifact
        uses: actions/download-artifact@v4
        with:
          name: otto-rpm
          path: artifacts/rpm
      # The nightly release is reused by every build, so its assets carry no
      # version in their names: the download URLs in the instructions below
      # have to keep working from one night to the next. The version is
      # inside the packages instead (1.4.1+nightly.r123.gabc1234), which is
      # what lets a nightly install over the release and the next nightly
      # over it.
      - name: Names that do not change from night to night
        run: |
          mkdir -p nightly
          cp artifacts/deb/*.deb nightly/otto-nightly-amd64.deb
          cp artifacts/rpm/*.rpm nightly/otto-nightly-x86_64.rpm
          cp artifacts/arch/otto-nightly-x86_64.tar.gz artifacts/arch/PKGBUILD-nightly-bin nightly/
          ls -l nightly
      - name: Release notes
        run: |
          subject=$(git log -1 --format=%s "$GITHUB_SHA")
          cat > notes.md <<EOF
          Automated nightly build from the latest commit on \`main\`. Expect
          rough edges; the [latest release](https://github.com/nongio/otto/releases/latest)
          is the one to run if you want a working desktop.

          Built from [\`${GITHUB_SHA::7}\`](https://github.com/nongio/otto/commit/$GITHUB_SHA)
          — $subject — on $(date -u +'%Y-%m-%d %H:%M UTC').

          ### Debian/Ubuntu
          \`\`\`bash
          curl -fLO https://github.com/nongio/otto/releases/download/nightly/otto-nightly-amd64.deb
          sudo apt install ./otto-nightly-amd64.deb
          \`\`\`

          ### Fedora/RHEL
          \`\`\`bash
          sudo dnf install https://github.com/nongio/otto/releases/download/nightly/otto-nightly-x86_64.rpm
          \`\`\`

          ### Arch Linux
          \`\`\`bash
          curl -fLO https://github.com/nongio/otto/releases/download/nightly/PKGBUILD-nightly-bin
          makepkg -p PKGBUILD-nightly-bin -si
          \`\`\`

          To update, run the same commands again: the URLs always point at
          the most recent build, and each build is versioned above the last
          (\`$(dpkg-deb -f nightly/otto-nightly-amd64.deb Version)\` tonight).
          Going back to a release is a downgrade: \`apt install --allow-downgrades\`,
          \`dnf downgrade\`, or \`makepkg -si\` from the release PKGBUILD on Arch.
          EOF
          cat notes.md
      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view nightly >/dev/null 2>&1; then
            gh release create nightly --prerelease --title Nightly \
              --notes-file notes.md --target "$GITHUB_SHA"
          fi
          # The packages before the PKGBUILD that names the tarball's
          # checksum, so the checksum never points at a tarball that is
          # not there yet.
          gh release upload nightly --clobber \
            nightly/otto-nightly-x86_64.tar.gz \
            nightly/otto-nightly-amd64.deb \
            nightly/otto-nightly-x86_64.rpm
          gh release upload nightly --clobber nightly/PKGBUILD-nightly-bin
          gh release edit nightly --prerelease --title Nightly --notes-file notes.md
      # The tag follows the build, so the release page's "Source code"
      # links and its commit are the ones the packages were built from. It
      # moves last: a job that fails mid-upload leaves it on the build whose
      # assets are up. Nothing triggers on it: only v* tags run this workflow.
      - name: Move the nightly tag to this commit
        run: git push --force origin "$GITHUB_SHA:refs/tags/nightly"

  validate-pkgbuild:
    needs: changes
    # `release` depends on this job, so it must not be skipped on a tag build
    # even if the diff classifier saw no packaging paths.
    if: needs.changes.outputs.packaging == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
    steps:
      # Before the checkout: without git on the PATH, actions/checkout
      # downloads a tarball of the tree instead of cloning, and the nightly
      # version below has no history to count.
      - name: Install dependencies
        run: pacman -Syu --noconfirm base-devel git
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup build user
        run: |
          useradd -m builder
          chown -R builder:builder .
      - name: Validate PKGBUILD (bin)
        run: |
          DIR=$PWD
          su builder -c "cd $DIR && makepkg --printsrcinfo"
      - name: Validate PKGBUILD-git
        run: |
          DIR=$PWD
          su builder -c "cd $DIR && makepkg --printsrcinfo -p PKGBUILD-git"
      - name: Validate PKGBUILD-nightly-bin
        run: |
          DIR=$PWD
          su builder -c "cd $DIR && makepkg --printsrcinfo -p PKGBUILD-nightly-bin"
      # The whole nightly chain, with stand-in binaries: the tarball, the
      # PKGBUILD pinned to it, and a package built out of the two. This is
      # where a file the PKGBUILD installs but the tarball leaves out fails,
      # rather than on the machine of the first person to run makepkg.
      - name: Build the nightly package from a stand-in tarball
        # As builder throughout: the checkout was chown'd to it above, so it
        # is the one user git lets read the history without a safe.directory
        # entry, and the one makepkg accepts.
        run: |
          DIR=$PWD
          su builder -c "cd $DIR && scripts/packaging/make-arch-tarball.sh --stand-in dist"
          pkgver=$(sed -n 's/^pkgver=//p' dist/PKGBUILD-nightly-bin)
          cp dist/otto-nightly-x86_64.tar.gz "dist/otto-nightly-$pkgver-x86_64.tar.gz"
          chown builder:builder dist/otto-nightly-*-x86_64.tar.gz
          su builder -c "cd $DIR/dist && makepkg --nodeps --noconfirm -p PKGBUILD-nightly-bin"
          ls dist/*.pkg.tar.zst
  
  release:
    # The same gate as the nightly: a tag whose tests fail gets no draft.
    needs: [changes, compositor, components, rdp, portal, locales, architecture, ahp-conformance, build-deb, build-rpm, build-arch, validate-pkgbuild]
    if: >-
      ${{ !cancelled()
          && startsWith(github.ref, 'refs/tags/v')
          && needs.changes.result == 'success'
          && (needs.compositor.result == 'success' || needs.compositor.result == 'skipped')
          && (needs.components.result == 'success' || needs.components.result == 'skipped')
          && (needs.rdp.result == 'success' || needs.rdp.result == 'skipped')
          && (needs.portal.result == 'success' || needs.portal.result == 'skipped')
          && needs.locales.result == 'success'
          && needs.architecture.result == 'success'
          && (needs.ahp-conformance.result == 'success' || needs.ahp-conformance.result == 'skipped')
          && needs.build-deb.result == 'success'
          && needs.build-rpm.result == 'success'
          && needs.build-arch.result == 'success'
          && needs.validate-pkgbuild.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: otto-deb
          path: artifacts/deb
      - name: Download .rpm artifact
        uses: actions/download-artifact@v4
        with:
          name: otto-rpm
          path: artifacts/rpm
      - name: Download Arch tarball
        uses: actions/download-artifact@v4
        with:
          name: otto-arch
          path: artifacts/arch
      # A copy of each package under a name that never changes, so
      # releases/latest/download/<name> is a working URL and the install
      # instructions need no version in them. The versioned files stay.
      - name: Copies under a stable name
        run: |
          cp artifacts/deb/*.deb artifacts/deb/otto-amd64.deb
          cp artifacts/rpm/*.rpm artifacts/rpm/otto-x86_64.rpm
      - name: Create release body
        run: |
          cat > release_notes.md << 'EOF'
          ## Installation

          ### Debian/Ubuntu
          ```bash
          curl -fLO https://github.com/nongio/otto/releases/latest/download/otto-amd64.deb
          sudo apt install ./otto-amd64.deb
          ```

          ### Fedora/RHEL
          ```bash
          sudo dnf install https://github.com/nongio/otto/releases/latest/download/otto-x86_64.rpm
          ```

          ### Arch Linux
          ```bash
          curl -fsSLO https://github.com/nongio/otto/releases/download/${{ github.ref_name }}/PKGBUILD
          makepkg -si
          ```
          The PKGBUILD is pinned to this release's tarball. If you already downloaded the tarball, place the PKGBUILD in the same directory and run `makepkg -si`: it will use the local file without downloading again.

          ---
          EOF
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/deb/*.deb
            artifacts/rpm/*.rpm
            artifacts/arch/otto-[0-9]*.tar.gz
            artifacts/arch/PKGBUILD
          body_path: release_notes.md
          generate_release_notes: true
          draft: true
          # v1.0.0-rc1 and friends are pre-releases; plain v1.0.0 is not.
          prerelease: ${{ contains(github.ref_name, '-rc') }}