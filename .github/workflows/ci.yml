name: Continuous Integration

on:
  push:
    branches:
    - main
    tags:
    - 'v*'
  pull_request:
  workflow_dispatch:

# A PR that gets pushed to twice in a minute used to run every job three times
# over. Superseded runs on the same ref are cancelled; runs on main and on tags
# publish artifacts, so those are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which areas of the repo the diff touches. Every other job reads these
  # outputs to decide what is worth running: a change under
  # components/otto-rdp does not need the compositor's headless suite, and a
  # change under src/ does not need otto-rdp's GStreamer bin rebuilt.
  #
  # Anything shared (the lockfile, the workspace manifest, the toolchain, the
  # UI toolkit every component links, this file) sets *every* flag — the safe
  # default is to run more, never less.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      compositor: ${{ steps.filter.outputs.compositor }}
      ui: ${{ steps.filter.outputs.ui }}
      rdp: ${{ steps.filter.outputs.rdp }}
      portal: ${{ steps.filter.outputs.portal }}
      packaging: ${{ steps.filter.outputs.packaging }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          # workflow_dispatch, a tag build, or a first push to a new branch has
          # no usable base to diff against: treat everything as changed.
          if [ -z "${BASE_SHA:-}" ] \
             || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
              echo "no diff base ($BASE_SHA); running everything"
              FILES='__all__'
          else
              FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
              echo "changed files:"
              echo "$FILES" | sed 's/^/  /'
          fi

          # Matches any path, so a missing base turns every filter on.
          if [ "$FILES" = '__all__' ]; then FILES=$(git ls-files); fi

          matches() { echo "$FILES" | grep -qE "$1"; }

          # Nothing in the tree is unaffected by these.
          SHARED='^(Cargo\.lock|Cargo\.toml|rust-toolchain\.toml)$|^\.github/workflows/ci\.yml$'
          # The UI toolkit: linked by otto and by every component except the
          # RDP bridge and the portal backend, which are leaf crates (verified
          # with `cargo tree -p <crate> | grep otto-kit`).
          KIT='^components/otto-kit/'
          COMPOSITOR='^(src|tests|protocols|resources)/|^otto_config.*\.toml$'
          RDP='^components/otto-rdp/'
          PORTAL='^components/xdg-desktop-portal-otto/'
          # Every component except the two with their own filters above.
          UI='^components/(?!otto-rdp/|xdg-desktop-portal-otto/)|^sample-clients/'
          PACKAGING='^PKGBUILD|^(Cargo\.toml)$|^(resources|scripts)/|^\.github/workflows/ci\.yml$'

          shared=false; matches "$SHARED" && shared=true
          kit=false; matches "$KIT" && kit=true

          for name in compositor rdp portal; do
              case $name in
                  # otto-kit reaches the compositor and the UI components, but
                  # not the two leaf crates below.
                  compositor) pat=$COMPOSITOR; extra=$kit ;;
                  rdp)        pat=$RDP;        extra=false ;;
                  portal)     pat=$PORTAL;     extra=false ;;
              esac
              if $shared || $extra || matches "$pat"; then v=true; else v=false; fi
              echo "$name=$v" >> "$GITHUB_OUTPUT"
              eval "$name=$v"
          done

          # -P for the negative lookahead; plain -E cannot express it.
          if $shared || $kit || echo "$FILES" | grep -qP "$UI"; then ui=true; else ui=false; fi
          echo "ui=$ui" >> "$GITHUB_OUTPUT"

          if matches "$PACKAGING"; then packaging=true; else packaging=false; fi
          echo "packaging=$packaging" >> "$GITHUB_OUTPUT"

          if $compositor || $ui || $rdp || $portal; then rust=true; else rust=false; fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"

          echo "--- compositor=$compositor ui=$ui rdp=$rdp portal=$portal packaging=$packaging rust=$rust"

  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-rust_stable-${{ hashFiles('**/Cargo.toml') }}
      - name: Format
        run: cargo fmt --all -- --check
  
  # One job rather than several: every step shares a single target directory,
  # so splitting them apart would pay for the compositor's dependency graph
  # once per job. Individual steps are gated instead.
  check:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - name: Cargo cache (registry + target)
        uses: Swatinem/rust-cache@v2
        with:
          # Shared with build-deb/rpm/arch — cache accumulates debug + release
          # artifacts so successive jobs can incrementally compile.
          shared-key: workspace-build
          cache-on-failure: true
      - name: System dependencies
        run: sudo apt-get update; sudo apt-get install -y libdrm-dev libudev-dev libgbm-dev libxkbcommon-dev libegl1-mesa-dev libwayland-dev libinput-dev libdbus-1-dev libsystemd-dev libseat-dev libpipewire-0.3-dev libfreetype-dev libfontconfig-dev libdisplay-info-dev libpixman-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libpam0g-dev hicolor-icon-theme fonts-dejavu-core
      # Clippy mirrors the test steps below: every crate CI compiles is
      # linted, and each area is linted only when that area changed.
      # `--all-targets` reaches tests, examples and benches, and the headless
      # feature is what makes tests/*.rs more than an empty file.
      - name: Clippy (compositor)
        if: needs.changes.outputs.compositor == 'true'
        run: cargo clippy --locked -p otto --all-targets --features "default,headless" -- -D warnings
      - name: Clippy (components)
        # Everything with no filter of its own, sample clients included.
        # submenu-gtk is the one exception: it needs GTK development libraries
        # that no job here installs, and nothing in CI compiles it — the
        # release build names its packages explicitly, and `--lib --workspace`
        # skips it because it has no lib target.
        if: needs.changes.outputs.ui == 'true'
        run: cargo clippy --locked --workspace --exclude otto --exclude otto-rdp --exclude xdg-desktop-portal-otto --exclude submenu-gtk --all-targets -- -D warnings
      - name: Clippy (RDP bridge)
        if: needs.changes.outputs.rdp == 'true'
        run: cargo clippy --locked -p otto-rdp --all-targets -- -D warnings
      - name: Clippy (portal backend)
        if: needs.changes.outputs.portal == 'true'
        run: cargo clippy --locked -p xdg-desktop-portal-otto --all-targets -- -D warnings
      - name: Run tests
        timeout-minutes: 20
        # otto-rdp is bin-only, so this never covers it — see the RDP step.
        if: needs.changes.outputs.compositor == 'true' || needs.changes.outputs.ui == 'true'
        run: cargo test --locked --lib --workspace
      - name: Run headless integration tests
        timeout-minutes: 15
        if: needs.changes.outputs.compositor == 'true'
        run: cargo test --locked --features headless --test headless_basic
      - name: Run shell interaction tests
        timeout-minutes: 15
        if: needs.changes.outputs.compositor == 'true'
        run: cargo test --locked --features headless --test workspace_selector --test app_switcher --test tiling --test dnd_icons
      - name: Run screencast integration tests
        timeout-minutes: 15
        if: needs.changes.outputs.compositor == 'true' || needs.changes.outputs.portal == 'true'
        run: cargo test --locked --features headless --test screenshare
      - name: Run RDP bridge integration tests
        timeout-minutes: 15
        # The compositor half of the bridge: the protocols otto-rdp drives.
        if: needs.changes.outputs.compositor == 'true' || needs.changes.outputs.rdp == 'true'
        run: cargo test --locked --features headless --test rdp_bridge
      - name: Run RDP bridge unit tests
        timeout-minutes: 20
        # The bridge half. Expensive (GStreamer), and nothing outside
        # components/otto-rdp can affect it, so it is gated tightly.
        if: needs.changes.outputs.rdp == 'true'
        run: cargo test --locked -p otto-rdp
      - name: Run portal backend tests
        timeout-minutes: 15
        if: needs.changes.outputs.portal == 'true'
        run: cargo test --locked -p xdg-desktop-portal-otto
      - name: Run font matching tests
        timeout-minutes: 10
        if: needs.changes.outputs.compositor == 'true'
        run: cargo test --locked --lib -p otto -- workspaces::utils::tests --ignored
  
  # Every packaged binary is compiled exactly once here. build-deb, build-rpm
  # and build-arch consume this artifact; each used to run an identical
  # `cargo build --release`, so the same binaries were built three times per
  # run and the cost grew with every component added.
  build-binaries:
    # Package builds only run on merge to main and tags, not on every PR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
      - name: Cargo cache (registry + target)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-build
          cache-on-failure: true
      - name: System dependencies
        run: sudo apt-get update; sudo apt-get install -y libdrm-dev libudev-dev libgbm-dev libxkbcommon-dev libegl1-mesa-dev libwayland-dev libinput-dev libdbus-1-dev libsystemd-dev libseat-dev libpipewire-0.3-dev libfreetype-dev libfontconfig-dev libdisplay-info-dev libpixman-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libpam0g-dev hicolor-icon-theme fonts-dejavu-core
      - name: Build workspace binaries
        run: cargo build --locked --release -p otto -p otto-bar -p otto-islands -p otto-lock -p otto-greeter -p otto-rdp -p xdg-desktop-portal-otto -p otto-settings -p otto-files -p otto-launcher -p otto-quickview
      - name: Upload workspace binaries
        uses: actions/upload-artifact@v4
        with:
          name: otto-binaries
          path: |
            target/release/otto
            target/release/otto-bar
            target/release/otto-islands
            target/release/otto-lock
            target/release/otto-greeter
            target/release/otto-rdp
            target/release/xdg-desktop-portal-otto
            target/release/otto-settings
            target/release/otto-files
            target/release/otto-launcher
            target/release/otto-quickview
          retention-days: 1

  build-deb:
    if: github.event_name != 'pull_request'
    needs: build-binaries
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
      - name: System dependencies
        # Nothing is compiled here, but dpkg-shlibdeps reads the binaries to
        # resolve runtime dependencies, so the shared libraries must be present.
        run: sudo apt-get update; sudo apt-get install -y libdrm-dev libudev-dev libgbm-dev libxkbcommon-dev libegl1-mesa-dev libwayland-dev libinput-dev libdbus-1-dev libsystemd-dev libseat-dev libpipewire-0.3-dev libfreetype-dev libfontconfig-dev libdisplay-info-dev libpixman-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libpam0g-dev hicolor-icon-theme fonts-dejavu-core
      - name: Cargo cache (packaging tools)
        uses: Swatinem/rust-cache@v2
        with:
          # Separate from workspace-build: this job downloads target/release
          # rather than building it, so caching ./target would serve stale
          # binaries. Only ~/.cargo is wanted, for the installed tool.
          shared-key: packaging-tools
          cache-targets: "false"
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked
      - name: Download workspace binaries
        uses: actions/download-artifact@v4
        with:
          name: otto-binaries
          path: target/release
      - name: Restore executable bits
        # upload-artifact does not preserve the executable bit.
        run: chmod +x target/release/*
      - name: Build Debian package
        run: cargo deb --no-build --no-strip
      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: otto-deb
          path: target/debian/*.deb
          retention-days: 30

  build-rpm:
    if: github.event_name != 'pull_request'
    needs: build-binaries
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
      - name: System dependencies
        run: sudo apt-get update; sudo apt-get install -y libdrm-dev libudev-dev libgbm-dev libxkbcommon-dev libegl1-mesa-dev libwayland-dev libinput-dev libdbus-1-dev libsystemd-dev libseat-dev libpipewire-0.3-dev libfreetype-dev libfontconfig-dev libdisplay-info-dev libpixman-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libpam0g-dev hicolor-icon-theme fonts-dejavu-core
      - name: Cargo cache (packaging tools)
        uses: Swatinem/rust-cache@v2
        with:
          # Separate from workspace-build: this job downloads target/release
          # rather than building it, so caching ./target would serve stale
          # binaries. Only ~/.cargo is wanted, for the installed tool.
          shared-key: packaging-tools
          cache-targets: "false"
      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm --locked
      - name: Download workspace binaries
        uses: actions/download-artifact@v4
        with:
          name: otto-binaries
          path: target/release
      - name: Restore executable bits
        run: chmod +x target/release/*
      - name: Build RPM package
        run: cargo generate-rpm
      - name: Upload RPM package
        uses: actions/upload-artifact@v4
        with:
          name: otto-rpm
          path: target/generate-rpm/*.rpm
          retention-days: 30

  build-arch:
    if: github.event_name != 'pull_request'
    needs: build-binaries
    runs-on: ubuntu-24.04
    # No Rust toolchain or system libraries: this job only assembles a tarball.
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Download workspace binaries
        uses: actions/download-artifact@v4
        with:
          name: otto-binaries
          path: target/release
      - name: Restore executable bits
        run: chmod +x target/release/*
      - name: Build Arch tarball
        run: |
          # Read the version out of [workspace.package]. Not `head -1` on the
          # first `version = ` line: the crate inherits with
          # `version.workspace = true`, so the first such line in the file
          # belongs to a [dependencies.*] table and names that dependency.
          PKGVER=$(sed -n '/^\[workspace.package\]/,/^\[/p' Cargo.toml | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          if [ -z "$PKGVER" ]; then
              echo "no [workspace.package] version found in Cargo.toml" >&2
              exit 1
          fi
          TARBALL="otto-${PKGVER}-x86_64.tar.gz"
          tmpdir=$(mktemp -d)
          PKGDIR="otto-${PKGVER}"
          install -Dm755 target/release/otto "$tmpdir/$PKGDIR/target/release/otto"
          install -Dm755 target/release/otto-bar "$tmpdir/$PKGDIR/target/release/otto-bar"
          install -Dm755 target/release/otto-islands "$tmpdir/$PKGDIR/target/release/otto-islands"
          install -Dm755 target/release/otto-lock "$tmpdir/$PKGDIR/target/release/otto-lock"
          install -Dm755 target/release/otto-greeter "$tmpdir/$PKGDIR/target/release/otto-greeter"
          install -Dm755 target/release/otto-rdp "$tmpdir/$PKGDIR/target/release/otto-rdp"
          install -Dm755 target/release/otto-settings "$tmpdir/$PKGDIR/target/release/otto-settings"
          install -Dm755 target/release/otto-files "$tmpdir/$PKGDIR/target/release/otto-files"
          install -Dm755 target/release/otto-launcher "$tmpdir/$PKGDIR/target/release/otto-launcher"
          install -Dm755 target/release/otto-quickview "$tmpdir/$PKGDIR/target/release/otto-quickview"
          install -Dm755 target/release/xdg-desktop-portal-otto "$tmpdir/$PKGDIR/target/release/xdg-desktop-portal-otto"
          install -m644 LICENSE "$tmpdir/$PKGDIR/LICENSE"
          install -m644 README.md "$tmpdir/$PKGDIR/README.md"
          install -m644 otto_config.example.toml "$tmpdir/$PKGDIR/otto_config.example.toml"
          install -Dm644 resources/otto.desktop "$tmpdir/$PKGDIR/resources/otto.desktop"
          install -Dm644 resources/otto-files.desktop "$tmpdir/$PKGDIR/resources/otto-files.desktop"
          install -Dm644 resources/otto-settings.desktop "$tmpdir/$PKGDIR/resources/otto-settings.desktop"
          install -Dm644 components/xdg-desktop-portal-otto/otto.portal "$tmpdir/$PKGDIR/components/xdg-desktop-portal-otto/otto.portal"
          install -Dm644 components/xdg-desktop-portal-otto/org.freedesktop.impl.portal.desktop.otto.service "$tmpdir/$PKGDIR/components/xdg-desktop-portal-otto/org.freedesktop.impl.portal.desktop.otto.service"
          install -Dm644 components/xdg-desktop-portal-otto/xdg-desktop-portal-otto.service "$tmpdir/$PKGDIR/components/xdg-desktop-portal-otto/xdg-desktop-portal-otto.service"
          install -Dm644 components/xdg-desktop-portal-otto/portals.conf.example "$tmpdir/$PKGDIR/components/xdg-desktop-portal-otto/portals.conf.example"
          install -Dm644 components/otto-lock/otto-lock.pam "$tmpdir/$PKGDIR/components/otto-lock/otto-lock.pam"
          install -m644 PKGBUILD-git "$tmpdir/$PKGDIR/PKGBUILD-git"
          install -m644 PKGBUILD-nightly-bin "$tmpdir/$PKGDIR/PKGBUILD-nightly-bin"
          # VERSION file for PKGBUILD-nightly-bin pkgver()
          echo "${PKGVER}.r$(git rev-list --count HEAD).$(git rev-parse --short HEAD)" > "$tmpdir/$PKGDIR/VERSION"
          tar -czf "$TARBALL" -C "$tmpdir" "$PKGDIR"
          # Also produce a fixed-name copy for the nightly release
          cp "$TARBALL" otto-nightly-x86_64.tar.gz
          rm -rf "$tmpdir"
      - name: Upload Arch tarball
        uses: actions/upload-artifact@v4
        with:
          name: otto-arch
          path: otto-*.tar.gz
          retention-days: 30

  publish-nightly:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-arch]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Arch tarball
        uses: actions/download-artifact@v4
        with:
          name: otto-arch
      - name: Publish nightly release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: nightly
          name: Nightly
          prerelease: true
          files: otto-nightly-x86_64.tar.gz
          body: |
            Automated nightly build from the latest commit on `main`.

            ### Arch Linux (binary, no compilation needed)
            ```bash
            mkdir otto && tar -xzf otto-nightly-x86_64.tar.gz -C otto
            cd otto
            makepkg -p PKGBUILD-nightly-bin -si
            ```

            To update, re-download the tarball and re-run `makepkg`.

  validate-pkgbuild:
    needs: changes
    # `release` depends on this job, so it must not be skipped on a tag build
    # even if the diff classifier saw no packaging paths.
    if: needs.changes.outputs.packaging == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: pacman -Syu --noconfirm base-devel git
      - name: Setup build user
        run: |
          useradd -m builder
          chown -R builder:builder .
      - name: Validate PKGBUILD (bin)
        run: |
          DIR=$PWD
          su builder -c "cd $DIR && makepkg --printsrcinfo"
      - name: Validate PKGBUILD-git
        run: |
          DIR=$PWD
          su builder -c "cd $DIR && makepkg --printsrcinfo -p PKGBUILD-git"
      - name: Validate PKGBUILD-nightly-bin
        run: |
          DIR=$PWD
          su builder -c "cd $DIR && makepkg --printsrcinfo -p PKGBUILD-nightly-bin"
  
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-deb, build-rpm, build-arch, validate-pkgbuild]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: otto-deb
          path: artifacts/deb
      - name: Download .rpm artifact
        uses: actions/download-artifact@v4
        with:
          name: otto-rpm
          path: artifacts/rpm
      - name: Download Arch tarball
        uses: actions/download-artifact@v4
        with:
          name: otto-arch
          path: artifacts/arch
      - name: Create release body
        run: |
          cat > release_notes.md << 'EOF'
          ## Installation

          ### Debian/Ubuntu (`.deb`)
          ```bash
          sudo dpkg -i otto_*.deb
          sudo apt-get install -f  # Install dependencies
          ```

          ### Fedora/RHEL (`.rpm`)
          ```bash
          sudo rpm -i otto-*.rpm
          # or
          sudo dnf install otto-*.rpm
          ```

          ### Arch Linux
          ```bash
          curl -O https://raw.githubusercontent.com/nongio/otto/main/PKGBUILD
          makepkg -si
          ```
          If you already downloaded the tarball, place the PKGBUILD in the same directory and run `makepkg -si` — it will use the local file without re-downloading.

          ---
          EOF
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/deb/*.deb
            artifacts/rpm/*.rpm
            artifacts/arch/*.tar.gz
          body_path: release_notes.md
          generate_release_notes: true
          draft: true
          # v1.0.0-rc1 and friends are pre-releases; plain v1.0.0 is not.
          prerelease: ${{ contains(github.ref_name, '-rc') }}