name: Continuous Integration

on:
  push:
    branches:
    - main
    tags:
    - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-rust_stable-${{ hashFiles('**/Cargo.toml') }}
      - name: Format
        run: cargo fmt --all -- --check
  
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - name: Cargo cache (registry + target)
        uses: Swatinem/rust-cache@v2
        with:
          # Shared with build-deb/rpm/arch — cache accumulates debug + release
          # artifacts so successive jobs can incrementally compile.
          shared-key: workspace-build
          cache-on-failure: true
      - name: System dependencies
        run: sudo apt-get update; sudo apt-get install -y libdrm-dev libudev-dev libgbm-dev libxkbcommon-dev libegl1-mesa-dev libwayland-dev libinput-dev libdbus-1-dev libsystemd-dev libseat-dev libpipewire-0.3-dev libfreetype-dev libfontconfig-dev libdisplay-info-dev libpixman-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libpam0g-dev hicolor-icon-theme fonts-dejavu-core
      - name: Clippy
        run: cargo clippy --features "default" -- -D warnings
      - name: Run tests
        run: cargo test --lib --workspace
      - name: Run headless integration tests
        run: cargo test --features headless --test headless_basic
      - name: Run font matching tests
        run: cargo test --lib -p otto -- workspaces::utils::tests --ignored
  
  # Every packaged binary is compiled exactly once here. build-deb, build-rpm
  # and build-arch consume this artifact; each used to run an identical
  # `cargo build --release`, so the same binaries were built three times per
  # run and the cost grew with every component added.
  build-binaries:
    # Package builds only run on merge to main and tags, not on every PR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
      - name: Cargo cache (registry + target)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-build
          cache-on-failure: true
      - name: System dependencies
        run: sudo apt-get update; sudo apt-get install -y libdrm-dev libudev-dev libgbm-dev libxkbcommon-dev libegl1-mesa-dev libwayland-dev libinput-dev libdbus-1-dev libsystemd-dev libseat-dev libpipewire-0.3-dev libfreetype-dev libfontconfig-dev libdisplay-info-dev libpixman-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libpam0g-dev hicolor-icon-theme fonts-dejavu-core
      - name: Build workspace binaries
        run: cargo build --release -p otto -p otto-bar -p otto-islands -p otto-lock -p otto-greeter -p otto-rdp -p xdg-desktop-portal-otto -p otto-settings -p otto-files -p otto-launcher -p otto-quickview
      - name: Upload workspace binaries
        uses: actions/upload-artifact@v4
        with:
          name: otto-binaries
          path: |
            target/release/otto
            target/release/otto-bar
            target/release/otto-islands
            target/release/otto-lock
            target/release/otto-greeter
            target/release/otto-rdp
            target/release/xdg-desktop-portal-otto
            target/release/otto-settings
            target/release/otto-files
            target/release/otto-launcher
            target/release/otto-quickview
          retention-days: 1

  build-deb:
    if: github.event_name != 'pull_request'
    needs: build-binaries
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
      - name: System dependencies
        # Nothing is compiled here, but dpkg-shlibdeps reads the binaries to
        # resolve runtime dependencies, so the shared libraries must be present.
        run: sudo apt-get update; sudo apt-get install -y libdrm-dev libudev-dev libgbm-dev libxkbcommon-dev libegl1-mesa-dev libwayland-dev libinput-dev libdbus-1-dev libsystemd-dev libseat-dev libpipewire-0.3-dev libfreetype-dev libfontconfig-dev libdisplay-info-dev libpixman-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libpam0g-dev hicolor-icon-theme fonts-dejavu-core
      - name: Install cargo-deb
        run: cargo install cargo-deb
      - name: Download workspace binaries
        uses: actions/download-artifact@v4
        with:
          name: otto-binaries
          path: target/release
      - name: Restore executable bits
        # upload-artifact does not preserve the executable bit.
        run: chmod +x target/release/*
      - name: Build Debian package
        run: cargo deb --no-build --no-strip
      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: otto-deb
          path: target/debian/*.deb
          retention-days: 30

  build-rpm:
    if: github.event_name != 'pull_request'
    needs: build-binaries
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
      - name: System dependencies
        run: sudo apt-get update; sudo apt-get install -y libdrm-dev libudev-dev libgbm-dev libxkbcommon-dev libegl1-mesa-dev libwayland-dev libinput-dev libdbus-1-dev libsystemd-dev libseat-dev libpipewire-0.3-dev libfreetype-dev libfontconfig-dev libdisplay-info-dev libpixman-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libpam0g-dev hicolor-icon-theme fonts-dejavu-core
      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm
      - name: Download workspace binaries
        uses: actions/download-artifact@v4
        with:
          name: otto-binaries
          path: target/release
      - name: Restore executable bits
        run: chmod +x target/release/*
      - name: Build RPM package
        run: cargo generate-rpm
      - name: Upload RPM package
        uses: actions/upload-artifact@v4
        with:
          name: otto-rpm
          path: target/generate-rpm/*.rpm
          retention-days: 30

  build-arch:
    if: github.event_name != 'pull_request'
    needs: build-binaries
    runs-on: ubuntu-24.04
    # No Rust toolchain or system libraries: this job only assembles a tarball.
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Download workspace binaries
        uses: actions/download-artifact@v4
        with:
          name: otto-binaries
          path: target/release
      - name: Restore executable bits
        run: chmod +x target/release/*
      - name: Build Arch tarball
        run: |
          PKGVER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          TARBALL="otto-${PKGVER}-x86_64.tar.gz"
          tmpdir=$(mktemp -d)
          PKGDIR="otto-${PKGVER}"
          install -Dm755 target/release/otto "$tmpdir/$PKGDIR/target/release/otto"
          install -Dm755 target/release/otto-bar "$tmpdir/$PKGDIR/target/release/otto-bar"
          install -Dm755 target/release/otto-islands "$tmpdir/$PKGDIR/target/release/otto-islands"
          install -Dm755 target/release/otto-lock "$tmpdir/$PKGDIR/target/release/otto-lock"
          install -Dm755 target/release/otto-greeter "$tmpdir/$PKGDIR/target/release/otto-greeter"
          install -Dm755 target/release/otto-rdp "$tmpdir/$PKGDIR/target/release/otto-rdp"
          install -Dm755 target/release/otto-settings "$tmpdir/$PKGDIR/target/release/otto-settings"
          install -Dm755 target/release/otto-files "$tmpdir/$PKGDIR/target/release/otto-files"
          install -Dm755 target/release/otto-launcher "$tmpdir/$PKGDIR/target/release/otto-launcher"
          install -Dm755 target/release/otto-quickview "$tmpdir/$PKGDIR/target/release/otto-quickview"
          install -Dm755 target/release/xdg-desktop-portal-otto "$tmpdir/$PKGDIR/target/release/xdg-desktop-portal-otto"
          install -m644 LICENSE "$tmpdir/$PKGDIR/LICENSE"
          install -m644 README.md "$tmpdir/$PKGDIR/README.md"
          install -m644 otto_config.example.toml "$tmpdir/$PKGDIR/otto_config.example.toml"
          install -Dm644 resources/otto.desktop "$tmpdir/$PKGDIR/resources/otto.desktop"
          install -Dm644 resources/otto-files.desktop "$tmpdir/$PKGDIR/resources/otto-files.desktop"
          install -Dm644 resources/otto-settings.desktop "$tmpdir/$PKGDIR/resources/otto-settings.desktop"
          install -Dm644 components/xdg-desktop-portal-otto/otto.portal "$tmpdir/$PKGDIR/components/xdg-desktop-portal-otto/otto.portal"
          install -Dm644 components/xdg-desktop-portal-otto/org.freedesktop.impl.portal.desktop.otto.service "$tmpdir/$PKGDIR/components/xdg-desktop-portal-otto/org.freedesktop.impl.portal.desktop.otto.service"
          install -Dm644 components/xdg-desktop-portal-otto/portals.conf.example "$tmpdir/$PKGDIR/components/xdg-desktop-portal-otto/portals.conf.example"
          install -Dm644 components/otto-lock/otto-lock.pam "$tmpdir/$PKGDIR/components/otto-lock/otto-lock.pam"
          install -m644 PKGBUILD-git "$tmpdir/$PKGDIR/PKGBUILD-git"
          install -m644 PKGBUILD-nightly-bin "$tmpdir/$PKGDIR/PKGBUILD-nightly-bin"
          # VERSION file for PKGBUILD-nightly-bin pkgver()
          echo "${PKGVER}.r$(git rev-list --count HEAD).$(git rev-parse --short HEAD)" > "$tmpdir/$PKGDIR/VERSION"
          tar -czf "$TARBALL" -C "$tmpdir" "$PKGDIR"
          # Also produce a fixed-name copy for the nightly release
          cp "$TARBALL" otto-nightly-x86_64.tar.gz
          rm -rf "$tmpdir"
      - name: Upload Arch tarball
        uses: actions/upload-artifact@v4
        with:
          name: otto-arch
          path: otto-*.tar.gz
          retention-days: 30

  publish-nightly:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-arch]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Arch tarball
        uses: actions/download-artifact@v4
        with:
          name: otto-arch
      - name: Publish nightly release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: nightly
          name: Nightly
          prerelease: true
          files: otto-nightly-x86_64.tar.gz
          body: |
            Automated nightly build from the latest commit on `main`.

            ### Arch Linux (binary, no compilation needed)
            ```bash
            mkdir otto && tar -xzf otto-nightly-x86_64.tar.gz -C otto
            cd otto
            makepkg -p PKGBUILD-nightly-bin -si
            ```

            To update, re-download the tarball and re-run `makepkg`.

  validate-pkgbuild:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: pacman -Syu --noconfirm base-devel git
      - name: Setup build user
        run: |
          useradd -m builder
          chown -R builder:builder .
      - name: Validate PKGBUILD (bin)
        run: |
          DIR=$PWD
          su builder -c "cd $DIR && makepkg --printsrcinfo"
      - name: Validate PKGBUILD-git
        run: |
          DIR=$PWD
          su builder -c "cd $DIR && makepkg --printsrcinfo -p PKGBUILD-git"
      - name: Validate PKGBUILD-nightly-bin
        run: |
          DIR=$PWD
          su builder -c "cd $DIR && makepkg --printsrcinfo -p PKGBUILD-nightly-bin"
  
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-deb, build-rpm, build-arch, validate-pkgbuild]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: otto-deb
          path: artifacts/deb
      - name: Download .rpm artifact
        uses: actions/download-artifact@v4
        with:
          name: otto-rpm
          path: artifacts/rpm
      - name: Download Arch tarball
        uses: actions/download-artifact@v4
        with:
          name: otto-arch
          path: artifacts/arch
      - name: Create release body
        run: |
          cat > release_notes.md << 'EOF'
          ## Installation

          ### Debian/Ubuntu (`.deb`)
          ```bash
          sudo dpkg -i otto_*.deb
          sudo apt-get install -f  # Install dependencies
          ```

          ### Fedora/RHEL (`.rpm`)
          ```bash
          sudo rpm -i otto-*.rpm
          # or
          sudo dnf install otto-*.rpm
          ```

          ### Arch Linux
          ```bash
          curl -O https://raw.githubusercontent.com/nongio/otto/main/PKGBUILD
          makepkg -si
          ```
          If you already downloaded the tarball, place the PKGBUILD in the same directory and run `makepkg -si` — it will use the local file without re-downloading.

          ---
          EOF
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/deb/*.deb
            artifacts/rpm/*.rpm
            artifacts/arch/*.tar.gz
          body_path: release_notes.md
          generate_release_notes: true
          draft: true
          prerelease: false