# Display
screen_scale = 1.0
locales = ["en_US", "en"]  # Language preferences for app names/desktop entries, most specific first. Use standard locale identifiers with region codes (e.g., ["fr_FR", "fr"], ["zh_CN", "zh"]); matching falls back from region to bare language.

# Occlusion culling: skip rendering of layers fully hidden behind opaque layers.
# Improves GPU/CPU throughput when windows overlap. Disable if you see missing content.
# occlusion_culling = false

# Theme
cursor_size = 24
font_family = "Inter"
cursor_theme = "Notwaita-Black"
icon_theme = "Adwaita"  # Uncomment to override auto-detection (e.g., "WhiteSur", "Papirus", "Adwaita")
theme_scheme = "Light"  # "Light" or "Dark" - exposed via XDG Desktop Portal Settings
# gtk_theme = "Adwaita"  # Optional: for documentation/reference only
# background_image = "/usr/share/otto/background.jpg"
background_color = "#2c2ca0"  # Fallback gradient color (bottom) when background_image is unavailable

# Accent color for workspace and window selector borders
# Available colors: red, orange, yellow, green, mint, teal, cyan, blue, indigo, purple, pink, gray, brown
accent_color = "blue"

# Inputs
keyboard_repeat_delay = 300
keyboard_repeat_rate = 30

# Autostart — commands to run once at startup, in order.
# Each entry is spawned non-blocking (fire-and-forget). Otto does not
# restart crashed processes; use systemd or another supervisor for that.
#
# [[exec_once]]
# cmd = "otto-bar"
# args = []
#
# [[exec_once]]
# cmd = "waybar"
# args = []
#
# [[exec_once]]
# cmd = "dunst"
# args = []
#
# [[exec_once]]
# cmd = "wlsunset"
# args = ["-l", "48.8", "-L", "2.3"]

# XDG Autostart — launch apps from ~/.config/autostart/*.desktop and /etc/xdg/autostart/*.desktop
# Respects Hidden=true, OnlyShowIn= and NotShowIn= fields (desktop identifier: "Otto").
# Disabled by default.
# xdg_autostart = true

# Login mode — only used when Otto is started with `--login`, where it acts as
# the host compositor for a greeter (the role `cage` plays for gtkgreet).
# In this mode Otto drives the primary output only, shows no dock, app switcher
# or expose, and launches the greeter below instead of the autostart entries.
# Authentication is delegated to greetd; Otto never touches PAM.
#
# [login]
# greeter_command = "otto-greeter"
# greeter_args = []

# Screen locking — the client launched by the `LockSession` action
# (Ctrl+Alt+Escape by default). It speaks ext-session-lock-v1 and authenticates
# the user itself; Otto only hides the session behind it and never touches PAM.
# Any ext-session-lock-v1 locker works here.
#
# [lock]
# locker_command = "otto-lock"
# locker_args = []
# Lock the session after this many seconds with no keyboard, pointer, touch or
# tablet input. 0 (the default) never locks on its own. Clients that take an
# idle inhibitor (idle-inhibit-unstable-v1 — video players, presentations) hold
# the lock off while they play and restart the countdown when they stop.
# auto_lock_timeout = 300

# Systemd integration — send READY=1 via sd_notify and activate graphical-session.target
# when the Wayland socket is ready. Enable this when running Otto as a systemd user service
# (Type=notify in the unit file). Can also be triggered with the --systemd-notify CLI flag.
# systemd_notify = true

# Display profiles (optional)
[displays.named."winit"]
resolution = { width = 1280, height = 1000 }
refresh_hz = 60.0
position = { x = 0, y = 0 }

[[displays.generic]]
match = { connector_prefix = "HDMI" }
resolution = { width = 1920, height = 1080 }
refresh_hz = 60.0
position = { x = 1920, y = 0 }

# Virtual outputs (optional) — headless outputs streamed via PipeWire.
# Each entry creates a compositor output with no physical display.
# Frames are pushed to a PipeWire stream; connect with any PipeWire client
# (e.g. OBS Studio, pw-play, gst-launch-1.0). The PipeWire node ID is
# logged at startup: "Virtual output 'virtual-1' started (PipeWire node 42)".
#
# [[virtual_outputs]]
# name = "virtual-1"
# resolution = { width = 1920, height = 1080 }
# refresh_hz = 60.0
# position = { x = 3840, y = 0 }   # optional: place next to physical outputs

[input]
# Touchpad tap-to-click (1-finger = left click, 2-finger = right click, 3-finger = middle click)
tap_enabled = true
# Tap-and-drag (tap, hold, and drag)
tap_drag_enabled = true
# Tap drag lock (lift finger during drag without releasing)
tap_drag_lock_enabled = false
# Click method: "clickfinger" = 1-finger click=left, 2-finger=right, 3-finger=middle
#               "buttonareas" = traditional (top-right corner = right click)
touchpad_click_method = "clickfinger"
# Disable touchpad while typing
touchpad_dwt_enabled = true
# Natural (reverse) scrolling on touchpad
touchpad_natural_scroll_enabled = true
# Left-handed mode (swap left/right buttons)
touchpad_left_handed = false
# Middle mouse button emulation (left+right click simultaneously)
touchpad_middle_emulation_enabled = false

# Pointer acceleration speed for all pointer devices (mice and touchpads)
# Range: -1.0 (slowest) to 1.0 (fastest), default is 0.0
pointer_accel_speed = 0.0
# Pointer acceleration profile: "adaptive" (default) or "flat" (no acceleration)
pointer_accel_profile = "adaptive"

# Scroll speed multiplier (software-applied). Default is 1.0 (no change).
# Values > 1.0 increase scroll speed; values between 0.0 and 1.0 decrease it.
scroll_speed = 1.0

# Keyboard layout and options (XKB configuration)
# Tools: xkbcli list | ./scripts/show-keys.sh | man xkeyboard-config
#
# xkb_layout = "us"
# xkb_variant = "dvorak"
# xkb_options = [
#     # Common options:
#     "caps:escape",              # Caps Lock → Escape (Vim users)
#     # "ctrl:swapcaps",          # Swap Ctrl and Caps Lock
#     # "altwin:ctrl_win",        # Win/Super → Ctrl (Mac-like)
#     # "compose:ralt",           # Right Alt as Compose key (accents)
#     # "grp:win_space_toggle",   # Win+Space to switch layouts
# ]
#
# Multiple layouts example:
# xkb_layout = "us,ru"
# xkb_options = ["grp:win_space_toggle", "caps:escape"]
#
# With "altwin:ctrl_win", Cmd and the real Ctrl key produce the same event, so
# a "Ctrl+W" binding fires from both — closing the window when you meant ^W in
# a terminal. Otto then matches its shortcuts on Cmd alone and leaves the real
# Ctrl key to the focused application. That follows the option above; set this
# to force it either way.
# mac_style_modifiers = true

# Layer shell (panels, bars, overlays)
[layer_shell]
# Maximum exclusive zone per edge in logical points (0 = unlimited)
# These values are multiplied by screen_scale to get physical pixels
max_top = 100       # Top panels/bars
max_bottom = 100    # Bottom panels/docks
max_left = 50       # Left side panels
max_right = 50      # Right side panels

# Power management
[power_management]
# Enable Otto's lid switch handling (default: true)
# When true, Otto manages display state on lid close/open and owns the suspend
# decision (systemd-logind should be set to HandleLidSwitch=ignore)
# When false, all lid handling is delegated to systemd-logind
manage_lid_switch = true

# What to do when laptop lid closes (default: "auto")
# Options:
#   "auto" - Normal laptop: disable screen, then suspend the system — unless an
#            external monitor is connected (clamshell mode) or a remote client
#            is actively consuming frames (RDP bridge / screenshare), in which
#            case the system keeps running
#   "lock"   - Like "auto", but lock the session first (see [lock] below), the
#            way on_power_button = "lock" does, so the machine wakes to the
#            lock screen. Clamshell and remote sessions stay unlocked: the
#            session is still in use
#   "disable_internal_screen" - Always disable screen but stay running, never
#            suspend (for display managers/kiosks)
on_lid_close = "auto"

# What to do when the hardware power button is pressed (default: "lock")
# Options:
#   "lock"     - Launch the configured locker (see [lock] below)
#   "suspend"  - Suspend the system via logind
#   "shutdown" - Power the machine off via logind
#   "ignore"   - Otto stays out of the way: systemd-logind's HandlePowerKey
#                decides, and the key reaches the focused client as XF86PowerOff
# Anything other than "ignore" requires logind to be configured with
# HandlePowerKey=ignore, otherwise logind acts first. The button is read from
# the raw keycode, so it works even while the session is locked or a greeter
# holds the keyboard.
on_power_button = "lock"

# Audio / Sound feedback
[audio]
# Enable sound effects for UI events like volume changes (default: true)
sound_enabled = true

# XDG Sound Theme name (optional, auto-detect if omitted)
# Uses freedesktop.org Sound Theme specification for sound lookup
# Common themes: "freedesktop", "Pop", "ocean"
# Sounds are loaded from /usr/share/sounds/{theme}/stereo/{event}.oga
sound_theme = "freedesktop"  # Uncomment to override auto-detection

# You can also place custom sounds in resources/ directory:
#   resources/audio-volume-change.oga - Custom volume change sound
# Custom sounds take precedence over theme sounds.

[keyboard_shortcuts]
"Ctrl+Esc" = "Quit"
"Ctrl+Return" = { run = { cmd = "terminator", args = [] } }
# App launcher (Otto's own launcher; --windows lists open windows instead of apps)
"Ctrl+Space" = { run = { cmd = "otto-launcher", args = [] } }
"Ctrl+Shift+P" = { run = { cmd = "otto-launcher", args = ["--windows"] } }
# "Logo+Space" = { run = { cmd = "dolphin", args = [] } }
# "Logo+Shift+B" = { run = { cmd = "firefox", args = [] } }

"Ctrl+1" = { builtin = "Workspace", index = 0 }
"Ctrl+2" = { builtin = "Workspace", index = 1 }
"Ctrl+3" = { builtin = "Workspace", index = 2 }
"Ctrl+4" = { builtin = "Workspace", index = 3 }

"Ctrl+Tab" = "ApplicationSwitchNext"
"Ctrl+Shift+ISO_Left_Tab" = "ApplicationSwitchPrev"
"Ctrl+ArrowUp" = "ToggleMaximizeWindow"
"Ctrl+ArrowLeft" = "TileWindowLeft"
"Ctrl+ArrowRight" = "TileWindowRight"
"Ctrl+grave" = "ApplicationSwitchNextWindow"
"Ctrl+q" = "ApplicationSwitchQuit"
"Prior" = "ExposeShowAll"
"Next" = "ExposeShowDesktop"

# Hardware controls (multimedia keys)
"XF86MonBrightnessUp" = "BrightnessUp"     # Screen brightness up
"XF86MonBrightnessDown" = "BrightnessDown" # Screen brightness down
"XF86AudioRaiseVolume" = "VolumeUp"        # Audio volume up
"XF86AudioLowerVolume" = "VolumeDown"      # Audio volume down
"XF86AudioMute" = "VolumeMute"             # Audio mute toggle
"XF86AudioPlay" = "MediaPlayPause"         # Media play/pause
"XF86AudioNext" = "MediaNext"              # Media next track
"XF86AudioPrev" = "MediaPrev"              # Media previous track
"XF86AudioStop" = "MediaStop"              # Media stop

[dock]
size = 1.0  # Dock size multiplier (0.5 - 2.0, default: 1.0)
# Screen edge the dock is docked to: "bottom" (default), "left" or "right".
# Side docks stack their icons vertically and reserve width instead of height.
# Also changeable at runtime from the dock handle's right-click menu.
position = "bottom"
genie_scale = 0.5
genie_span = 10.0
# Optional icon colorization
# When enabled, dock app icons are tinted to this color (hex RGB).
colorize_icons = false
colorize_color = "#ffffff"
colorize_intensity = 1.0
# Auto-hide the dock when the pointer leaves (default: false)
# The dock reappears when the pointer enters the dock hot-zone.
autohide = false

# Icon magnification on hover (default: true)
# Icons scale up as the pointer approaches, similar to macOS Dock.
# The effect intensity is controlled by genie_scale and genie_span above.
magnification = true

bookmarks = [
  { desktop_id = "org.gnome.Nautilus.desktop" },
  { desktop_id = "org.mozilla.firefox.desktop", label = "Web", exec_args = ["--private-window"] },
  { desktop_id = "org.gnome.Terminal.desktop" }
]

[appswitcher]
# Show the app switcher (cmd-tab panel) on the output the pointer is on
# (default: true). When false it always appears on the primary output.
follow_cursor = true

[workspaces]
# Custom workspace names, written by the workspace selector when you rename a
# label (click it a second time to edit it in place). The key is
# "<output>:<position>", position counting from 0. Workspaces with no entry here
# are labelled "Workspace N".
# names = { "eDP-1:0" = "Mail", "eDP-1:2" = "Code" }
