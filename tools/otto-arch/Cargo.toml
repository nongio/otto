[package]
name = "otto-arch"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Checks the workspace against the layering rules in architecture.toml"
publish = false

# Pure Rust and no system libraries, so CI runs it in a cheap job before the
# compositor is built.
[dependencies]
# The affected-crate selection: determinator diffs the package graphs guppy
# builds from `cargo metadata` at the base and head.
determinator = "0.12"
globset = "0.4"
guppy = "0.17"
regex = "1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# A private, unique directory for the base revision's checkout.
tempfile.workspace = true
# Line numbers in reports.
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }
toml = { workspace = true, features = ["default"] }

[lints]
workspace = true

# proc-macro2 is listed only to turn on span-locations for syn's spans.
[package.metadata.cargo-machete]
ignored = ["proc-macro2"]
