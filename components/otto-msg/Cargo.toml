[package]
name = "otto-msg"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Drive the Otto compositor from a script, the way i3-msg and swaymsg do."

[[bin]]
name = "otto-msg"
path = "src/main.rs"

[dependencies]
zbus.workspace = true
otto-dbus = { path = "../otto-dbus" }
serde_json.workspace = true
libc.workspace = true
wayland-client.workspace = true
wayland-protocols = { workspace = true, features = ["client", "staging"] }
wayland-protocols-wlr = { workspace = true, features = ["client"] }
wayland-protocols-misc = { workspace = true, features = ["client"] }
xkbcommon.workspace = true

[lints]
workspace = true
