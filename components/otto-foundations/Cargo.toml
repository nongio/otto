[package]
name = "otto-foundations"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Otto's UI-free base: XDG directories, file URIs, name matching and logging setup"

# No toolkit, no async runtime, no D-Bus: the portal, the agents daemon and
# otto-search link this as well as otto-kit, so it stays a handful of pure
# functions over the standard library. `tracing-subscriber` is the one
# exception: every Otto program sets up its logging through `logging`.
[dependencies]
percent-encoding = "2.3"
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

[lints]
workspace = true
