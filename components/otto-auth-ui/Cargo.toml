[package]
name = "otto-auth-ui"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The authentication panel Otto shows when it needs a password — shared by the greeter, the lock screen and otto-authorize"

[dependencies]
laye-rs.workspace = true
otto-kit = { path = "../otto-kit" }
# `unstable-locales` is what makes `format_localized` translate %A and %B;
# without it chrono emits English names whatever the locale says.
chrono = { workspace = true, features = ["default", "unstable-locales"] }
taffy.workspace = true
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true, features = ["default"] }
tracing.workspace = true
libc = { workspace = true, optional = true }
# Wipes what was typed into the field, and every copy of it on the way out.
zeroize.workspace = true
# The power buttons ask logind directly.
zbus.workspace = true

[features]
# The PAM conversation otto-lock and otto-authorize share. Off by default so
# the greeter, which talks to greetd rather than PAM, does not link libpam.
pam = ["dep:libc"]

[dependencies.skia-safe]
workspace = true
features = ["gl", "textlayout", "svg", "skottie"]

[dev-dependencies]
laye-rs.workspace = true

# Renders every panel state to PNGs, so the layout can be iterated on without
# taking over a screen with a fullscreen overlay.
[[example]]
name = "preview"
path = "examples/preview.rs"

[lints]
workspace = true
