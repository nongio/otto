[package]
name = "otto-agents-kit"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The agent sessions, their rows and the keys that walk them, shared by Otto's agent UIs"

[dependencies]
otto-kit = { path = "../otto-kit" }
# The session feed talks to otto-agents over the Agent Host Protocol; the ahp
# pins match otto-agents-client's.
ahp = "=0.9.0"
ahp-types = "=0.9.0"
otto-agents-client = { path = "../otto-agents-client" }
serde_json = "1"
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["calloop", "xkbcommon"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"

[lints]
workspace = true
