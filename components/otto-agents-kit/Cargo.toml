[package]
name = "otto-agents-kit"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The agent sessions, their rows and the keys that walk them, shared by Otto's agent UIs"

[dependencies]
otto-kit = { path = "../otto-kit" }
# The session feed talks to otto-agents over the Agent Host Protocol; the ahp
# pins match otto-agents-client's.
ahp.workspace = true
ahp-types.workspace = true
otto-agents-client = { path = "../otto-agents-client" }
serde_json.workspace = true
smithay-client-toolkit = { workspace = true, features = ["calloop", "xkbcommon"] }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing.workspace = true

[lints]
workspace = true
