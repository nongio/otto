[package]
name = "otto-peek"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Press space on a file and see it — Otto's Peek previewer"

# A library the file views embed, plus a binary that is both the sandboxed
# decode worker and a standalone previewer for a path named on the command line.
[lib]
name = "otto_peek"
path = "src/lib.rs"

[[bin]]
name = "otto-peek"
path = "src/main.rs"

[dependencies]
otto-kit = { path = "../otto-kit" }
otto-md-kit = { path = "../otto-md-kit" }
tracing = "0.1"
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }


[dependencies.skia-safe]
version = "=0.93"
features = ["gl", "textlayout", "svg", "skottie"]

[lints]
workspace = true
