[package]
name = "otto-peek"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Press space on a file and see it — Otto's Peek previewer"

# A library the file views embed, plus a binary that is both the sandboxed
# decode worker and a standalone previewer for a path named on the command line.
[lib]
name = "otto_peek"
path = "src/lib.rs"

[[bin]]
name = "otto-peek"
path = "src/main.rs"

[dependencies]
otto-kit = { path = "../otto-kit" }
otto-md-kit = { path = "../otto-md-kit" }
# Playback inside the embedded session. Library only: the GStreamer worker is
# a separate binary built from that crate, found at run time.
otto-media-kit = { path = "../otto-media-kit", default-features = false }
tracing.workspace = true
libc.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "macros"] }
md5 = { package = "md-5", version = "0.10" }
png = "0.18"
# Image sizes from headers, for laying pictures out before they decode.
imagesize = "0.13"
# The `[peek]` section of files.toml; see `config`.
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true, features = ["default"] }


[dependencies.skia-safe]
workspace = true
features = ["gl", "textlayout", "svg", "skottie"]

[lints]
workspace = true
