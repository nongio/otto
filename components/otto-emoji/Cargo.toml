[package]
name = "otto-emoji"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "An emoji picker for Otto — search or browse, pick one, and it is typed where the cursor was"

[dependencies]
laye-rs.workspace = true
otto-kit = { path = "../otto-kit" }
taffy.workspace = true
tracing.workspace = true
wayland-client.workspace = true
smithay-client-toolkit = { workspace = true, features = ["calloop", "xkbcommon"] }
wayland-protocols-wlr = { workspace = true, features = ["client"] }
wayland-protocols-misc = { workspace = true, features = ["client"] }
memfd.workspace = true
xkbcommon.workspace = true

[dependencies.skia-safe]
workspace = true
features = ["gl", "textlayout", "svg", "skottie"]

[lints]
workspace = true

