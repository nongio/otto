[package]
name = "otto-files"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
laye-rs.workspace = true
otto-kit = { path = "../otto-kit" }
otto-peek = { path = "../otto-peek" }
otto-search = { path = "../otto-search" }
# Playback for Peek. Library only: the GStreamer worker is a separate
# binary built from the same crate, found at run time.
otto-media-kit = { path = "../otto-media-kit", default-features = false }
smithay-client-toolkit = { workspace = true, features = ["calloop", "xkbcommon"] }
wayland-client.workspace = true
tracing.workspace = true
libc.workspace = true
zbus.workspace = true
tokio = { workspace = true, features = ["full"] }
# The sidebar's user configuration; see `places_config`.
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true, features = ["default"] }
# Writing the desk's size and position back into files.toml without losing
# the comments and keys around them.
toml_edit.workspace = true
serde_json.workspace = true


[dependencies.skia-safe]
workspace = true
features = ["gl", "textlayout", "svg"]

[dev-dependencies]
khronos-egl = { workspace = true, features = ["dynamic"] }
wayland-egl.workspace = true

[[bin]]
name = "otto-files"
path = "src/main.rs"

[lib]
name = "otto_files"
path = "src/lib.rs"

[lints]
workspace = true
