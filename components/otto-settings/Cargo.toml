[package]
name = "otto-settings"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Settings application for Otto — see specs/settings-app.md"

[dependencies]
otto-kit = { path = "../otto-kit" }
otto-search = { path = "../otto-search" }
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["calloop", "xkbcommon"] }
zbus = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.22"
xcursor = "0.3.3"
# The clock format pop-up previews each format the way otto-bar renders it;
# `unstable-locales` gives the day and month names in the user's language.
chrono = { version = "0.4", default-features = false, features = ["clock", "unstable-locales"] }

[dependencies.skia-safe]
version = "=0.93"
features = ["gl", "textlayout", "svg"]

[lints]
workspace = true
