[package]
name = "otto-settings"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Settings application for Otto — see specs/settings-app.md"

[dependencies]
otto-kit = { path = "../otto-kit" }
otto-search = { path = "../otto-search" }
smithay-client-toolkit = { workspace = true, features = ["calloop", "xkbcommon"] }
zbus.workspace = true
toml_edit.workspace = true
xcursor.workspace = true
# The clock format pop-up previews each format the way otto-bar renders it;
# `unstable-locales` gives the day and month names in the user's language.
chrono = { workspace = true, features = ["clock", "unstable-locales"] }

[dependencies.skia-safe]
workspace = true
features = ["gl", "textlayout", "svg"]

[lints]
workspace = true
