[package]
name = "otto-preview"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "One file in a window of its own, drawn exactly as Peek draws it"

[[bin]]
name = "otto-preview"
path = "src/main.rs"

# The preview itself is Peek's: the session that zooms, pans, pages and
# selects, and the decoder under it, live in otto-peek, which otto-files
# embeds too; playback is otto-media-kit's. This crate is only the window
# around them.
[dependencies]
otto-kit = { path = "../otto-kit" }
# The chat beside the document: the same conversation and log the launcher hosts.
otto-agents-kit = { path = "../otto-agents-kit", features = ["dictation"] }
otto-agents-client = { path = "../otto-agents-client" }
otto-peek = { path = "../otto-peek" }
# Library only: the GStreamer worker is its own binary, installed beside this one.
otto-media-kit = { path = "../otto-media-kit", default-features = false }
smithay-client-toolkit = { workspace = true, features = ["calloop", "xkbcommon"] }
wayland-client.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing.workspace = true
# Marks and the MCP tools speak JSON; a rendered view goes back as base64.
serde_json.workspace = true
serde.workspace = true
base64 = "0.22"
zbus.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
