[package]
name = "otto-greeter"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Login screen for Otto, backed by greetd"

[dependencies]
otto-kit = { path = "../otto-kit" }
otto-auth-ui = { path = "../otto-auth-ui" }
smithay-client-toolkit = { workspace = true, features = ["calloop", "xkbcommon"] }
wayland-client.workspace = true
wayland-protocols-wlr = { workspace = true, features = ["client"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# The answer to a secret prompt is wiped once it has been sent, along with the
# frame it was serialised into.
zeroize = { workspace = true, features = ["serde"] }
tracing.workspace = true

[[example]]
name = "fake_greetd"
path = "examples/fake_greetd.rs"

[lints]
workspace = true
