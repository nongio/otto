[package]
name = "otto-greeter"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Login screen for Otto, backed by greetd"

[dependencies]
otto-kit = { path = "../otto-kit" }
otto-auth-ui = { path = "../otto-auth-ui" }
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The answer to a secret prompt is wiped once it has been sent, along with the
# frame it was serialised into.
zeroize = { version = "1", features = ["serde"] }
tracing = "0.1"

[[example]]
name = "fake_greetd"
path = "examples/fake_greetd.rs"

[lints]
workspace = true
