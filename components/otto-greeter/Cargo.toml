[package]
name = "otto-greeter"
version = "0.1.0"
edition = "2021"
description = "Login screen for Otto, backed by greetd"

[dependencies]
otto-kit = { path = "../otto-kit" }
otto-auth-ui = { path = "../otto-auth-ui" }
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[example]]
name = "fake_greetd"
path = "examples/fake_greetd.rs"

[dependencies.skia-safe]
version = "=0.93"
features = ["gl", "textlayout", "svg", "skottie"]
