[package]
name = "otto-search"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Otto's file search: one query language over the desktop's file index"

# No toolkit, no Wayland: the agents daemon and command-line tools link this
# as well as the apps, so it carries only what talking to LocalSearch needs.
[dependencies]
libc = "0.2"
tokio = { version = "1", features = ["rt"] }
tracing = "0.1"
zbus = { version = "4", default-features = false, features = ["tokio"] }

[lints]
workspace = true

# The command line: `otto-search [--in DIR]... [--limit N] [--json] QUERY...`.
[[bin]]
name = "otto-search"
path = "src/main.rs"
