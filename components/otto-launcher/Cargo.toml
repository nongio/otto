[package]
name = "otto-launcher"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A keyboard-driven launcher for Otto — type to filter apps and windows, Enter to run"

[dependencies]
laye-rs.workspace = true
otto-kit = { path = "../otto-kit", features = ["dictation"] }
otto-md-kit = { path = "../otto-md-kit" }
taffy = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wayland-client = "0.31"
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
freedesktop-desktop-entry = "0.7.5"
shell-words = "1.1"
# Ask mode hands requests to otto-agents, the agent service, over the Agent
# Host Protocol. otto-agents-client carries the transport, the socket's
# whereabouts and the URI spellings, so both ends cannot drift apart.
ahp = "=0.9.0"
ahp-types = "=0.9.0"
otto-agents-client = { path = "../otto-agents-client" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }


[dependencies.skia-safe]
version = "=0.93"
features = ["gl", "textlayout", "svg", "skottie"]

[lints]
workspace = true

[dev-dependencies]
# The picture the ask log draws is a real file on disk; the test needs one.
tempfile = "3"
