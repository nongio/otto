[package]
name = "otto-launcher"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A keyboard-driven launcher for Otto — type to filter apps and windows, Enter to run"

[dependencies]
laye-rs.workspace = true
otto-agents-kit = { path = "../otto-agents-kit" }
otto-kit = { path = "../otto-kit" }
otto-peek = { path = "../otto-peek" }
otto-md-kit = { path = "../otto-md-kit" }
taffy.workspace = true
tracing.workspace = true
wayland-client.workspace = true
smithay-client-toolkit = { workspace = true, features = ["calloop", "xkbcommon"] }
wayland-protocols-wlr = { workspace = true, features = ["client"] }
freedesktop-desktop-entry.workspace = true
# Ask mode hands requests to otto-agents, the agent service, over the Agent
# Host Protocol. otto-agents-client carries the transport, the socket's
# whereabouts and the URI spellings, so both ends cannot drift apart.
ahp.workspace = true
ahp-types.workspace = true
otto-agents-client = { path = "../otto-agents-client" }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
uuid = { workspace = true, features = ["v4"] }


[dependencies.skia-safe]
workspace = true
features = ["gl", "textlayout", "svg", "skottie"]

[lints]
workspace = true

[dev-dependencies]
# The picture the ask log draws is a real file on disk; the test needs one.
tempfile.workspace = true
