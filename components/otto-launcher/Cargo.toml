[package]
name = "otto-launcher"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A keyboard-driven launcher for Otto — type to filter apps and windows, Enter to run"

[dependencies]
laye-rs.workspace = true
# Ask mode, its chat and its log are otto-agents-kit's, shared with the
# other apps that host a conversation.
otto-agents-kit = { path = "../otto-agents-kit" }
otto-kit = { path = "../otto-kit" }
otto-peek = { path = "../otto-peek" }
taffy.workspace = true
tracing.workspace = true
wayland-client.workspace = true
smithay-client-toolkit = { workspace = true, features = ["calloop", "xkbcommon"] }
wayland-protocols-wlr = { workspace = true, features = ["client"] }
freedesktop-desktop-entry.workspace = true

[dependencies.skia-safe]
workspace = true
features = ["gl", "textlayout", "svg", "skottie"]

[lints]
workspace = true
