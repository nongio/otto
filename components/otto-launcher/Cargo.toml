[package]
name = "otto-launcher"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A keyboard-driven launcher for Otto — type to filter apps and windows, Enter to run"

[dependencies]
laye-rs.workspace = true
otto-kit = { path = "../otto-kit" }
taffy = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wayland-client = "0.31"
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
freedesktop-desktop-entry = "0.7.5"
shell-words = "1.1"
# Ask mode hands requests to otto-ahp, the agent service, over the Agent Host
# Protocol. Plain `ws://` to a local service, so no TLS stack.
ahp = "=0.9.0"
ahp-types = "=0.9.0"
ahp-ws = { version = "=0.9.0", default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }


[dependencies.skia-safe]
version = "=0.93"
features = ["gl", "textlayout", "svg", "skottie"]

[lints]
workspace = true
