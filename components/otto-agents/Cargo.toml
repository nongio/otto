[package]
name = "otto-agents"
description = "Otto's agent service: runs ACP agents and serves them over the Agent Host Protocol"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition = "2024"
rust-version = "1.85"

[dependencies]
# The AHP crates move in lockstep with the vendored spec: their version must
# equal AHP_PROTOCOL_VERSION in spec/upstream.env (enforced by tests/spec_pin.rs).
ahp-types = "=0.9.0"
otto-agents-client = { path = "../otto-agents-client" }
ahp = "=0.9.0"
ahp-ws = "=0.9.0"

agent-client-protocol = "2.1"
# Decoding the base64 pictures agents send in ACP messages; see `images`.
base64 = "0.22"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
# Localisation of the dialog sentences this service composes. The .ftl parser
# and the selector runtime; unic-langid does the BCP 47 parsing.
fluent-bundle = "0.15"
futures-util = "0.3"
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.29"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unic-langid = "0.9"
uuid = { version = "1", features = ["v4"] }
# Outbound only: Otto's dialog renderer (otto-islands) for permission prompts.
zbus = { version = "4", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3"
