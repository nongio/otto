[package]
name = "otto-agents"
description = "Otto's agent service: runs ACP agents and serves them over the Agent Host Protocol"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition = "2024"
rust-version = "1.85"

[dependencies]
# The AHP crates move in lockstep with the vendored spec: their version must
# equal AHP_PROTOCOL_VERSION in spec/upstream.env (enforced by tests/spec_pin.rs).
ahp-types.workspace = true
otto-agents-client = { path = "../otto-agents-client" }
ahp.workspace = true
ahp-ws = "=0.9.0"

agent-client-protocol = "2.1"
# Decoding the base64 pictures agents send in ACP messages; see `images`.
base64 = "0.22"
anyhow.workspace = true
clap = { version = "4", features = ["derive", "env"] }
# Localisation of the dialog sentences this service composes. The .ftl parser
# and the selector runtime; unic-langid does the BCP 47 parsing.
fluent-bundle.workspace = true
futures-util.workspace = true
jiff = "0.2"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.29"
toml = "1.1"
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
unic-langid.workspace = true
uuid = { workspace = true, features = ["v4"] }
# Outbound only: Otto's dialog renderer (otto-islands) for permission prompts.
zbus.workspace = true

[dev-dependencies]
tempfile.workspace = true
