[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
# The AHP crates move in lockstep with the vendored spec: their version must
# equal AHP_PROTOCOL_VERSION in spec/upstream.env (enforced by tests/spec_pin.rs).
ahp-types = "=0.9.0"
ahp = "=0.9.0"
ahp-ws = "=0.9.0"

agent-client-protocol = "2.1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
jiff = "0.2"
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.29"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
# Outbound only: Otto's dialog renderer (otto-islands) for permission prompts.
# The same major version Otto uses.
zbus = { version = "4", default-features = false, features = ["tokio"] }
