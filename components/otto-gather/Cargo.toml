[package]
name = "otto-gather"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Proof of concept: gather selections from any app into a balloon, then ask about them in Ask"

[dependencies]
anyhow = "1"
otto-kit = { path = "../otto-kit" }
otto-peek = { path = "../otto-peek" }
serde = "1"
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["calloop"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
zbus = { version = "4", default-features = false, features = ["tokio"] }

[lints]
workspace = true
