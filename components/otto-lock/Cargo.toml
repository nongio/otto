[package]
name = "otto-lock"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Screen locker for Otto, backed by PAM"

[dependencies]
otto-kit = { path = "../otto-kit" }
otto-auth-ui = { path = "../otto-auth-ui", features = ["pam"] }
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Locks and unlocks with no PAM in the way, to exercise the protocol lifecycle.
[[example]]
name = "lock_cycle"
path = "examples/lock_cycle.rs"

[lints]
workspace = true
