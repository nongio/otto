[package]
name = "otto-lock"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Screen locker for Otto, backed by PAM"

[dependencies]
otto-kit = { path = "../otto-kit" }
otto-auth-ui = { path = "../otto-auth-ui", features = ["pam"] }
smithay-client-toolkit = { workspace = true, features = ["calloop", "xkbcommon"] }
wayland-client.workspace = true
wayland-protocols = { workspace = true, features = ["client", "staging"] }
tracing.workspace = true

# Locks and unlocks with no PAM in the way, to exercise the protocol lifecycle.
[[example]]
name = "lock_cycle"
path = "examples/lock_cycle.rs"

[lints]
workspace = true
