[package]
name = "otto-input-overlay"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "On-screen overlays of the touchpad and the keys being pressed, for screen recordings"

[dependencies]
otto-kit = { path = "../otto-kit" }
smithay-client-toolkit = { workspace = true, features = ["calloop", "xkbcommon"] }
wayland-protocols-wlr = { workspace = true, features = ["client"] }
libc.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
zbus.workspace = true
futures-util.workspace = true

[dependencies.skia-safe]
workspace = true
features = ["gl", "textlayout", "svg", "skottie"]

[lints]
workspace = true
