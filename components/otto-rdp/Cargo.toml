[package]
name = "otto-rdp"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "RDP bridge for Otto virtual outputs: serves a virtual output's PipeWire stream over RDP and injects remote input"

[dependencies]
ironrdp-server = { version = "0.13", features = ["egfx"] }
# EGFX / H.264 (AVC420) hardware path: the graphics-pipeline server, the DVC
# framing for its output, and the SVC channel flags. Versions must match the
# ones ironrdp-server 0.13 pulls in (egfx 0.3, dvc/svc 0.8).
ironrdp-egfx = "0.3"
ironrdp-dvc = "0.8"
ironrdp-svc = "0.8"
# Hardware H.264 encode via the PipeWire→VA-API GStreamer graph
# (pipewiresrc ! vapostproc ! vah264enc). Built from a launch string, so only
# core + app (appsink) bindings are needed.
gstreamer.workspace = true
gstreamer-app.workspace = true
bytes = "1"
async-trait = "0.1"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "net", "signal", "time"] }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
pipewire.workspace = true
zbus.workspace = true
futures-util.workspace = true
otto-dbus = { path = "../otto-dbus" }
libc.workspace = true
# Reading back tiled dmabufs the CPU cannot map (gpu_import).
khronos-egl = { workspace = true, features = ["dynamic"] }
gl.workspace = true
memfd.workspace = true
wayland-client.workspace = true
wayland-protocols = { workspace = true, features = ["client"] }
wayland-protocols-wlr = { workspace = true, features = ["client"] }
wayland-protocols-misc = { workspace = true, features = ["client"] }
xkbcommon.workspace = true
# TLS acceptor (--tls): rustls/tokio-rustls are already in the tree via
# ironrdp-server; rcgen generates the self-signed certificate.
rustls = "0.23"
tokio-rustls = "0.26"
rcgen = "0.13"

[lints]
workspace = true
