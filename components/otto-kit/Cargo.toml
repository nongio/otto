[package]
name = "otto-kit"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rustix = { version = "0.38", features = ["fs", "process"], optional = true }
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-egl = "0.32"
wayland-cursor = "0.31"
wayland-scanner = "0.31"
wayland-backend = "0.3"
gl = "0.14"
khronos-egl = { version = "6", features = ["dynamic"] }
calloop = "0.13"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
zbus = { version = "4", default-features = false, features = ["tokio"] }
futures-util = "0.3"
freedesktop-icons = "0.2.4"
resvg = "0.44.0"
usvg = "0.44.0"
lazy_static = "1.4"
libc = "0.2"
pipewire = "0.9"
freedesktop-desktop-entry = "0.7.5"

[features]
default = []
testing = ["rustix"]
debugger = ["laye-rs/debugger"]

[dependencies.laye-rs]
git = "https://github.com/nongio/layers"
tag = "v1.14.0"
# local development: path = "../../../layers"
features = ["export-taffy"]

[dependencies.skia-safe]
version = "=0.93"
features = ["gl", "textlayout", "svg", "skottie"]

[[example]]
name = "simple_app"
path = "examples/simple_app.rs"

[[example]]
name = "dock_application_simple"
path = "examples/dock_application_simple.rs"

[[example]]
name = "dock_application_layer"
path = "examples/dock_application_layer.rs"

[[example]]
name = "center_gravity_test"
path = "examples/center_gravity_test.rs"

[[bench]]
name = "pane_paint"
path = "benches/pane_paint.rs"
harness = false


[lints]
workspace = true
