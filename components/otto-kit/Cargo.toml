[package]
name = "otto-kit"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
laye-rs.workspace = true
otto-dbus = { path = "../otto-dbus" }
# For `i18n::chrono_locale`; the feature is what makes chrono's names local.
chrono = { workspace = true, features = ["unstable-locales"] }
otto-search = { path = "../otto-search" }
rustix = { version = "0.38", features = ["fs", "process"], optional = true }
smithay-client-toolkit = { workspace = true, features = ["calloop", "xkbcommon"] }
wayland-client.workspace = true
wayland-protocols = { workspace = true, features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { workspace = true, features = ["client"] }
wayland-egl.workspace = true
wayland-scanner.workspace = true
wayland-backend.workspace = true
gl.workspace = true
khronos-egl = { workspace = true, features = ["dynamic"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
tokio = { workspace = true, features = ["full"] }
zbus.workspace = true
futures-util.workspace = true
freedesktop-icons = "0.2.4"
resvg = "0.44.0"
usvg = "0.44.0"
libc.workspace = true
percent-encoding = "2.3"
freedesktop-desktop-entry.workspace = true
# Localisation. fluent-bundle carries the .ftl parser, the selector runtime and
# the CLDR plural rules; unic-langid does BCP 47 parsing and negotiation.
fluent-bundle.workspace = true
unic-langid = { workspace = true, features = ["macros"] }
intl-memoizer = "0.5"

# Accessibility. An otto-kit application's UI thread is a hand-rolled poll
# loop, not a tokio runtime, and the adapter has to run its D-Bus work without
# one: accesskit_unix (tokio feature, set in the workspace) runs it on a
# current-thread runtime on a thread of its own.
accesskit.workspace = true
accesskit_unix.workspace = true

[features]
default = []
testing = ["rustix"]
debugger = ["laye-rs/debugger"]


[dependencies.skia-safe]
workspace = true
features = ["gl", "textlayout", "svg", "skottie"]

[[example]]
name = "simple_app"
path = "examples/simple_app.rs"

[[example]]
name = "dock_application_simple"
path = "examples/dock_application_simple.rs"

[[example]]
name = "dock_application_layer"
path = "examples/dock_application_layer.rs"

[[example]]
name = "center_gravity_test"
path = "examples/center_gravity_test.rs"

[[bench]]
name = "pane_paint"
path = "benches/pane_paint.rs"
harness = false


[lints]
workspace = true

# wayland-backend is only referenced by the code `wayland_scanner::generate_interfaces!`
# expands to (src/protocols/mod.rs), which cargo-machete cannot see.
[package.metadata.cargo-machete]
ignored = ["laye-rs", "wayland-backend"]
