[package]
name = "otto-bar"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "otto-bar"
path = "src/main.rs"

[dependencies]
otto-kit = { path = "../otto-kit" }
skia-safe = { workspace = true, features = ["gl", "textlayout"] }
wayland-client.workspace = true
wayland-protocols = { workspace = true, features = ["client"] }
wayland-protocols-wlr = { workspace = true, features = ["client"] }
smithay-client-toolkit = { workspace = true, features = ["calloop"] }
# `unstable-locales` is what makes %A and %B render in the user's language;
# without it chrono emits English names whatever the locale says.
chrono = { workspace = true, features = ["default", "unstable-locales"] }
tokio = { workspace = true, features = ["full"] }
zbus.workspace = true
futures-util.workspace = true
serde_json.workspace = true
tracing.workspace = true
# Reads its config, never writes it: no TOML encoder.
toml = { workspace = true, features = ["std", "serde", "parse"] }

[lints]
workspace = true
