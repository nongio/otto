[package]
name = "otto-bar"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "otto-bar"
path = "src/main.rs"

[dependencies]
otto-kit = { path = "../otto-kit" }
skia-safe = { version = "=0.93", features = ["gl", "textlayout"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["calloop"] }
# `unstable-locales` is what makes %A and %B render in the user's language;
# without it chrono emits English names whatever the locale says.
chrono = { version = "0.4", features = ["unstable-locales"] }
tokio = { version = "1", features = ["full"] }
zbus = { version = "4", default-features = false, features = ["tokio"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }

[lints]
workspace = true
