[package]
name = "otto-stash"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Proof of concept: stash selections from any app into a balloon, then ask about them in Ask"

[dependencies]
anyhow.workspace = true
otto-kit = { path = "../otto-kit" }
otto-peek = { path = "../otto-peek" }
smithay-client-toolkit = { workspace = true, features = ["calloop"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
wayland-client.workspace = true
wayland-protocols = { workspace = true, features = ["client", "staging"] }
wayland-protocols-misc = { workspace = true, features = ["client"] }
wayland-protocols-wlr = { workspace = true, features = ["client"] }
zbus.workspace = true
futures-util.workspace = true

[lints]
workspace = true
