[package]
name = "otto-agents-client"
description = "Talking to otto-agents: its socket, its session URIs and its file URIs"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition = "2024"

[dependencies]
# Must match otto-agents' pins: this crate is the wire between them.
ahp = "=0.9.0"
ahp-types = "=0.9.0"
ahp-ws = { version = "=0.9.0", default-features = false }
futures-util = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["io-util", "net"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }

[lints]
workspace = true
