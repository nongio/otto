[package]
name = "otto-agents-client"
description = "Talking to otto-agents: its socket, its session URIs and its file URIs"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition = "2024"

[dependencies]
# Must match otto-agents' pins: this crate is the wire between them.
ahp.workspace = true
ahp-types.workspace = true
ahp-ws.workspace = true
futures-util.workspace = true
otto-foundations = { path = "../otto-foundations" }
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "net"] }
tokio-tungstenite = { workspace = true, features = ["handshake"] }

[lints]
workspace = true
