[package]
name = "otto"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.87.0"
description = "A visually-focused desktop system designed around smooth animations, thoughtful gestures and careful attention to detail, inspired by familiar macOS interactions."
repository.workspace = true

[dependencies]
bitflags = "2.2.1"
gl-rs = { package = "gl", version = "0.14.0" }
wayland-server = "0.31"
wayland-scanner = "0.31"
wayland-backend = "0.3"
wayland-protocols-wlr = { version = "0.3", features = ["server"] }
image = { version = "0.24.5", optional = true }
xcursor = { version = "0.3.3", optional = true }
xkbcommon = "0.6.0"
thiserror = "1"
anyhow = "1"
usvg = "0.37.0"
rand = "0.10"
tokio = { version = "1", features = ["full"] }
# Accessibility: the AT-SPI object model for Otto's own chrome. `async-io`
# (the default) rather than the tokio executor — the adapter is driven from
# the compositor thread, which is calloop's, not a tokio runtime's.
accesskit = "0.24"
accesskit_unix = "0.22"
fps_ticker = { version = "1.0.0", optional = true }
xdgkit = "3.2.5"
freedesktop-icons = "0.2.4"
freedesktop-desktop-entry = "0.7.5"
sd-notify = "0.4"
libc = "0.2"
shell-words = "1.1"
tracing = { version = "0.1.37", features = [
    "max_level_trace",
    "release_max_level_trace",
] }
tracing-subscriber = { version = "0.3.16", features = ["env-filter"] }
puffin_http = { version = "0.16", optional = true }
profiling = { version = "1.0" }
renderdoc = { version = "0.11.0", optional = true }
serde = "1.0.213"
toml = "0.8.19"
# Comment-preserving TOML editing: settings are persisted one key at a time into
# a hand-editable file (see src/config/file.rs).
toml_edit = "0.22"
once_cell = "1.20"
paste = "1.0.15"
zbus = "4"
pipewire = "0.9"
memfd = "0.6"
memmap2 = "0.9"
brightness = "0.8.0"
mpris = "2.0"
otto-kit = { path = "components/otto-kit" }

laye-rs.workspace = true

[dependencies.smithay-drm-extras]
# fork: includes dmabuf-scanout + xwm focus (set_input_focus/set_active_window)
git = "https://github.com/nongio/smithay"
branch = "feat/dmabuf-scanout"
# local development: path = "../smithay/smithay-drm-extras"
optional = true

[dependencies.smithay]
# fork: includes dmabuf-scanout + xwm focus (set_input_focus/set_active_window)
git = "https://github.com/nongio/smithay"
branch = "feat/dmabuf-scanout"
# local development: path = "../smithay"
default-features = false
features = [
    "backend_winit",
    "wayland_frontend",
    "desktop",
    "backend_gbm",
    "backend_drm",
    "renderer_pixman",
]

[dependencies.x11rb]
default-features = false
features = ["composite"]
optional = true
version = "0.12.0"


# [workspace]
# members = ["wlcs_screencomposer"]


[features]
perf-counters = []
default = ["egl", "winit", "udev", "renderer_sync", "xwayland"]
dev = ["debug", "profile", "debugger"]
debug = ["image/png", "renderdoc"] # "fps_ticker" — add debug-kms explicitly when needed
debug-kms = []
debugger = ["laye-rs/debugger"]
profile = ["profile-with-puffin", "laye-rs/profile-with-puffin"]
ticker = ["fps_ticker"]
metrics = []
egl = ["smithay/use_system_lib", "smithay/backend_egl"]
test_all_features = ["default", "dev"]
udev = [
    "smithay-drm-extras",
    "smithay/backend_libinput",
    "smithay/backend_udev",
    "smithay/backend_drm",
    "smithay/backend_gbm",
    "smithay/backend_vulkan",
    "smithay/backend_egl",
    "smithay/backend_session_libseat",
    "image",
    "smithay/renderer_gl",
    "smithay/renderer_multi",
    "xcursor",
]
winit = ["smithay/backend_winit", "smithay/backend_drm"]
x11 = [
    "smithay/backend_x11",
    "x11rb",
    "smithay/renderer_gl",
    "smithay/backend_vulkan",
]
xwayland = [
    "smithay/xwayland",
    "x11rb",
    "smithay/x11rb_event_source",
    "xcursor",
]
profile-with-puffin = ["profiling/profile-with-puffin", "puffin_http"]
profile-with-tracy = ["profiling/profile-with-tracy"]
profile-with-tracy-mem = ["profile-with-tracy"]
headless = []
renderer_sync = []

[dev-dependencies]
tempfile = "3"
serial_test = "3"
serde_json = "1"
otto-kit = { path = "components/otto-kit", features = ["testing"] }
wayland-client = "0.31"
# Client bindings for the protocols otto-rdp injects input through, so the
# end-to-end tests can act as the RDP bridge does (tests/rdp_bridge.rs).
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
xkbcommon = "0.6.0"

# [profile.release]
# opt-level = 3
# lto = "thin"
# codegen-units = 1
# strip = true
# panic = "abort"

[workspace]
members = [
    "components/xdg-desktop-portal-otto",
    "components/apps-manager",
    "components/otto-rdp",
    "components/otto-kit",
    "components/otto-auth-ui",
    "components/otto-greeter",
    "components/otto-lock",
    "components/otto-bar",
    "components/otto-islands",
    "components/otto-launcher",
    "components/otto-settings",
    "components/otto-files",
    "components/otto-quickview",
    "sample-clients/client-rainbow",
    "sample-clients/submenu",
    "sample-clients/submenu-gtk",
    "sample-clients/deadlock-test",]

# One version for the whole repo: otto and every component crate inherit these
# via `version.workspace = true` (see docs/developer/versioning.md).
# Lints shared by every member (each manifest opts in with `[lints] workspace
# = true`), so a local `cargo clippy` agrees with CI.
[workspace.lints.clippy]
# Protocol method signatures set their own arity: Notify from
# org.freedesktop.Notifications takes eight arguments, and the state and
# rendering calls that carry one through inherit the shape. Bundling them into
# structs to satisfy a counter would hide the correspondence, not clarify it.
too_many_arguments = "allow"

# The rendering stack, declared once. Every member takes it with
# `laye-rs.workspace = true`, so switching to a local checkout for development
# is a one-line change here instead of an edit per component — and no member
# can drift onto a different revision and pull a second copy into the link.
#
# Pinned to a release: v1.15.0 carries `Layer::set_blur_bounds`
# (nongio/layers#24), which confines a client's ext-background-effect-v1 frost
# to the region it asked for instead of its whole surface.
# For local development point this at the checkout — one edit, whole workspace:
#   laye-rs = { path = "../layers", features = ["export-taffy"] }
[workspace.dependencies]
laye-rs = { git = "https://github.com/nongio/layers", tag = "v1.15.0", features = [
    "export-taffy",
] }

[workspace.package]
version = "1.0.0-rc.3"
edition = "2021"
authors = ["Riccardo Canalicchio <riccardo.canalicchio@gmail.com>"]
license = "MIT"
repository = "https://github.com/nongio/otto"



[package.metadata.deb]
maintainer = "Riccardo Canalicchio <riccardo.canalicchio@gmail.com>"
copyright = "2024-2026, Riccardo Canalicchio <riccardo.canalicchio@gmail.com>"
license-file = ["LICENSE", "4"]
extended-description = """\
Otto is a modern Wayland compositor built with Smithay and Skia.\
Featuring a custom scene graph engine (laye-rs) for layout management,\
multi-workspace support, and integrated screen sharing capabilities."""
depends = "$auto, libdrm2, libudev1, libgbm1, libxkbcommon0, libegl1, libwayland-client0, libwayland-egl1, libinput10, libdbus-1-3, libsystemd0, libseat1, libpipewire-0.3-0, libfreetype6, libfontconfig1, libpixman-1-0, fonts-inter, wireplumber"
section = "x11"
priority = "optional"
# otto-rdp loads these at runtime (pipewiresrc, and the VA-API H.264 encoder
# it falls back from), so dpkg-shlibdeps cannot see them. Recommended, not
# required: everything except the RDP bridge works without them.
recommends = "gstreamer1.0-plugins-base, gstreamer1.0-plugins-bad, gstreamer1.0-pipewire"
assets = [
    ["target/release/otto", "usr/bin/", "755"],
    ["target/release/otto-bar", "usr/bin/", "755"],
    ["target/release/otto-islands", "usr/bin/", "755"],
    ["target/release/otto-lock", "usr/bin/", "755"],
    ["target/release/otto-settings", "usr/bin/", "755"],
    ["target/release/otto-files", "usr/bin/", "755"],
    ["target/release/otto-launcher", "usr/bin/", "755"],
    ["target/release/otto-quickview", "usr/bin/", "755"],
    ["target/release/otto-greeter", "usr/bin/", "755"],
    ["target/release/otto-rdp", "usr/bin/", "755"],
    ["target/release/xdg-desktop-portal-otto", "usr/libexec/", "755"],
    ["README.md", "usr/share/doc/otto/", "644"],
    ["LICENSE", "usr/share/doc/otto/", "644"],
    ["otto_config.example.toml", "etc/otto/config.toml", "644"],
    ["resources/otto.desktop", "usr/share/wayland-sessions/", "644"],
    ["resources/otto-files.desktop", "usr/share/applications/", "644"],
    ["resources/otto-settings.desktop", "usr/share/applications/", "644"],
    # The Trash window: otto-files behind its own entry, so it gets its own
    # icon in the dock and the applications list.
    ["resources/otto-trash.desktop", "usr/share/applications/", "644"],
    # otto-files app icon (hicolor theme)
    ["components/otto-files/resources/icons/hicolor/16x16/apps/otto-files.png", "usr/share/icons/hicolor/16x16/apps/otto-files.png", "644"],
    ["components/otto-files/resources/icons/hicolor/24x24/apps/otto-files.png", "usr/share/icons/hicolor/24x24/apps/otto-files.png", "644"],
    ["components/otto-files/resources/icons/hicolor/32x32/apps/otto-files.png", "usr/share/icons/hicolor/32x32/apps/otto-files.png", "644"],
    ["components/otto-files/resources/icons/hicolor/48x48/apps/otto-files.png", "usr/share/icons/hicolor/48x48/apps/otto-files.png", "644"],
    ["components/otto-files/resources/icons/hicolor/64x64/apps/otto-files.png", "usr/share/icons/hicolor/64x64/apps/otto-files.png", "644"],
    ["components/otto-files/resources/icons/hicolor/128x128/apps/otto-files.png", "usr/share/icons/hicolor/128x128/apps/otto-files.png", "644"],
    ["components/otto-files/resources/icons/hicolor/256x256/apps/otto-files.png", "usr/share/icons/hicolor/256x256/apps/otto-files.png", "644"],
    ["components/otto-files/resources/icons/hicolor/512x512/apps/otto-files.png", "usr/share/icons/hicolor/512x512/apps/otto-files.png", "644"],
    ["components/otto-files/resources/icons/hicolor/scalable/apps/otto-files.svg", "usr/share/icons/hicolor/scalable/apps/otto-files.svg", "644"],
    ["components/xdg-desktop-portal-otto/otto.portal", "usr/share/xdg-desktop-portal/portals/", "644"],
    ["components/xdg-desktop-portal-otto/org.freedesktop.impl.portal.desktop.otto.service", "usr/share/dbus-1/services/", "644"],
    # The D-Bus service file above names this unit in SystemdService=.
    ["components/xdg-desktop-portal-otto/xdg-desktop-portal-otto.service", "usr/lib/systemd/user/", "644"],
    ["components/xdg-desktop-portal-otto/portals.conf.example", "usr/share/doc/otto/", "644"],
    # Debian's PAM stack is `common-auth`, not the `system-auth` this file
    # includes, so it ships as an example to copy to /etc/pam.d/otto-lock
    # rather than as a config that would deny every unlock as installed.
    ["components/otto-lock/otto-lock.pam", "usr/share/doc/otto/otto-lock.pam.example", "644"],
]

[package.metadata.generate-rpm]
# RPM forbids a hyphen in Version; "~rc1" is the RPM idiom and sorts
# before 1.0.0, which "1.0.0-rc.1" would not.
version = "1.0.0~rc.3"
assets = [
    { source = "target/release/otto", dest = "/usr/bin/otto", mode = "755" },
    { source = "target/release/otto-bar", dest = "/usr/bin/otto-bar", mode = "755" },
    { source = "target/release/otto-settings", dest = "/usr/bin/otto-settings", mode = "755" },
    { source = "target/release/otto-files", dest = "/usr/bin/otto-files", mode = "755" },
    { source = "target/release/otto-launcher", dest = "/usr/bin/otto-launcher", mode = "755" },
    { source = "target/release/otto-quickview", dest = "/usr/bin/otto-quickview", mode = "755" },
    { source = "resources/otto-files.desktop", dest = "/usr/share/applications/otto-files.desktop", mode = "644" },
    { source = "resources/otto-settings.desktop", dest = "/usr/share/applications/otto-settings.desktop", mode = "644" },
    { source = "resources/otto-trash.desktop", dest = "/usr/share/applications/otto-trash.desktop", mode = "644" },
    # otto-files app icon (hicolor theme)
    { source = "components/otto-files/resources/icons/hicolor/16x16/apps/otto-files.png", dest = "/usr/share/icons/hicolor/16x16/apps/otto-files.png", mode = "644" },
    { source = "components/otto-files/resources/icons/hicolor/24x24/apps/otto-files.png", dest = "/usr/share/icons/hicolor/24x24/apps/otto-files.png", mode = "644" },
    { source = "components/otto-files/resources/icons/hicolor/32x32/apps/otto-files.png", dest = "/usr/share/icons/hicolor/32x32/apps/otto-files.png", mode = "644" },
    { source = "components/otto-files/resources/icons/hicolor/48x48/apps/otto-files.png", dest = "/usr/share/icons/hicolor/48x48/apps/otto-files.png", mode = "644" },
    { source = "components/otto-files/resources/icons/hicolor/64x64/apps/otto-files.png", dest = "/usr/share/icons/hicolor/64x64/apps/otto-files.png", mode = "644" },
    { source = "components/otto-files/resources/icons/hicolor/128x128/apps/otto-files.png", dest = "/usr/share/icons/hicolor/128x128/apps/otto-files.png", mode = "644" },
    { source = "components/otto-files/resources/icons/hicolor/256x256/apps/otto-files.png", dest = "/usr/share/icons/hicolor/256x256/apps/otto-files.png", mode = "644" },
    { source = "components/otto-files/resources/icons/hicolor/512x512/apps/otto-files.png", dest = "/usr/share/icons/hicolor/512x512/apps/otto-files.png", mode = "644" },
    { source = "components/otto-files/resources/icons/hicolor/scalable/apps/otto-files.svg", dest = "/usr/share/icons/hicolor/scalable/apps/otto-files.svg", mode = "644" },
    { source = "target/release/otto-islands", dest = "/usr/bin/otto-islands", mode = "755" },
    { source = "target/release/otto-lock", dest = "/usr/bin/otto-lock", mode = "755" },
    { source = "target/release/otto-greeter", dest = "/usr/bin/otto-greeter", mode = "755" },
    { source = "target/release/otto-rdp", dest = "/usr/bin/otto-rdp", mode = "755" },
    { source = "target/release/xdg-desktop-portal-otto", dest = "/usr/libexec/xdg-desktop-portal-otto", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/otto/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/doc/otto/LICENSE", mode = "644", doc = true },
    { source = "otto_config.example.toml", dest = "/etc/otto/config.toml", mode = "644", config = true },
    { source = "resources/otto.desktop", dest = "/usr/share/wayland-sessions/otto.desktop", mode = "644" },
    { source = "components/xdg-desktop-portal-otto/otto.portal", dest = "/usr/share/xdg-desktop-portal/portals/otto.portal", mode = "644" },
    { source = "components/xdg-desktop-portal-otto/org.freedesktop.impl.portal.desktop.otto.service", dest = "/usr/share/dbus-1/services/org.freedesktop.impl.portal.desktop.otto.service", mode = "644" },
