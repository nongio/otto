<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <style>
    /* Two artworks, one file: the dark-on-light mark by default, the
       light-on-dark one when the browser chrome is in dark mode. */
    .dark { display: none; }
    @media (prefers-color-scheme: dark) {
      .light { display: none; }
      .dark { display: inline; }
    }
  </style>
  <image class="light" width="128" height="128" href="data:image/png;base64,"/>
  <image class="dark" width="128" height="128" href="data:image/png;base64,"/>
</svg>
