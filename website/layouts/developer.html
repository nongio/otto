{{ define "main" }}
    <button id="menu-button">Contents</button>

    {{/* Use built-in TableOfContents */}}
    {{ .TableOfContents }}

    <main>
        <h1 class="breadcrumb-heading">
            <a class="breadcrumb-home" href="{{ .Site.Home.RelPermalink }}">{{ .Site.Home.Title }}</a>
            <span class="breadcrumb-page">{{ .Title }}</span>
        </h1>
        {{ .Content }}
    </main>
{{ end }}
