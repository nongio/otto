[package]
name = "client-rainbow"
version = "0.1.0"
edition = "2021"
authors = ["ScreenComposer Samples"]
description = "Wayland dma-buf client that animates rainbow solid colours"
license = "MIT"
publish = false

[dependencies]
anyhow.workspace = true
wayland-client.workspace = true
drm-fourcc = "2.2"
wayland-protocols = { workspace = true, features = ["client"] }
gbm = { version = "0.16", default-features = false }

[lints]
workspace = true
