<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 244" width="760" height="244" role="img" aria-label="otto-canvas: an otto-kit app that places the Agents panel in the compositor's side canvas, lists otto-agents sessions while shown and hands work to otto-launcher">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .box  { fill: #f6f8fa; stroke: #8b949e; stroke-width: 1.4; }
    .acc  { fill: #ddf4ff; stroke: #218bff; stroke-width: 1.4; }
    .grp  { fill: none; stroke: #8b949e; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .t    { fill: #1f2328; font-size: 13px; }
    .tb   { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .tm   { fill: #656d76; font-size: 11px; }
    .ln   { stroke: #8b949e; stroke-width: 1.4; fill: none; marker-end: url(#ah); }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #6e7681; }
      .acc { fill: #10243b; stroke: #388bfd; }
      .grp { stroke: #6e7681; }
      .t, .tb { fill: #e6edf3; }
      .tm  { fill: #9198a1; }
      .ln  { stroke: #8b949e; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <text class="tb" x="16" y="28">compositor</text>
  <text class="tb" x="236" y="28">otto-canvas</text>
  <text class="tb" x="596" y="28">Talks to</text>
  <rect class="grp" x="226" y="38" width="340" height="190" rx="10"/>

  <rect class="box" x="16" y="52" width="190" height="76" rx="6"/>
  <text class="tb" x="28" y="74">side canvas column</text>
  <text class="tm" x="28" y="92">otto-canvas-v1: configure,</text>
  <text class="tm" x="28" y="106">shown, hidden, max_height</text>
  <text class="tm" x="28" y="120">set_content_height, dismiss</text>

  <rect class="box" x="16" y="150" width="190" height="56" rx="6"/>
  <text class="t" x="28" y="172">[[exec_once]]</text>
  <text class="tm" x="28" y="190">starts it with the session</text>
  <path class="ln" d="M206 178 H222 V128 H238"/>

  <rect class="box" x="240" y="52" width="150" height="76" rx="6"/>
  <text class="tb" x="252" y="74">otto-kit app</text>
  <text class="tm" x="252" y="92">CanvasItemSurface,</text>
  <text class="tm" x="252" y="106">frosted material</text>
  <path class="ln" marker-start="url(#ah)" d="M208 84 H238"/>

  <rect class="acc" x="410" y="52" width="142" height="76" rx="6"/>
  <text class="tb" x="422" y="74">Agents panel</text>
  <text class="tm" x="422" y="92">heading, prompt field,</text>
  <text class="tm" x="422" y="106">session rows</text>
  <path class="ln" d="M390 90 H408"/>

  <rect class="acc" x="410" y="150" width="142" height="56" rx="6"/>
  <text class="tb" x="422" y="172">SessionFeed</text>
  <text class="tm" x="422" y="190">only while shown</text>
  <path class="ln" d="M481 150 V130"/>

  <rect class="box" x="596" y="52" width="150" height="76" rx="6"/>
  <text class="t" x="608" y="74">otto-launcher</text>
  <text class="tm" x="608" y="92">--session URI</text>
  <text class="tm" x="608" y="106">--ask --send -- text</text>
  <text class="tm" x="608" y="120">spawned, then dismiss</text>
  <path class="ln" d="M552 90 H594"/>

  <rect class="box" x="596" y="150" width="150" height="56" rx="6"/>
  <text class="t" x="608" y="172">otto-agents</text>
  <text class="tm" x="608" y="190">sessions over AHP</text>
  <path class="ln" d="M552 178 H594"/>
</svg>
