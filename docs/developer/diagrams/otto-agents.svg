<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 336" width="760" height="336" role="img" aria-label="otto-agents: AHP clients connect over a Unix socket to the service, whose host runs one ACP agent process per session and asks otto-islands over D-Bus">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .box  { fill: #f6f8fa; stroke: #8b949e; stroke-width: 1.4; }
    .acc  { fill: #ddf4ff; stroke: #218bff; stroke-width: 1.4; }
    .grp  { fill: none; stroke: #8b949e; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .t    { fill: #1f2328; font-size: 13px; }
    .tb   { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .tm   { fill: #656d76; font-size: 11px; }
    .ln   { stroke: #8b949e; stroke-width: 1.4; fill: none; marker-end: url(#ah); }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #6e7681; }
      .acc { fill: #10243b; stroke: #388bfd; }
      .grp { stroke: #6e7681; }
      .t, .tb { fill: #e6edf3; }
      .tm  { fill: #9198a1; }
      .ln  { stroke: #8b949e; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <text class="tb" x="16" y="28">AHP clients</text>
  <text class="tb" x="236" y="28">otto-agents serve</text>
  <text class="tb" x="596" y="28">agents</text>
  <rect class="grp" x="226" y="38" width="340" height="284" rx="10"/>

  <rect class="box" x="16" y="44" width="190" height="40" rx="6"/>
  <text class="t" x="28" y="61">otto-launcher</text>
  <text class="tm" x="28" y="76">Ask, agents mode</text>
  <rect class="box" x="16" y="96" width="190" height="40" rx="6"/>
  <text class="t" x="28" y="113">otto-canvas</text>
  <text class="tm" x="28" y="128">sessions in the side canvas</text>
  <rect class="box" x="16" y="148" width="190" height="40" rx="6"/>
  <text class="t" x="28" y="165">otto-preview</text>
  <text class="tm" x="28" y="180">Studio's chat</text>
  <rect class="box" x="16" y="200" width="190" height="40" rx="6"/>
  <text class="t" x="28" y="217">otto-agents CLI</text>
  <text class="tm" x="28" y="232">sessions, show, new, enter</text>
  <rect class="box" x="16" y="252" width="190" height="40" rx="6"/>
  <text class="t" x="28" y="269">chat bridge</text>
  <text class="tm" x="28" y="284">via otto-agents acp</text>

  <rect class="acc" x="240" y="56" width="150" height="56" rx="6"/>
  <text class="tb" x="254" y="79">server</text>
  <text class="tm" x="254" y="97">WebSocket, JSON-RPC</text>
  <text class="tm" x="402" y="74">Unix socket</text>
  <text class="tm" x="402" y="90">$XDG_RUNTIME_DIR/</text>
  <text class="tm" x="402" y="104">otto-agents/agents.sock</text>
  <path class="ln" d="M206 64 L238 74"/>
  <path class="ln" d="M206 116 L238 82"/>
  <path class="ln" d="M206 168 L238 90"/>
  <path class="ln" d="M206 220 L238 98"/>
  <path class="ln" d="M206 272 L238 106"/>

  <rect class="acc" x="240" y="146" width="150" height="60" rx="6"/>
  <text class="tb" x="254" y="170">host</text>
  <text class="tm" x="254" y="188">sessions, chats, seq</text>
  <path class="ln" d="M315 112 V144"/>

  <rect class="acc" x="410" y="146" width="142" height="60" rx="6"/>
  <text class="tb" x="424" y="170">ACP backend</text>
  <text class="tm" x="424" y="188">one per session</text>
  <path class="ln" d="M390 176 H408"/>

  <rect class="box" x="240" y="252" width="150" height="52" rx="6"/>
  <text class="t" x="254" y="273">store</text>
  <text class="tm" x="254" y="290">sessions on disk</text>
  <path class="ln" d="M300 206 V250"/>

  <rect class="box" x="410" y="252" width="142" height="52" rx="6"/>
  <text class="t" x="424" y="273">dialog</text>
  <text class="tm" x="424" y="290">prompts, questions</text>
  <path class="ln" d="M350 206 V228 H480 V250"/>

  <rect class="box" x="602" y="140" width="150" height="66" rx="6"/>
  <rect class="box" x="596" y="146" width="150" height="66" rx="6"/>
  <text class="tb" x="610" y="168">agent process</text>
  <text class="tm" x="610" y="186">child of the service</text>
  <text class="tm" x="610" y="201">ACP on stdio</text>
  <path class="ln" d="M552 176 H594"/>

  <rect class="box" x="596" y="252" width="150" height="52" rx="6"/>
  <text class="t" x="610" y="273">otto-islands</text>
  <text class="tm" x="610" y="290">org.otto.Dialog1</text>
  <path class="ln" d="M552 278 H594"/>
</svg>
