<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 366" width="760" height="366" role="img" aria-label="otto-bar: tray apps and app menus register with services the bar owns; watcher tasks follow the compositor, settings and power; the app thread draws three layer surfaces">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .box  { fill: #f6f8fa; stroke: #8b949e; stroke-width: 1.4; }
    .acc  { fill: #ddf4ff; stroke: #218bff; stroke-width: 1.4; }
    .grp  { fill: none; stroke: #8b949e; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .t    { fill: #1f2328; font-size: 13px; }
    .tb   { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .tm   { fill: #656d76; font-size: 11px; }
    .ln   { stroke: #8b949e; stroke-width: 1.4; fill: none; marker-end: url(#ah); }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #6e7681; }
      .acc { fill: #10243b; stroke: #388bfd; }
      .grp { stroke: #6e7681; }
      .t, .tb { fill: #e6edf3; }
      .tm  { fill: #9198a1; }
      .ln  { stroke: #8b949e; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <text class="tb" x="16" y="28">Apps</text>
  <text class="tb" x="236" y="28">otto-bar</text>
  <text class="tb" x="566" y="28">compositor</text>
  <rect class="grp" x="226" y="38" width="320" height="240" rx="10"/>

  <rect class="box" x="16" y="52" width="190" height="40" rx="6"/>
  <text class="t" x="28" y="69">tray apps</text>
  <text class="tm" x="28" y="84">StatusNotifierItem, dbusmenu</text>
  <rect class="box" x="16" y="112" width="190" height="40" rx="6"/>
  <text class="t" x="28" y="129">apps with menus</text>
  <text class="tm" x="28" y="144">GTK, Qt on X11</text>

  <rect class="acc" x="236" y="52" width="150" height="40" rx="6"/>
  <text class="tb" x="248" y="69">tray watcher</text>
  <text class="tm" x="248" y="84">StatusNotifierWatcher</text>
  <path class="ln" d="M206 72 H234"/>

  <rect class="acc" x="236" y="112" width="150" height="40" rx="6"/>
  <text class="tb" x="248" y="129">menu registrar</text>
  <text class="tm" x="248" y="144">AppMenu.Registrar</text>
  <path class="ln" d="M206 132 H234"/>

  <rect class="box" x="236" y="172" width="150" height="56" rx="6"/>
  <text class="t" x="248" y="190">watcher tasks</text>
  <text class="tm" x="248" y="206">focus, layout, power,</text>
  <text class="tm" x="248" y="220">clock, update check</text>

  <rect class="acc" x="406" y="52" width="130" height="176" rx="6"/>
  <text class="tb" x="420" y="128">app thread</text>
  <text class="tm" x="420" y="146">otto-kit runner,</text>
  <text class="tm" x="420" y="161">redraws on change</text>
  <path class="ln" d="M386 72 H404"/>
  <path class="ln" d="M386 132 H404"/>
  <path class="ln" d="M386 200 H404"/>

  <rect class="box" x="566" y="52" width="180" height="72" rx="6"/>
  <text class="tb" x="580" y="74">layer surfaces</text>
  <text class="tm" x="580" y="92">spacer, left and right panels</text>
  <text class="tm" x="580" y="108">menus as xdg_popup</text>
  <path class="ln" d="M536 88 H564"/>

  <rect class="box" x="16" y="310" width="170" height="40" rx="6"/>
  <text class="t" x="28" y="327">org.otto.Shell1</text>
  <text class="tm" x="28" y="342">compositor</text>
  <rect class="box" x="200" y="310" width="170" height="40" rx="6"/>
  <text class="t" x="212" y="327">org.otto.Settings</text>
  <text class="tm" x="212" y="342">compositor, topbar.*</text>
  <rect class="box" x="384" y="310" width="170" height="40" rx="6"/>
  <text class="t" x="396" y="327">UPower</text>
  <text class="tm" x="396" y="342">power-profiles-daemon</text>
  <rect class="box" x="568" y="310" width="178" height="40" rx="6"/>
  <text class="t" x="580" y="327">org.otto.Dialog1</text>
  <text class="tm" x="580" y="342">otto-islands, log out</text>

  <path class="ln" d="M101 308 V262 H262 V230"/>
  <path class="ln" d="M300 308 V230"/>
  <path class="ln" d="M469 308 V262 H350 V230"/>
  <path class="ln" d="M536 200 H657 V308"/>
</svg>
