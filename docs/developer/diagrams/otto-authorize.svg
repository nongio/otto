<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" role="img" aria-label="otto-authorize: polkitd asks the agent's polkit thread, the app thread shows the dialog, and an attempt thread relays polkit's helper, which reports to polkitd">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .box  { fill: #f6f8fa; stroke: #8b949e; stroke-width: 1.4; }
    .acc  { fill: #ddf4ff; stroke: #218bff; stroke-width: 1.4; }
    .grp  { fill: none; stroke: #8b949e; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .t    { fill: #1f2328; font-size: 13px; }
    .tb   { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .tm   { fill: #656d76; font-size: 11px; }
    .ln   { stroke: #8b949e; stroke-width: 1.4; fill: none; marker-end: url(#ah); }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #6e7681; }
      .acc { fill: #10243b; stroke: #388bfd; }
      .grp { stroke: #6e7681; }
      .t, .tb { fill: #e6edf3; }
      .tm  { fill: #9198a1; }
      .ln  { stroke: #8b949e; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect class="grp" x="206" y="100" width="344" height="294" rx="10"/>
  <text class="tb" x="222" y="122">otto-authorize --polkit-agent</text>

  <rect class="acc" x="222" y="134" width="312" height="56" rx="6"/>
  <text class="tb" x="236" y="156">polkit thread</text>
  <text class="tm" x="236" y="174">GLib main loop, libpolkit-agent-1 listener</text>

  <rect class="acc" x="222" y="220" width="312" height="72" rx="6"/>
  <text class="tb" x="236" y="242">app thread</text>
  <text class="tm" x="236" y="260">Agent: identity, Throttle, one at a time</text>
  <text class="tm" x="236" y="278">Dialog: the otto-auth-ui panel</text>
  <path class="ln" d="M378 190 V218"/>
  <text class="tm" x="386" y="208">Request</text>

  <rect class="acc" x="222" y="322" width="312" height="56" rx="6"/>
  <text class="tb" x="236" y="344">attempt thread</text>
  <text class="tm" x="236" y="362">polkit Session, relays the helper</text>
  <path class="ln" d="M378 292 V320"/>

  <rect class="box" x="576" y="40" width="170" height="56" rx="6"/>
  <text class="t" x="588" y="62">pkexec, services</text>
  <text class="tm" x="588" y="80">protected Otto settings</text>
  <path class="ln" d="M630 96 V132"/>

  <rect class="box" x="576" y="134" width="170" height="56" rx="6"/>
  <text class="t" x="588" y="156">polkitd</text>
  <text class="tm" x="588" y="174">system bus</text>
  <path class="ln" d="M574 152 H536"/>
  <path class="ln" d="M534 174 H574"/>

  <rect class="box" x="576" y="322" width="170" height="56" rx="6"/>
  <text class="t" x="588" y="344">polkit's helper</text>
  <text class="tm" x="588" y="362">runs PAM</text>
  <path class="ln" d="M534 340 H574"/>
  <path class="ln" d="M576 360 H536"/>
  <path class="ln" d="M700 322 V192"/>
  <text class="tm" x="708" y="262">result</text>

  <rect class="box" x="16" y="220" width="170" height="72" rx="6"/>
  <text class="tb" x="28" y="242">compositor</text>
  <text class="tm" x="28" y="260">overlay, exclusive keyboard</text>
  <text class="tm" x="28" y="278">starts and restarts it</text>
  <path class="ln" d="M220 256 H188"/>
  <path class="ln" d="M101 220 V140 H204"/>
  <text class="tm" x="108" y="132">socketpair</text>
</svg>
