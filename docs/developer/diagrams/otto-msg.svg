<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" role="img" aria-label="otto-msg: an argument parser and a blocking otto-dbus proxy call org.otto.Shell1 on the session bus; the compositor answers on its own thread">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .box  { fill: #f6f8fa; stroke: #8b949e; stroke-width: 1.4; }
    .acc  { fill: #ddf4ff; stroke: #218bff; stroke-width: 1.4; }
    .grp  { fill: none; stroke: #8b949e; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .t    { fill: #1f2328; font-size: 13px; }
    .tb   { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .tm   { fill: #656d76; font-size: 11px; }
    .ln   { stroke: #8b949e; stroke-width: 1.4; fill: none; marker-end: url(#ah); }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #6e7681; }
      .acc { fill: #10243b; stroke: #388bfd; }
      .grp { stroke: #6e7681; }
      .t, .tb { fill: #e6edf3; }
      .tm  { fill: #9198a1; }
      .ln  { stroke: #8b949e; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <text class="tb" x="16" y="28">Caller</text>
  <text class="tb" x="196" y="28">otto-msg</text>
  <text class="tb" x="576" y="28">compositor</text>
  <rect class="grp" x="186" y="38" width="220" height="218" rx="10"/>
  <rect class="grp" x="566" y="110" width="180" height="146" rx="10"/>

  <rect class="box" x="16" y="52" width="150" height="52" rx="6"/>
  <text class="t" x="28" y="74">script, terminal</text>
  <text class="tm" x="28" y="92">otto-msg focus right</text>
  <rect class="box" x="16" y="196" width="150" height="48" rx="6"/>
  <text class="t" x="28" y="216">stdout, stderr</text>
  <text class="tm" x="28" y="232">and the exit status</text>

  <rect class="acc" x="200" y="52" width="192" height="52" rx="6"/>
  <text class="tb" x="214" y="74">argument parser</text>
  <text class="tm" x="214" y="92">-t, -m, -r, -q, command tail</text>
  <rect class="acc" x="200" y="124" width="192" height="52" rx="6"/>
  <text class="tb" x="214" y="146">ShellProxyBlocking</text>
  <text class="tm" x="214" y="164">otto-dbus, blocking zbus</text>
  <rect class="acc" x="200" y="196" width="192" height="48" rx="6"/>
  <text class="tb" x="214" y="216">JSON printer</text>
  <text class="tm" x="214" y="232">pretty, raw or quiet</text>

  <path class="ln" d="M166 78 H198"/>
  <path class="ln" d="M296 104 V122"/>
  <path class="ln" d="M296 176 V194"/>
  <path class="ln" d="M200 220 H168"/>

  <rect class="box" x="576" y="124" width="160" height="52" rx="6"/>
  <text class="tb" x="590" y="146">org.otto.Shell1</text>
  <text class="tm" x="590" y="164">src/shell_service.rs</text>
  <rect class="box" x="576" y="196" width="160" height="48" rx="6"/>
  <text class="t" x="590" y="216">compositor thread</text>
  <text class="tm" x="590" y="232">commands, tree JSON</text>
  <path class="ln" d="M640 176 V194"/>
  <path class="ln" d="M672 196 V178"/>

  <text class="tm" x="450" y="100">session bus</text>
  <path class="ln" d="M392 140 H574"/>
  <text class="tm" x="420" y="132">RunCommand, Get*</text>
  <path class="ln" d="M574 162 H394"/>
  <text class="tm" x="420" y="180">replies and signals</text>
</svg>
