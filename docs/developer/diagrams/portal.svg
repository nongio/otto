<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="The portal backend between xdg-desktop-portal and Otto's services">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .box  { fill: #f6f8fa; stroke: #8b949e; stroke-width: 1.4; }
    .acc  { fill: #ddf4ff; stroke: #218bff; stroke-width: 1.4; }
    .grp  { fill: none; stroke: #8b949e; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .t    { fill: #1f2328; font-size: 13px; }
    .tb   { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .tm   { fill: #656d76; font-size: 11px; }
    .ln   { stroke: #8b949e; stroke-width: 1.4; fill: none; marker-end: url(#ah); }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #6e7681; }
      .acc { fill: #10243b; stroke: #388bfd; }
      .grp { stroke: #6e7681; }
      .t, .tb { fill: #e6edf3; }
      .tm  { fill: #9198a1; }
      .ln  { stroke: #8b949e; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect class="box" x="20" y="16" width="340" height="40" rx="6"/>
  <text class="tb" x="36" y="41">app</text>
  <path class="ln" d="M190 56 V84"/>
  <text class="tm" x="200" y="74">org.freedesktop.portal.*</text>

  <rect class="box" x="20" y="86" width="340" height="56" rx="6"/>
  <text class="tb" x="36" y="108">xdg-desktop-portal</text>
  <text class="tm" x="36" y="126">frontend: app identity, tokens, permission checks</text>
  <path class="ln" d="M190 142 V170"/>
  <text class="tm" x="200" y="160">org.freedesktop.impl.portal.*</text>

  <rect class="acc" x="20" y="172" width="340" height="44" rx="6"/>
  <text class="tb" x="36" y="199">xdg-desktop-portal-otto</text>
  <path d="M360 194 H400 M400 40 V342" stroke="#8b949e" stroke-width="1.4" fill="none"/>

  <path class="ln" d="M400 40 H518"/>
  <text class="tm" x="406" y="34">org.otto.ScreenCast</text>
  <rect class="box" x="520" y="18" width="220" height="44" rx="6"/>
  <text class="tb" x="534" y="37">compositor</text>
  <text class="tm" x="534" y="53">capture sessions, PipeWire</text>

  <path class="ln" d="M400 100 H518"/>
  <text class="tm" x="406" y="94">org.otto.Settings</text>
  <rect class="box" x="520" y="78" width="220" height="44" rx="6"/>
  <text class="tb" x="534" y="97">compositor</text>
  <text class="tm" x="534" y="113">settings, Changed signal</text>

  <path class="ln" d="M400 160 H518"/>
  <text class="tm" x="406" y="154">org.otto.Dialog1</text>
  <rect class="box" x="520" y="138" width="220" height="44" rx="6"/>
  <text class="tb" x="534" y="157">otto-islands</text>
  <text class="tm" x="534" y="173">Access-style dialogs</text>

  <path class="ln" d="M400 220 H518"/>
  <text class="tm" x="406" y="214">org.otto.FilePicker1</text>
  <rect class="box" x="520" y="198" width="220" height="44" rx="6"/>
  <text class="tb" x="534" y="217">otto-files</text>
  <text class="tm" x="534" y="233">file chooser, bus-activated</text>

  <path class="ln" d="M400 280 H518"/>
  <text class="tm" x="406" y="274">PermissionStore</text>
  <rect class="box" x="520" y="258" width="220" height="44" rx="6"/>
  <text class="tb" x="534" y="277">xdg-permission-store</text>
  <text class="tm" x="534" y="293">remembered screen shares</text>

  <path class="ln" d="M400 342 H518"/>
  <text class="tm" x="406" y="336">grim</text>
  <rect class="box" x="520" y="320" width="220" height="44" rx="6"/>
  <text class="tb" x="534" y="339">compositor</text>
  <text class="tm" x="534" y="355">wlr-screencopy, one PNG</text>
</svg>
