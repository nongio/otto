<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 356" width="760" height="356" role="img" aria-label="otto-lock: the compositor starts the locker on a socketpair; the locker takes the lock, draws a panel on every output and runs PAM on a thread of its own">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .box  { fill: #f6f8fa; stroke: #8b949e; stroke-width: 1.4; }
    .acc  { fill: #ddf4ff; stroke: #218bff; stroke-width: 1.4; }
    .grp  { fill: none; stroke: #8b949e; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .t    { fill: #1f2328; font-size: 13px; }
    .tb   { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .tm   { fill: #656d76; font-size: 11px; }
    .ln   { stroke: #8b949e; stroke-width: 1.4; fill: none; marker-end: url(#ah); }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #6e7681; }
      .acc { fill: #10243b; stroke: #388bfd; }
      .grp { stroke: #6e7681; }
      .t, .tb { fill: #e6edf3; }
      .tm  { fill: #9198a1; }
      .ln  { stroke: #8b949e; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect class="box" x="16" y="72" width="180" height="252" rx="6"/>
  <text class="tb" x="28" y="96">compositor</text>
  <text class="tm" x="28" y="114">src/lock.rs</text>
  <text class="tm" x="28" y="140">blanks every output</text>
  <text class="tm" x="28" y="156">as soon as a lock begins</text>
  <text class="tm" x="28" y="182">offers the lock protocol</text>
  <text class="tm" x="28" y="198">to this client alone</text>
  <text class="tm" x="28" y="224">starts a new locker</text>
  <text class="tm" x="28" y="240">if this one dies</text>
  <path class="ln" d="M106 72 V56 H234"/>
  <text class="tm" x="114" y="48">starts it, socketpair</text>

  <rect class="grp" x="236" y="36" width="300" height="306" rx="10"/>
  <text class="tb" x="252" y="60">otto-lock</text>

  <rect class="acc" x="252" y="76" width="268" height="56" rx="6"/>
  <text class="tb" x="266" y="98">lock lifecycle</text>
  <text class="tm" x="266" y="116">ext-session-lock-v1: lock, unlock</text>
  <path class="ln" d="M198 94 H250"/>
  <path class="ln" d="M250 116 H198"/>

  <rect class="acc" x="252" y="152" width="268" height="56" rx="6"/>
  <text class="tb" x="266" y="174">lock surface per output</text>
  <text class="tm" x="266" y="192">an otto-auth-ui Panel on each</text>
  <path class="ln" d="M250 180 H198"/>

  <rect class="acc" x="252" y="228" width="268" height="52" rx="6"/>
  <text class="tb" x="266" y="250">PAM thread</text>
  <text class="tm" x="266" y="268">Service::LOCK, starts once locked</text>

  <rect class="box" x="252" y="292" width="268" height="36" rx="6"/>
  <text class="t" x="266" y="315">power thread</text>

  <rect class="box" x="576" y="228" width="170" height="52" rx="6"/>
  <text class="t" x="588" y="250">PAM stack</text>
  <text class="tm" x="588" y="268">/etc/pam.d/otto-lock</text>
  <path class="ln" d="M520 254 H574"/>

  <rect class="box" x="576" y="292" width="170" height="36" rx="6"/>
  <text class="t" x="588" y="315">logind</text>
  <path class="ln" d="M520 310 H574"/>
</svg>
