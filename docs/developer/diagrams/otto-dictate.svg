<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 336" width="760" height="336" role="img" aria-label="otto-dictate: toggles from a socket, microphone capture and recognition passes feed one event loop, which drives the input method and its popup; passes go to a local speech server">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .box  { fill: #f6f8fa; stroke: #8b949e; stroke-width: 1.4; }
    .acc  { fill: #ddf4ff; stroke: #218bff; stroke-width: 1.4; }
    .grp  { fill: none; stroke: #8b949e; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .t    { fill: #1f2328; font-size: 13px; }
    .tb   { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .tm   { fill: #656d76; font-size: 11px; }
    .ln   { stroke: #8b949e; stroke-width: 1.4; fill: none; marker-end: url(#ah); }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #6e7681; }
      .acc { fill: #10243b; stroke: #388bfd; }
      .grp { stroke: #6e7681; }
      .t, .tb { fill: #e6edf3; }
      .tm  { fill: #9198a1; }
      .ln  { stroke: #8b949e; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <text class="tb" x="16" y="28">Inputs</text>
  <text class="tb" x="236" y="28">otto-dictate</text>
  <text class="tb" x="566" y="28">compositor</text>
  <rect class="grp" x="226" y="38" width="320" height="270" rx="10"/>

  <rect class="box" x="16" y="52" width="190" height="40" rx="6"/>
  <text class="t" x="28" y="69">otto-dictate toggle</text>
  <text class="tm" x="28" y="84">one line on the socket</text>
  <rect class="box" x="16" y="132" width="190" height="40" rx="6"/>
  <text class="t" x="28" y="149">microphone</text>
  <text class="tm" x="28" y="164">default PipeWire source</text>
  <rect class="box" x="16" y="240" width="190" height="40" rx="6"/>
  <text class="t" x="28" y="257">dictation.toml</text>
  <text class="tm" x="28" y="272">written by Settings</text>

  <rect class="box" x="236" y="52" width="150" height="40" rx="6"/>
  <text class="t" x="248" y="69">toggle socket</text>
  <text class="tm" x="248" y="84">accept thread</text>
  <path class="ln" d="M206 72 H234"/>
  <path class="ln" d="M386 72 H404"/>

  <rect class="box" x="236" y="132" width="150" height="40" rx="6"/>
  <text class="t" x="248" y="149">capture</text>
  <text class="tm" x="248" y="164">16 kHz mono</text>
  <path class="ln" d="M206 152 H234"/>
  <path class="ln" d="M386 152 H404"/>

  <rect class="acc" x="236" y="232" width="150" height="56" rx="6"/>
  <text class="tb" x="248" y="254">recognition passes</text>
  <text class="tm" x="248" y="272">a thread per pass</text>
  <path class="ln" d="M206 260 H234"/>
  <path class="ln" d="M386 260 H404"/>

  <rect class="acc" x="406" y="52" width="130" height="236" rx="6"/>
  <text class="tb" x="420" y="140">event loop</text>
  <text class="tm" x="420" y="158">calloop: Wayland,</text>
  <text class="tm" x="420" y="173">toggles, results,</text>
  <text class="tm" x="420" y="188">timer; draws the</text>
  <text class="tm" x="420" y="203">balloon</text>

  <rect class="box" x="566" y="52" width="180" height="72" rx="6"/>
  <text class="t" x="580" y="74">input method v2</text>
  <text class="tm" x="580" y="92">activate, keyboard grab,</text>
  <text class="tm" x="580" y="108">commit_string</text>
  <path class="ln" d="M536 88 H564"/>

  <rect class="box" x="566" y="140" width="180" height="40" rx="6"/>
  <text class="t" x="580" y="157">input popup</text>
  <text class="tm" x="580" y="172">the balloon at the caret</text>
  <path class="ln" d="M536 160 H564"/>

  <text class="tb" x="566" y="220">local service</text>
  <rect class="box" x="566" y="232" width="180" height="56" rx="6"/>
  <text class="t" x="580" y="252">speech server</text>
  <text class="tm" x="580" y="268">127.0.0.1:8080/inference</text>
  <text class="tm" x="580" y="282">otto-stt-&lt;engine&gt; unit</text>
  <path class="ln" d="M311 288 V322 H656 V290"/>
</svg>
