<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" role="img" aria-label="otto-input-overlay: the app loop drains touchpad and keyboard evdev nodes and draws two subsurfaces on an overlay layer surface; a tray applet driven from the top bar toggles them">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .box  { fill: #f6f8fa; stroke: #8b949e; stroke-width: 1.4; }
    .acc  { fill: #ddf4ff; stroke: #218bff; stroke-width: 1.4; }
    .grp  { fill: none; stroke: #8b949e; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .t    { fill: #1f2328; font-size: 13px; }
    .tb   { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .tm   { fill: #656d76; font-size: 11px; }
    .ln   { stroke: #8b949e; stroke-width: 1.4; fill: none; marker-end: url(#ah); }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #6e7681; }
      .acc { fill: #10243b; stroke: #388bfd; }
      .grp { stroke: #6e7681; }
      .t, .tb { fill: #e6edf3; }
      .tm  { fill: #9198a1; }
      .ln  { stroke: #8b949e; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <text class="tb" x="16" y="28">kernel</text>
  <text class="tb" x="236" y="28">otto-input-overlay</text>
  <text class="tb" x="566" y="28">compositor and bar</text>
  <rect class="grp" x="226" y="38" width="320" height="236" rx="10"/>

  <rect class="box" x="16" y="60" width="190" height="40" rx="6"/>
  <text class="t" x="28" y="77">touchpad node</text>
  <text class="tm" x="28" y="92">/dev/input/event*, ABS_MT_*</text>
  <rect class="box" x="16" y="120" width="190" height="40" rx="6"/>
  <text class="t" x="28" y="137">keyboard nodes</text>
  <text class="tm" x="28" y="152">EV_KEY</text>

  <rect class="acc" x="236" y="52" width="150" height="108" rx="6"/>
  <text class="tb" x="250" y="96">app loop</text>
  <text class="tm" x="250" y="114">poll_fds, on_update;</text>
  <text class="tm" x="250" y="129">drains every node</text>
  <path class="ln" d="M206 80 H234"/>
  <path class="ln" d="M206 140 H234"/>

  <rect class="box" x="406" y="52" width="130" height="40" rx="6"/>
  <text class="t" x="418" y="69">keys.rs</text>
  <text class="tm" x="418" y="84">chord labels</text>
  <path class="ln" d="M386 72 H404"/>

  <rect class="acc" x="406" y="120" width="130" height="40" rx="6"/>
  <text class="tb" x="418" y="137">overlays</text>
  <text class="tm" x="418" y="152">fingers and keys</text>
  <path class="ln" d="M386 140 H404"/>
  <path class="ln" d="M471 92 V118"/>

  <rect class="box" x="236" y="204" width="150" height="56" rx="6"/>
  <text class="tb" x="250" y="224">applet</text>
  <text class="tm" x="250" y="242">StatusNotifierItem</text>
  <path class="ln" d="M311 204 V162"/>
  <text class="tm" x="318" y="188">toggles</text>

  <rect class="box" x="566" y="110" width="180" height="60" rx="6"/>
  <text class="t" x="580" y="130">overlay layer surface</text>
  <text class="tm" x="580" y="147">two subsurfaces; the input</text>
  <text class="tm" x="580" y="161">region follows them</text>
  <path class="ln" d="M536 140 H564"/>

  <rect class="box" x="566" y="212" width="180" height="40" rx="6"/>
  <text class="t" x="580" y="229">otto-bar</text>
  <text class="tm" x="580" y="244">tray host, the menu</text>
  <path class="ln" d="M564 232 H388"/>
  <text class="tm" x="420" y="226">menu clicks</text>
</svg>
