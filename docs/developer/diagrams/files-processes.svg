<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Files: one browser process with windows of columns, plus the desk and picker processes">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .box  { fill: #f6f8fa; stroke: #8b949e; stroke-width: 1.4; }
    .acc  { fill: #ddf4ff; stroke: #218bff; stroke-width: 1.4; }
    .grp  { fill: none; stroke: #8b949e; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .t    { fill: #1f2328; font-size: 13px; }
    .tb   { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .tm   { fill: #656d76; font-size: 11px; }
    .ln   { stroke: #8b949e; stroke-width: 1.4; fill: none; marker-end: url(#ah); }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #6e7681; }
      .acc { fill: #10243b; stroke: #388bfd; }
      .grp { stroke: #6e7681; }
      .t, .tb { fill: #e6edf3; }
      .tm  { fill: #9198a1; }
      .ln  { stroke: #8b949e; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect class="grp" x="20" y="16" width="720" height="300" rx="10"/>
  <text class="tm" x="36" y="36">one session</text>

  <rect class="box" x="40" y="50" width="420" height="150" rx="8"/>
  <text class="tb" x="56" y="72">otto-files</text>
  <text class="tm" x="132" y="72">browser process</text>

  <text class="t" x="56" y="106">window A</text>
  <rect class="acc" x="140" y="90" width="40" height="24" rx="4"/>
  <text class="t" x="153" y="107">~</text>
  <rect class="acc" x="186" y="90" width="70" height="24" rx="4"/>
  <text class="t" x="197" y="107">~/src</text>
  <rect class="acc" x="262" y="90" width="110" height="24" rx="4"/>
  <text class="t" x="273" y="107">~/src/otto</text>

  <text class="t" x="56" y="140">window B</text>
  <rect class="acc" x="140" y="124" width="100" height="24" rx="4"/>
  <text class="t" x="151" y="141">~/Pictures</text>

  <text class="t" x="56" y="176">Trash window</text>

  <text class="tm" x="480" y="98">columns are the window's path stack</text>
  <text class="tm" x="480" y="114">each column owns its listing,</text>
  <text class="tm" x="480" y="130">selection, scroll position and watch</text>

  <rect class="box" x="40" y="214" width="420" height="40" rx="8"/>
  <text class="tb" x="56" y="239">otto-files --desk</text>
  <text class="tm" x="480" y="239">desk process: one layer surface</text>

  <rect class="box" x="40" y="266" width="420" height="40" rx="8"/>
  <text class="tb" x="56" y="291">otto-files --picker</text>
  <text class="tm" x="480" y="291">picker: started by the bus, exits when idle</text>
</svg>
