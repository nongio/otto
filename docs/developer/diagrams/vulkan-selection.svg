<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="How Otto picks between the OpenGL and Vulkan renderers at startup">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .box  { fill: #f6f8fa; stroke: #8b949e; stroke-width: 1.4; }
    .acc  { fill: #ddf4ff; stroke: #218bff; stroke-width: 1.4; }
    .warn { fill: #fff8c5; stroke: #bf8700; stroke-width: 1.4; }
    .t    { fill: #1f2328; font-size: 13px; }
    .tb   { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .tm   { fill: #656d76; font-size: 11px; }
    .ln   { stroke: #8b949e; stroke-width: 1.4; fill: none; marker-end: url(#ah); }
    @media (prefers-color-scheme: dark) {
      .box  { fill: #161b22; stroke: #6e7681; }
      .acc  { fill: #10243b; stroke: #388bfd; }
      .warn { fill: #272115; stroke: #9e6a03; }
      .t, .tb { fill: #e6edf3; }
      .tm   { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <text class="tb" x="20" y="24">Choosing the renderer (udev backend only)</text>

  <rect class="box" x="30" y="40" width="250" height="52" rx="7"/>
  <text class="t"  x="44" y="62">--renderer gl|vulkan</text>
  <text class="tm" x="44" y="80">command line, wins over the config</text>

  <rect class="box" x="480" y="40" width="250" height="52" rx="7"/>
  <text class="t"  x="494" y="62">[rendering] renderer</text>
  <text class="tm" x="494" y="80">config; Settings › General › Renderer</text>

  <path class="ln" style="marker-end:none" d="M155 92 L155 112 L380 112"/>
  <path class="ln" style="marker-end:none" d="M605 92 L605 112 L380 112"/>
  <path class="ln" d="M380 112 L380 132"/>

  <rect class="box" x="230" y="132" width="300" height="50" rx="7"/>
  <text class="t"  x="244" y="154">udev::run_selected  —  udev/init.rs</text>
  <text class="tm" x="244" y="172">asked for Vulkan? probe the primary GPU first</text>

  <path class="ln" d="M380 182 L380 212"/>

  <rect class="box" x="230" y="212" width="300" height="50" rx="7"/>
  <text class="t"  x="244" y="234">vulkan_api::probe(node)</text>
  <text class="tm" x="244" y="252">1.3 instance + a device on this DRM node?</text>

  <path class="ln" d="M300 262 L180 312"/>
  <text class="tm" x="170" y="290">yes</text>
  <path class="ln" d="M460 262 L580 312"/>
  <text class="tm" x="535" y="290">no: warn, remember why</text>

  <rect class="acc" x="40" y="312" width="280" height="80" rx="7"/>
  <text class="tb" x="54" y="334">run_udev::&lt;VulkanApi&gt;</text>
  <text class="tm" x="54" y="354">GbmVulkanBackend → SkiaVkRenderer</text>
  <text class="tm" x="54" y="370">per DRM node; planes off for now</text>
  <text class="tm" x="54" y="386">log: renderer: vulkan</text>

  <rect class="warn" x="440" y="312" width="280" height="80" rx="7"/>
  <text class="tb" x="454" y="334">run_udev::&lt;GlApi&gt;</text>
  <text class="tm" x="454" y="354">GbmGlesBackend → SkiaRenderer</text>
  <text class="tm" x="454" y="370">Settings shows Vulkan as unavailable</text>
  <text class="tm" x="454" y="386">the default when nothing asks for Vulkan</text>
</svg>
