<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 316" width="760" height="316" role="img" aria-label="otto-settings: the window reads a settings store filled from org.otto.Settings and kept current by a Changed listener; panes set values on the compositor and reach system services, files and units on worker threads">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .box  { fill: #f6f8fa; stroke: #8b949e; stroke-width: 1.4; }
    .acc  { fill: #ddf4ff; stroke: #218bff; stroke-width: 1.4; }
    .grp  { fill: none; stroke: #8b949e; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .t    { fill: #1f2328; font-size: 13px; }
    .tb   { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .tm   { fill: #656d76; font-size: 11px; }
    .ln   { stroke: #8b949e; stroke-width: 1.4; fill: none; marker-end: url(#ah); }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #6e7681; }
      .acc { fill: #10243b; stroke: #388bfd; }
      .grp { stroke: #6e7681; }
      .t, .tb { fill: #e6edf3; }
      .tm  { fill: #9198a1; }
      .ln  { stroke: #8b949e; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <text class="tb" x="26" y="28">otto-settings</text>
  <text class="tb" x="420" y="28">compositor</text>
  <rect class="grp" x="16" y="38" width="340" height="156" rx="10"/>

  <rect class="acc" x="28" y="52" width="150" height="60" rx="6"/>
  <text class="tb" x="42" y="76">window</text>
  <text class="tm" x="42" y="94">draws every frame</text>

  <rect class="acc" x="196" y="52" width="148" height="60" rx="6"/>
  <text class="tb" x="210" y="76">settings store</text>
  <text class="tm" x="210" y="94">schema, values</text>
  <path class="ln" d="M196 82 H180"/>

  <rect class="box" x="28" y="132" width="150" height="50" rx="6"/>
  <text class="tb" x="42" y="152">panes</text>
  <text class="tm" x="42" y="168">work on threads</text>
  <path class="ln" d="M103 112 V130"/>

  <rect class="box" x="196" y="132" width="148" height="50" rx="6"/>
  <text class="t" x="210" y="152">settings-changed</text>
  <text class="tm" x="210" y="168">listener thread</text>
  <path class="ln" d="M270 132 V114"/>

  <rect class="box" x="420" y="52" width="180" height="130" rx="6"/>
  <text class="tb" x="434" y="108">org.otto.Settings</text>
  <text class="tm" x="434" y="126">Describe, Get, Set,</text>
  <text class="tm" x="434" y="141">Changed</text>
  <path class="ln" d="M418 82 H346"/>
  <text class="tm" x="362" y="76">values</text>
  <path class="ln" d="M418 157 H346"/>
  <text class="tm" x="360" y="151">Changed</text>

  <path class="ln" d="M120 182 V210 H500 V184"/>
  <text class="tm" x="510" y="214">Set</text>

  <path class="ln" style="marker-end: none" d="M60 182 V236 H678"/>
  <path class="ln" d="M86 236 V256"/>
  <path class="ln" d="M234 236 V256"/>
  <path class="ln" d="M382 236 V256"/>
  <path class="ln" d="M530 236 V256"/>
  <path class="ln" d="M678 236 V256"/>

  <rect class="box" x="16" y="258" width="140" height="44" rx="6"/>
  <text class="t" x="28" y="276">Accounts</text>
  <text class="tm" x="28" y="292">system bus, passwd</text>
  <rect class="box" x="164" y="258" width="140" height="44" rx="6"/>
  <text class="t" x="176" y="276">pactl</text>
  <text class="tm" x="176" y="292">PipeWire or Pulse</text>
  <rect class="box" x="312" y="258" width="140" height="44" rx="6"/>
  <text class="t" x="324" y="276">permission store</text>
  <text class="tm" x="324" y="292">Privacy pane</text>
  <rect class="box" x="460" y="258" width="140" height="44" rx="6"/>
  <text class="t" x="472" y="276">LocalSearch</text>
  <text class="tm" x="472" y="292">through otto-search</text>
  <rect class="box" x="608" y="258" width="140" height="44" rx="6"/>
  <text class="t" x="620" y="276">files and units</text>
  <text class="tm" x="620" y="292">toml, systemctl --user</text>
</svg>
