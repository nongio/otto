<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="Otto render loop: wake sources, render decision, present, frame callbacks">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .box  { fill: #f6f8fa; stroke: #8b949e; stroke-width: 1.4; }
    .acc  { fill: #ddf4ff; stroke: #218bff; stroke-width: 1.4; }
    .warn { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1.4; }
    .t    { fill: #1f2328; font-size: 13px; }
    .tb   { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .tm   { fill: #656d76; font-size: 11px; }
    .ln   { stroke: #8b949e; stroke-width: 1.4; fill: none; marker-end: url(#ah); }
    .lnd  { stroke: #8b949e; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; marker-end: url(#ah); }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #6e7681; }
      .acc { fill: #10243b; stroke: #388bfd; }
      .warn{ fill: #2d2200; stroke: #b08800; }
      .t, .tb { fill: #e6edf3; }
      .tm  { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <text class="tb" x="20" y="24">Something wakes the loop</text>
  <rect class="box" x="20" y="34" width="160" height="46" rx="7"/>
  <text class="t"  x="32" y="54">Client commit</text>
  <text class="tm" x="32" y="70">surface changed</text>

  <rect class="box" x="196" y="34" width="160" height="46" rx="7"/>
  <text class="t"  x="208" y="54">Input event</text>
  <text class="tm" x="208" y="70">pointer, key, gesture</text>

  <rect class="box" x="372" y="34" width="160" height="46" rx="7"/>
  <text class="t"  x="384" y="54">Animation tick</text>
  <text class="tm" x="384" y="70">lay-rs transaction</text>

  <rect class="box" x="548" y="34" width="192" height="46" rx="7"/>
  <text class="t"  x="560" y="54">Repaint timer / page flip</text>
  <text class="tm" x="560" y="70">udev only</text>

  <path class="ln" d="M100 80 L100 96 L380 96 L380 112"/>
  <path class="ln" d="M276 80 L276 96"/>
  <path class="ln" d="M452 80 L452 96"/>
  <path class="ln" d="M644 80 L644 96 L384 96"/>

  <rect class="box" x="180" y="112" width="400" height="44" rx="7"/>
  <text class="t"  x="196" y="132">calloop dispatch</text>
  <text class="tm" x="196" y="149">schedule_event_loop_dispatch() forces a wake even during a long timeout</text>

  <path class="ln" d="M380 156 L380 182"/>

  <rect class="acc" x="180" y="182" width="400" height="62" rx="7"/>
  <text class="t"  x="196" y="203">Render decision</text>
  <text class="tm" x="196" y="220">scene damage? · forced full redraw? · surface-backed cursor? · DnD icon?</text>
  <text class="tm" x="196" y="236">screencopy pending piggybacks — it never forces a frame of its own</text>

  <path class="lnd" d="M180 213 L120 213 L120 300"/>
  <rect class="warn" x="20" y="300" width="200" height="46" rx="7"/>
  <text class="t"  x="34" y="320">no → skip the frame</text>
  <text class="tm" x="34" y="336">idle desktop costs nothing</text>

  <path class="ln" d="M380 244 L380 272"/>
  <text class="tm" x="392" y="264">yes</text>

  <rect class="box" x="240" y="272" width="280" height="34" rx="7"/>
  <text class="t"  x="256" y="293">render_output → present</text>

  <path class="ln" d="M380 306 L380 330"/>

  <rect class="box" x="240" y="330" width="280" height="46" rx="7"/>
  <text class="t"  x="256" y="350">post_repaint</text>
  <text class="tm" x="256" y="366">wl_callback done + wp_presentation feedback</text>

  <path class="ln" d="M520 353 L640 353 L640 120 L580 120"/>
  <text class="tm" x="240" y="398">clients repaint → their next commit wakes the loop again</text>
</svg>
