<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="otto-rdp: PipeWire capture and a GStreamer H.264 encoder feed ironrdp-server; remote input returns through virtual-pointer and virtual-keyboard, and a tray indicator shows while a client is served">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .box  { fill: #f6f8fa; stroke: #8b949e; stroke-width: 1.4; }
    .acc  { fill: #ddf4ff; stroke: #218bff; stroke-width: 1.4; }
    .grp  { fill: none; stroke: #8b949e; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .t    { fill: #1f2328; font-size: 13px; }
    .tb   { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .tm   { fill: #656d76; font-size: 11px; }
    .ln   { stroke: #8b949e; stroke-width: 1.4; fill: none; marker-end: url(#ah); }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #6e7681; }
      .acc { fill: #10243b; stroke: #388bfd; }
      .grp { stroke: #6e7681; }
      .t, .tb { fill: #e6edf3; }
      .tm  { fill: #9198a1; }
      .ln  { stroke: #8b949e; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <text class="tb" x="16" y="28">Otto</text>
  <text class="tb" x="206" y="28">otto-rdp</text>
  <text class="tb" x="616" y="28">Peers</text>
  <rect class="grp" x="196" y="38" width="400" height="308" rx="10"/>

  <rect class="box" x="16" y="52" width="162" height="52" rx="6"/>
  <text class="tb" x="28" y="74">org.otto.ScreenCast</text>
  <text class="tm" x="28" y="92">physical outputs</text>
  <rect class="box" x="16" y="124" width="162" height="124" rx="6"/>
  <text class="tb" x="28" y="172">PipeWire</text>
  <text class="tm" x="28" y="190">the output's video node,</text>
  <text class="tm" x="28" y="206">otto.output.name</text>
  <rect class="box" x="16" y="272" width="162" height="68" rx="6"/>
  <text class="tb" x="28" y="292">Wayland input</text>
  <text class="tm" x="28" y="310">zwlr_virtual_pointer_v1</text>
  <text class="tm" x="28" y="326">zwp_virtual_keyboard_v1</text>

  <rect class="box" x="210" y="52" width="176" height="52" rx="6"/>
  <text class="tb" x="224" y="74">node lookup</text>
  <text class="tm" x="224" y="92">discover.rs, screencast.rs</text>
  <rect class="acc" x="210" y="124" width="176" height="52" rx="6"/>
  <text class="tb" x="224" y="146">pipewire_capture</text>
  <text class="tm" x="224" y="164">BGRx frames, gpu_import</text>
  <rect class="acc" x="210" y="196" width="176" height="52" rx="6"/>
  <text class="tb" x="224" y="218">h264.rs</text>
  <text class="tm" x="224" y="236">GStreamer, VA-API or NVENC</text>
  <rect class="acc" x="210" y="280" width="176" height="52" rx="6"/>
  <text class="tb" x="224" y="302">wl-input thread</text>
  <text class="tm" x="224" y="320">wl_input.rs</text>

  <rect class="acc" x="404" y="124" width="178" height="124" rx="6"/>
  <text class="tb" x="418" y="148">ironrdp-server</text>
  <text class="tm" x="418" y="172">rdp.rs: display, input</text>
  <text class="tm" x="418" y="190">egfx.rs: AVC420 channel</text>
  <text class="tm" x="418" y="208">tls.rs: certificate</text>
  <rect class="acc" x="404" y="280" width="178" height="52" rx="6"/>
  <text class="tb" x="418" y="302">indicator.rs</text>
  <text class="tm" x="418" y="320">Stop Sharing menu</text>

  <rect class="box" x="616" y="124" width="130" height="56" rx="6"/>
  <text class="tb" x="628" y="146">RDP client</text>
  <text class="tm" x="628" y="164">TCP, TLS</text>
  <rect class="box" x="616" y="280" width="130" height="52" rx="6"/>
  <text class="tb" x="628" y="302">tray host</text>
  <text class="tm" x="628" y="320">SNI, dbusmenu</text>

  <path class="ln" d="M210 78 H180"/>
  <path class="ln" d="M178 150 H208"/>
  <path class="ln" d="M178 222 H208"/>
  <path class="ln" d="M298 176 V194"/>
  <path class="ln" d="M386 150 H402"/>
  <path class="ln" d="M386 222 H402"/>
  <path class="ln" d="M582 144 H614"/>
  <path class="ln" d="M616 166 H584"/>
  <path class="ln" d="M430 248 L378 278"/>
  <path class="ln" d="M520 248 V278"/>
  <path class="ln" d="M210 306 H180"/>
  <path class="ln" d="M582 306 H614"/>
</svg>
