<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="Dock data flow from workspace model to rendered layers">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .box  { fill: #f6f8fa; stroke: #8b949e; stroke-width: 1.4; }
    .acc  { fill: #ddf4ff; stroke: #218bff; stroke-width: 1.4; }
    .t    { fill: #1f2328; font-size: 13px; }
    .tb   { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .tm   { fill: #656d76; font-size: 11px; }
    .ln   { stroke: #8b949e; stroke-width: 1.4; fill: none; marker-end: url(#ah); }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #6e7681; }
      .acc { fill: #10243b; stroke: #388bfd; }
      .t, .tb { fill: #e6edf3; }
      .tm  { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <text class="tb" x="20" y="24">State flows one way; only pointer events flow back</text>

  <rect class="box" x="20" y="40" width="210" height="58" rx="7"/>
  <text class="t"  x="34" y="62">Workspaces</text>
  <text class="tm" x="34" y="79">window mapped / minimized /</text>
  <text class="tm" x="34" y="93">focused → clone WorkspacesModel</text>

  <path class="ln" d="M230 69 L272 69"/>
  <text class="tm" x="236" y="60">notify</text>

  <rect class="box" x="272" y="40" width="210" height="58" rx="7"/>
  <text class="t"  x="286" y="62">DockView::notify</text>
  <text class="tm" x="286" y="79">Observer&lt;WorkspacesModel&gt;;</text>
  <text class="tm" x="286" y="93">pushes onto an async channel</text>

  <path class="ln" d="M482 69 L524 69"/>

  <rect class="acc" x="524" y="40" width="216" height="58" rx="7"/>
  <text class="t"  x="538" y="62">Throttled task</text>
  <text class="tm" x="538" y="79">takes the latest snapshot every</text>
  <text class="tm" x="538" y="93">0.5 s — transients never redraw</text>

  <path class="ln" d="M632 98 L632 122 L380 122 L380 142"/>

  <rect class="box" x="230" y="142" width="300" height="58" rx="7"/>
  <text class="t"  x="244" y="164">Build DockModel</text>
  <text class="tm" x="244" y="181">launchers · running_apps · minimized_windows,</text>
  <text class="tm" x="244" y="195">resolved through ApplicationsInfo (.desktop files)</text>

  <path class="ln" d="M380 200 L380 224"/>

  <rect class="acc" x="230" y="224" width="300" height="58" rx="7"/>
  <text class="t"  x="244" y="246">render_dock()</text>
  <text class="tm" x="244" y="263">recomputes icon sizes, creates/removes lay-rs layers,</text>
  <text class="tm" x="244" y="277">animates stale ones out instead of popping them</text>

  <path class="ln" d="M120 224 L120 102"/>
  <rect class="box" x="20" y="224" width="196" height="58" rx="7"/>
  <text class="t"  x="34" y="246">Pointer</text>
  <text class="tm" x="34" y="263">hover → magnification;</text>
  <text class="tm" x="34" y="277">click → focus_app / unminimize</text>
  <text class="tm" x="130" y="150">calls back into</text>
  <text class="tm" x="130" y="164">Workspaces</text>
</svg>
