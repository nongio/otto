<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="otto-agents-kit: inside each host process, the Ask chat, its log and the session feed talk to otto-agents on a connection thread that wakes the host's loop">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .box  { fill: #f6f8fa; stroke: #8b949e; stroke-width: 1.4; }
    .acc  { fill: #ddf4ff; stroke: #218bff; stroke-width: 1.4; }
    .grp  { fill: none; stroke: #8b949e; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .t    { fill: #1f2328; font-size: 13px; }
    .tb   { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .tm   { fill: #656d76; font-size: 11px; }
    .ln   { stroke: #8b949e; stroke-width: 1.4; fill: none; marker-end: url(#ah); }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #6e7681; }
      .acc { fill: #10243b; stroke: #388bfd; }
      .grp { stroke: #6e7681; }
      .t, .tb { fill: #e6edf3; }
      .tm  { fill: #9198a1; }
      .ln  { stroke: #8b949e; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <text class="tb" x="16" y="28">Hosts</text>
  <text class="tb" x="216" y="28">otto-agents-kit, in a host's process</text>
  <text class="tb" x="596" y="28">Talks to</text>
  <rect class="grp" x="206" y="38" width="370" height="278" rx="10"/>

  <rect class="box" x="16" y="52" width="170" height="44" rx="6"/>
  <text class="t" x="28" y="70">otto-launcher</text>
  <text class="tm" x="28" y="86">Ask, agents mode</text>
  <rect class="box" x="16" y="110" width="170" height="44" rx="6"/>
  <text class="t" x="28" y="128">otto-canvas</text>
  <text class="tm" x="28" y="144">session list</text>
  <rect class="box" x="16" y="168" width="170" height="44" rx="6"/>
  <text class="t" x="28" y="186">otto-preview</text>
  <text class="tm" x="28" y="202">Studio's chat</text>
  <path class="ln" d="M186 74 H218"/>
  <path class="ln" d="M186 132 L218 88"/>
  <path class="ln" d="M186 190 L218 98"/>

  <rect class="box" x="220" y="52" width="160" height="56" rx="6"/>
  <text class="tb" x="232" y="74">host's own loop</text>
  <text class="tm" x="232" y="92">window, field, Return</text>

  <rect class="acc" x="400" y="52" width="162" height="56" rx="6"/>
  <text class="tb" x="412" y="74">link: Link</text>
  <text class="tm" x="412" y="90">connection thread,</text>
  <text class="tm" x="412" y="103">wakes the loop</text>
  <path class="ln" d="M398 80 H382"/>
  <path class="ln" d="M380 150 H390 V100 H398"/>
  <path class="ln" d="M481 132 V110"/>

  <rect class="acc" x="220" y="132" width="160" height="48" rx="6"/>
  <text class="tb" x="232" y="152">chat: Ask</text>
  <text class="tm" x="232" y="168">requests, questions</text>
  <path class="ln" d="M300 108 V130"/>

  <rect class="acc" x="220" y="196" width="160" height="48" rx="6"/>
  <text class="tb" x="232" y="216">log: ChatView</text>
  <text class="tm" x="232" y="232">laid out at host width</text>
  <path class="ln" d="M300 180 V194"/>

  <rect class="acc" x="220" y="258" width="160" height="48" rx="6"/>
  <text class="tb" x="232" y="278">keys, dictation</text>
  <text class="tm" x="232" y="294">list keys, Ctrl+D</text>

  <rect class="acc" x="400" y="132" width="162" height="48" rx="6"/>
  <text class="tb" x="412" y="152">sessions</text>
  <text class="tm" x="412" y="168">SessionFeed, rows</text>

  <rect class="acc" x="400" y="258" width="162" height="48" rx="6"/>
  <text class="tb" x="412" y="278">opener</text>
  <text class="tm" x="412" y="294">Ask or Studio</text>
  <path class="ln" d="M481 180 V256"/>

  <rect class="box" x="596" y="52" width="150" height="56" rx="6"/>
  <text class="t" x="608" y="72">otto-agents</text>
  <text class="tm" x="608" y="88">AHP, through</text>
  <text class="tm" x="608" y="101">otto-agents-client</text>
  <path class="ln" d="M562 80 H594"/>

  <rect class="box" x="596" y="196" width="150" height="48" rx="6"/>
  <text class="t" x="608" y="216">otto-kit, otto-md-kit</text>
  <text class="tm" x="608" y="232">drawing, Markdown</text>
  <path class="ln" d="M380 220 H594"/>

  <rect class="box" x="596" y="258" width="150" height="48" rx="6"/>
  <text class="t" x="608" y="278">spawned apps</text>
  <text class="tm" x="608" y="294">launcher, otto-preview</text>
  <path class="ln" d="M562 282 H594"/>
</svg>
